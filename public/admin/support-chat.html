<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DARVOZ Support</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f6f7;
    color:#20252b;
}

.support-page{
    width:100%;
    max-width:750px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    display:flex;
    flex-direction:column;
}

/* ==========================================
   HEADER
========================================== */

.support-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 18px;

    border-bottom:1px solid #eceef0;

    background:#fff;

    position:sticky;
    top:0;

    z-index:10;
}

.support-profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.support-avatar{
    width:46px;
    height:46px;

    border-radius:50%;

    background:#ff5a00;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;
}

.support-info h2{
    font-size:16px;
    margin-bottom:4px;
}

.support-info p{
    font-size:12px;
    color:#6d747c;
}

.online-dot{
    display:inline-block;

    width:7px;
    height:7px;

    background:#22b35c;

    border-radius:50%;

    margin-right:4px;
}

/* ==========================================
   ORDER / GENERAL BADGE
========================================== */

.order-badge{
    background:#fff4ed;

    color:#ff5a00;

    border:1px solid #ffd5bd;

    padding:7px 10px;

    border-radius:10px;

    font-size:11px;

    font-weight:600;

    white-space:nowrap;
}

/* ==========================================
   CUSTOMER INFO
========================================== */

.order-info{
    margin:14px;

    padding:13px 15px;

    background:#fff8f4;

    border:1px solid #ffe1d0;

    border-radius:15px;

    font-size:13px;

    line-height:1.6;
}

.order-info strong{
    color:#ff5a00;
}

/* ==========================================
   CHAT
========================================== */

.support-chat{
    flex:1;

    padding:18px 15px 100px;

    display:flex;
    flex-direction:column;

    gap:14px;

    overflow-y:auto;
}

.message{
    display:flex;

    width:100%;
}

.message.customer{
    justify-content:flex-start;
}

.message.support{
    justify-content:flex-end;
}

.bubble{
    max-width:80%;

    padding:11px 14px;

    font-size:13px;

    line-height:1.5;

    border-radius:17px;

    white-space:pre-wrap;

    word-break:break-word;
}

.customer .bubble{
    background:#f1f3f4;

    color:#252a30;

    border-bottom-left-radius:4px;
}

.support .bubble{
    background:#ff5a00;

    color:#fff;

    border-bottom-right-radius:4px;
}

/* ==========================================
   INPUT
========================================== */

.chat-input-area{
    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    max-width:750px;

    background:#fff;

    border-top:1px solid #eceef0;

    padding:11px 13px;

    display:flex;

    align-items:center;

    gap:10px;
}

.chat-input{
    flex:1;

    border:1px solid #e1e4e6;

    outline:none;

    padding:12px 14px;

    border-radius:22px;

    font-size:13px;
}

.chat-input:focus{
    border-color:#ff5a00;
}

.send-btn{
    width:44px;
    height:44px;

    border:none;

    border-radius:50%;

    background:#ff5a00;

    color:#fff;

    cursor:pointer;

    font-size:16px;
}

.send-btn:disabled{
    opacity:.6;

    cursor:not-allowed;
}

/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px){

    .support-page{
        max-width:none;
    }

    .support-header{
        padding:13px;
    }

    .order-info{
        margin:10px 12px;
    }

    .support-chat{
        padding:15px 12px 90px;
    }

}

</style>

</head>


<body>


<div class="support-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="support-header">

        <div class="support-profile">

            <div class="support-avatar">
                <i class="fa-solid fa-headset"></i>
            </div>

            <div class="support-info">

                <h2>
                    DARVOZ Support
                </h2>

                <p>
                    <span class="online-dot"></span>
                    Support Console
                </p>

            </div>

        </div>


        <div style="display:flex;align-items:center;gap:8px;">

    <div
        class="order-badge"
        id="orderBadge"
    >
        Loading...
    </div>

    <button
        id="closeChatBtn"
        style="
            border:1px solid #ffd5bd;
            background:#fff4ed;
            color:#ff5a00;
            width:36px;
            height:36px;
            border-radius:10px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        "
        title="Close conversation"
    >
        <i class="fa-solid fa-check"></i>
    </button>

</div>

    </div>


    <!-- =====================================
         CUSTOMER / ORDER INFORMATION
    ====================================== -->

    <div
        class="order-info"
        id="orderInfo"
    >
        Loading customer support request...
    </div>


    <!-- =====================================
         CHAT
    ====================================== -->

    <div
        class="support-chat"
        id="supportChat"
    ></div>


    <!-- =====================================
         MESSAGE INPUT
    ====================================== -->

    <div class="chat-input-area">

        <input
            type="text"
            id="messageInput"
            class="chat-input"
            placeholder="Reply to customer..."
            autocomplete="off"
        >

        <button
            class="send-btn"
            id="sendBtn"
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </div>


</div>


<script>

const API = window.location.origin;


// =====================================================
// ELEMENTS
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const chatId =
    params.get("chatId");


const supportChat =
    document.getElementById(
        "supportChat"
    );

const orderBadge =
    document.getElementById(
        "orderBadge"
    );

const orderInfo =
    document.getElementById(
        "orderInfo"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


// =====================================================
// LOAD SUPPORT CHAT
// =====================================================

async function loadSupportChat(){

    if(!chatId){

        orderBadge.innerText =
            "Invalid";

        orderInfo.innerText =
            "Invalid DARVOZ Support link.";

        return;
    }


    try{

        const response =
            await fetch(
                `${API}/api/support/${encodeURIComponent(chatId)}`
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Support chat not found"
            );
        }


        const chat =
            data.chat;


        // ==========================================
        // ORDER OR GENERAL SUPPORT
        // ==========================================

        if(chat.order_id){

            orderBadge.innerText =
                `Order #${chat.order_id}`;


            orderInfo.innerHTML = `
                <strong>
                    ${escapeHTML(
                        chat.customer_name ||
                        "DARVOZ Customer"
                    )}
                </strong>

                needs your help regarding

                <strong>
                    Order #${chat.order_id}
                </strong>.
            `;

        }else{

            orderBadge.innerText =
                "General Support";


            orderInfo.innerHTML = `
                <strong>
                    ${escapeHTML(
                        chat.customer_name ||
                        "DARVOZ Customer"
                    )}
                </strong>

                requested

                <strong>
                    DARVOZ General Support
                </strong>.
            `;
        }


        // ==========================================
        // RENDER MESSAGES
        // ==========================================

        supportChat.innerHTML = "";


        if(
            Array.isArray(chat.messages)
        ){

            chat.messages.forEach(
                item => {

                    const sender =
                        item.sender === "support"
                            ? "support"
                            : "customer";


                    addMessage(
                        sender,
                        item.message
                    );

                }
            );

        }

    }catch(error){

        console.error(
            "Load support chat error:",
            error
        );


        orderBadge.innerText =
            "Error";

        orderInfo.innerText =
            "Unable to load this support conversation.";

    }

}


// =====================================================
// ADD MESSAGE
// =====================================================

function addMessage(
    sender,
    text
){

    const message =
        document.createElement(
            "div"
        );

    message.className =
        `message ${sender}`;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    // SAFE TEXT
    bubble.textContent =
        text ?? "";


    message.appendChild(
        bubble
    );


    supportChat.appendChild(
        message
    );


    supportChat.scrollTop =
        supportChat.scrollHeight;
}


// =====================================================
// SEND SUPPORT MESSAGE
// =====================================================

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(
        !text ||
        !chatId
    ){

        return;
    }


    sendBtn.disabled =
        true;


    try{

        const response =
            await fetch(
                `${API}/api/support/${encodeURIComponent(chatId)}/message`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:text
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Failed to send reply"
            );
        }


        addMessage(
            "support",
            text
        );


        messageInput.value =
            "";


        messageInput.focus();


    }catch(error){

        console.error(
            "Send message error:",
            error
        );


        alert(
            "Unable to send reply. Please try again."
        );

    }finally{

        sendBtn.disabled =
            false;

    }

}


// =====================================================
// EVENTS
// =====================================================

sendBtn.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }

    }
);


// =====================================================
// START
// =====================================================

loadSupportChat();

</script>


</body>

</html>
