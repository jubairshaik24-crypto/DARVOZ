<!DOCTYPE html>
<html>
<head>

<title>Partner Approvals</title>

<style>

body{

font-family:Poppins,sans-serif;

background:#f5f5f5;

padding:20px;

}

.card{

background:white;

padding:20px;

margin-bottom:15px;

border-radius:12px;

box-shadow:0 4px 12px rgba(0,0,0,.1);

}

button{

padding:10px 15px;

border:none;

margin-top:10px;

margin-right:10px;

border-radius:8px;

cursor:pointer;

}

.approve{

background:green;

color:white;

}

.reject{

background:red;

color:white;

}

.commission-field{
display:flex;
align-items:center;
gap:10px;
margin-top:16px;
font-size:14px;
font-weight:600;
}

.commission-field input{
width:110px;
padding:9px 10px;
border:1px solid #ccd4d0;
border-radius:8px;
font:inherit;
}

</style>

</head>

<body>

<h2>Pending Partner Approvals</h2>

<div id="partners"></div>

<script>

async function loadPartners(){

const response=await fetch(
`${API}/admin/pending-partners`
);
const data=await response.json();

let html="";

data.forEach(partner=>{

html+=`

<div class="card">

<h3>${partner.restaurant_name}</h3>

<p><b>Owner:</b> ${partner.owner_name}</p>

<p><b>Category:</b> ${partner.business_type}</p>

<p><b>Mobile:</b> ${partner.mobile}</p>

<p><b>Email:</b> ${partner.email}</p>

<label class="commission-field" for="commission-${partner.id}">
Restaurant commission
<input
type="number"
id="commission-${partner.id}"
min="0"
max="100"
step="0.1"
placeholder="Enter %"
required>
<span>%</span>
</label>

<button
class="approve"
onclick="approve(${partner.id})">

Approve

</button>

<button
class="reject"
onclick="rejectPartner(${partner.id})">

Reject

</button>

</div>

`;

});

document.getElementById("partners").innerHTML=html;

}

async function approve(id){

const input = document.getElementById(`commission-${id}`);
const commissionPercent = Number(input?.value);
if(
    !input ||
    input.value.trim() === "" ||
    !Number.isFinite(commissionPercent) ||
    commissionPercent < 0 ||
    commissionPercent > 100
){
    alert("Enter a commission percentage from 0 to 100 before approving.");
    input?.focus();
    return;
}

try{
    const response = await fetch(
        `${API}/admin/approve-partner/${id}`,
        {
            method:"PUT",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ commission_percent: commissionPercent })
        }
    );
    const result = await response.json();
    if(!response.ok || !result.success){
        alert(result.message || "Unable to approve partner.");
        return;
    }
    await loadPartners();
}
catch(error){
    console.error("PARTNER APPROVAL ERROR:", error);
    alert("Unable to approve partner. Please try again.");
}

}

async function rejectPartner(id){

await fetch(
`${API}/admin/reject-partner/${id}`,
{
method:"DELETE"

}

);

loadPartners();

}

loadPartners();

</script>

</body>
</html>
