<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARVOZ | Become Partner</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#ececec;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:390px;
min-height:100vh;
background:#fff;
overflow:hidden;
position:relative;
box-shadow:0 0 40px rgba(0,0,0,.12);
}

/* Header */

.header{
padding:22px;
display:flex;
align-items:center;
gap:15px;
background:white;
box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.logo{
width:55px;
height:55px;
border-radius:18px;
background:#ff6b00;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
font-size:28px;
font-weight:700;
}

.header h2{
font-size:26px;
font-weight:800;
}

.header p{
font-size:13px;
color:#888;
}

/* Hero */

.hero{
padding:25px;
text-align:center;
}

.hero img{
width:180px;
margin-bottom:20px;
}

.hero h1{
font-size:34px;
font-weight:800;
line-height:1.2;
color:#222;
}

.hero span{
color:#ff6b00;
}

.hero p{
margin-top:15px;
color:#666;
font-size:15px;
line-height:1.7;
}

/* Benefits */

.benefits{
margin:25px;
background:#fff8f2;
border-radius:22px;
padding:20px;
}

.item{
display:flex;
align-items:center;
gap:15px;
margin-bottom:18px;
font-size:16px;
font-weight:600;
color:#444;
}

.item:last-child{
margin-bottom:0;
}

.item i{
width:42px;
height:42px;
background:#ff6b00;
color:white;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
}

/* Button */

.start-btn{
margin:25px;
width:calc(100% - 50px);
height:56px;
border:none;
border-radius:18px;
background:#ff6b00;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
}

.start-btn:hover{
background:#e85d00;
}

/* Bottom */

.bottom{
text-align:center;
padding-bottom:30px;
font-size:15px;
}

.bottom a{
text-decoration:none;
color:#ff6b00;
font-weight:700;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="logo">
D
</div>

<div>

<h2>DARVOZ</h2>

<p>One App. Every Need.</p>

</div>

</div>

<div class="hero">

<img src="images/partner.png">

<h1>
Grow Your <span>Business</span>
with DARVOZ
</h1>

<p>
Join DARVOZ and reach thousands of customers across your city.
</p>

</div>

<div class="benefits">

<div class="item">
<i class="fa-solid fa-bag-shopping"></i>
More Daily Orders
</div>

<div class="item">
<i class="fa-solid fa-wallet"></i>
Fast Weekly Payments
</div>

<div class="item">
<i class="fa-solid fa-chart-line"></i>
Partner Dashboard
</div>

<div class="item">
<i class="fa-solid fa-bell"></i>
Real-time Order Alerts
</div>

</div>

<button class="start-btn" onclick="location.href='partner-business.html'">
Get Started
</button>

<div class="bottom">
Already Registered?
<a href="partner-login.html">Partner Login</a>
</div>

</div>

</body>
</html>
