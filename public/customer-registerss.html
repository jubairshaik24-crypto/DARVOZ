<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DARVOZ | Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:#fff7f2;display:flex;justify-content:center}
.page{width:100%;max-width:430px;height:100dvh;background:#fff;overflow:hidden}
.top{height:190px;background:linear-gradient(135deg,#ff7a00,#ff5500);padding:22px 25px;color:#fff;position:relative}
.top:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:#ffffff18;right:-80px;top:-80px}
.back{position:relative;z-index:2;width:42px;height:42px;border:0;border-radius:12px;background:#ffffff2e;color:#fff;font-size:20px}
.brand{position:relative;z-index:2;margin-top:20px}.brand h1{font-size:30px}.brand p{font-size:13px}
.card{position:relative;z-index:3;margin-top:-28px;height:calc(100dvh - 162px);background:#fff;border-radius:30px 30px 0 0;padding:25px 24px;overflow-y:auto}
h2{font-size:23px}.sub{font-size:12px;color:#888;margin:4px 0 20px}
.group{margin-bottom:14px}label,.glabel{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:7px}
.box{height:52px;border:1px solid #e5e5e5;border-radius:14px;display:flex;align-items:center;padding:0 14px}
.box:focus-within{border-color:#ff6b00;box-shadow:0 0 0 3px #ff6b0012}
.box i{color:#ff6b00;width:28px}.box input{border:0;outline:0;width:100%;font-size:14px}
.gender{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gender button{height:48px;border:1px solid #e5e5e5;border-radius:13px;background:#fff;font-size:12px;font-weight:600}
.gender button.active{border-color:#ff6b00;background:#fff6ef;color:#ff6b00}
.progress{margin:18px 0 17px}.line{height:5px;background:#eee;border-radius:10px;position:relative}.fill{height:100%;width:0;background:linear-gradient(90deg,#ff7a00,#ff5500);border-radius:10px;transition:.3s}
.dots{display:flex;justify-content:space-between;margin-top:-8px}.dot{width:11px;height:11px;border-radius:50%;background:#ddd;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}.dot.on{background:#ff6b00;box-shadow:0 0 0 1px #ff6b00}
.msg{text-align:center;font-size:13px;font-weight:600;margin-top:8px}.msg strong{color:#ff6b00}.status{text-align:center;font-size:10px;color:#888}
.terms{display:flex;gap:8px;margin:2px 0 17px}.terms input{accent-color:#ff6b00;margin-top:3px}.terms label{font-size:10px;line-height:1.5;color:#777}.terms a{color:#ff6b00;text-decoration:none;font-weight:600}
.register{width:100%;height:53px;border:0;border-radius:14px;background:#ff6b00;color:#fff;font-size:15px;font-weight:700}
.bottom{text-align:center;color:#777;font-size:12px;margin-top:15px}.bottom a{color:#ff6b00;font-weight:700;text-decoration:none}
@media(min-width:500px){body{padding:20px}.page{border-radius:25px;box-shadow:0 10px 40px #0002}}
</style>
</head>
<body>
<div class="page">
<div class="top">
<button class="back" onclick="goBack()">←</button>
<div class="brand"><h1>DARVOZ</h1><p>One App. Every Need.</p></div>
</div>

<div class="card">
<h2>Create your account 🎁</h2>
<p class="sub">Complete your profile and earn 500 DARVOZ Coins!</p>

<div class="group">
<label>Full Name <b style="color:red">*</b></label>
<div class="box"><i>👤</i><input id="name" type="text" placeholder="Enter your full name"></div>
</div>

<div class="group">
<label>Email Address <b style="color:red">*</b></label>
<div class="box"><i>✉️</i><input id="email" type="email" placeholder="Enter your email address"></div>
</div>

<div class="group">
<span class="glabel">Gender <b style="color:red">*</b></span>
<div class="gender">
<button data-g="Male" onclick="gender(this)">♂ Male</button>
<button data-g="Female" onclick="gender(this)">♀ Female</button>
<button data-g="Other" onclick="gender(this)">Other</button>
</div>
</div>

<div class="group">
<label>Referral Code <span style="color:#999;font-weight:400">(Optional)</span></label>
<div class="box"><i>🎁</i><input id="referralCode" type="text" placeholder="Enter referral code"></div>
</div>

<div class="progress">
<div class="line"><div class="fill" id="fill"></div></div>
<div class="dots"><span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span><span class="dot" id="d4"></span></div>
<div class="msg" id="msg">Complete your profile to earn <strong>500 Coins</strong> 🎁</div>
<div class="status" id="status">0 / 500 Coins unlocked</div>
</div>

<div class="terms">
<input id="terms" type="checkbox">
<label for="terms">I agree to the <a href="terms.html">Terms &amp; Conditions</a> and <a href="privacy.html">Privacy Policy</a></label>
</div>

<button class="register" id="registerBtn" onclick="register()">Create Account →</button>
<div class="bottom">Already have an account? <a href="customer-login.html">Login</a></div>
</div>
</div>

<script>
const API=window.location.origin;
let selectedGender="";
let verifiedMobile="";

function referralFromLink(){
 const p=new URLSearchParams(location.search);
 return (p.get("ref")||p.get("referral")||p.get("referralCode")||
 localStorage.getItem("referralCode")||localStorage.getItem("pendingReferralCode")||"").trim().toUpperCase();
}

document.addEventListener("DOMContentLoaded",()=>{
 verifiedMobile=localStorage.getItem("registerMobile")||localStorage.getItem("otpMobile")||"";
 if(!verifiedMobile){alert("Please verify your mobile number first.");location.href="customer-login.html";return;}
 const code=referralFromLink();
 if(code){const x=document.getElementById("referralCode");x.value=code;x.readOnly=true;}
 updateProgress();
});

function gender(btn){
 document.querySelectorAll(".gender button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");selectedGender=btn.dataset.g;updateProgress();
}

function coins(){
 let n=document.getElementById("name").value.trim();
 let e=document.getElementById("email").value.trim();
 let c=0;
 if(n.length>=2)c+=200;
 if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e))c+=200;
 if(selectedGender)c+=100;
 return Math.min(c,500);
}

function updateProgress(){
 const c=coins();
 document.getElementById("fill").style.width=(c/500*100)+"%";
 document.getElementById("d1").classList.toggle("on",c>0);
 document.getElementById("d2").classList.toggle("on",c>=200);
 document.getElementById("d3").classList.toggle("on",c>=400);
 document.getElementById("d4").classList.toggle("on",c>=500);
 document.getElementById("status").textContent=c+" / 500 Coins unlocked";
 document.getElementById("msg").innerHTML=
 c===0?'Complete your profile to earn <strong>500 Coins</strong> 🎁':
 c===200?'Great! <strong>200 Coins</strong> unlocked 🎉':
 c===400?'Almost there! <strong>400 Coins</strong> unlocked 🔥':
 'Profile complete! <strong>500 Coins</strong> unlocked 🎉';
}
name.addEventListener("input",updateProgress);email.addEventListener("input",updateProgress);

async function register(){
 const btn=document.getElementById("registerBtn");
 const nameV=document.getElementById("name").value.trim();
 const emailV=document.getElementById("email").value.trim();
 const ref=document.getElementById("referralCode").value.trim().toUpperCase();
 if(nameV.length<2){alert("Please enter a valid name.");return;}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailV)){alert("Please enter a valid email address.");return;}
 if(!selectedGender){alert("Please select your gender.");return;}
 if(!document.getElementById("terms").checked){alert("Please accept the Terms & Conditions and Privacy Policy.");return;}
 let mobile=verifiedMobile.replace(/\D/g,"");if(mobile.startsWith("91")&&mobile.length===12)mobile=mobile.slice(2);
 if(!/^\d{10}$/.test(mobile)){alert("Please verify your mobile number again.");return;}
 const old=btn.innerHTML;btn.disabled=true;btn.innerHTML="Creating Account...";
 try{
  const response=await fetch(`${API}/customer/register`,{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name:nameV,mobile,email:emailV,gender:selectedGender,referralCode:ref||null})
  });
  const data=await response.json();
  if(!response.ok||!data.success){alert(data.message||"Registration failed.");return;}
  if(data.customer){
   if(data.customer.id)localStorage.setItem("customerId",String(data.customer.id));
   localStorage.setItem("customerName",data.customer.name||nameV);
   localStorage.setItem("mobile",data.customer.mobile||mobile);
   localStorage.setItem("customerEmail",data.customer.email||emailV);
   if(data.customer.gender)localStorage.setItem("customerGender",data.customer.gender);
   if(data.customer.referralCode)localStorage.setItem("myReferralCode",data.customer.referralCode);
  }
  localStorage.setItem("customerLoggedIn","true");
  localStorage.setItem("customerLoginTime",Date.now().toString());
  localStorage.removeItem("registerMobile");localStorage.removeItem("otpMobile");
  localStorage.removeItem("referralCode");localStorage.removeItem("pendingReferralCode");
  alert("Welcome to DARVOZ 🎉\n\n500 DARVOZ Coins added to your account!");
  location.href="index.html";
 }catch(err){console.error(err);alert("Unable to connect to server. Please try again.");}
 finally{btn.disabled=false;btn.innerHTML=old;}
}

function goBack(){
 localStorage.removeItem("registerMobile");localStorage.removeItem("otpMobile");
 location.href="customer-login.html";
}
</script>
</body>
</html>
