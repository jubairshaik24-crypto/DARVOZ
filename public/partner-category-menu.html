<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DARVOZ Business Menu</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f5f6fa;
    padding-bottom:100px;
}

/* =====================================================
HEADER
===================================================== */

.header{
    background:linear-gradient(135deg,#ff5a00,#ff7a00);
    color:white;
    padding:22px;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.headerTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.backBtn{
    width:46px;
    height:46px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
}

.addBtn{
    background:white;
    color:#ff5a00;
    border:none;
    padding:12px 18px;
    border-radius:14px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
}

.header h2{
    margin-top:18px;
    font-size:28px;
}

.header p{
    margin-top:5px;
    font-size:14px;
    opacity:.9;
}

/* =====================================================
SEARCH
===================================================== */

.search{
    padding:18px;
}

.search input{
    width:100%;
    padding:15px 18px;
    border-radius:15px;
    border:1px solid #ddd;
    font-size:15px;
    outline:none;
    background:white;
}

/* =====================================================
STATS
===================================================== */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    padding:0 18px 18px;
}

.stat{
    background:white;
    border-radius:18px;
    padding:18px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.06);
}

.stat h3{
    font-size:26px;
    color:#ff5a00;
}

.stat p{
    margin-top:5px;
    font-size:13px;
    color:#666;
}

/* =====================================================
PRODUCT LIST
===================================================== */

#productList{
    padding:18px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:18px;
}

/* =====================================================
PRODUCT CARD
===================================================== */

.productCard{
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.productTop{
    display:flex;
    gap:15px;
}

.productImage{
    width:95px;
    height:95px;
    border-radius:15px;
    object-fit:cover;
    border:1px solid #eee;
    background:#fafafa;
}

.productInfo{
    flex:1;
    min-width:0;
}

.productInfo h3{
    font-size:19px;
    margin-bottom:8px;
    word-break:break-word;
}

.tag{
    display:inline-block;
    padding:6px 11px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    margin-right:5px;
    margin-bottom:5px;
}

.veg{
    background:#e8f5e9;
    color:#2e7d32;
}

.nonveg{
    background:#ffebee;
    color:#c62828;
}

.category{
    background:#fff3e0;
    color:#ef6c00;
}

/* =====================================================
PRICE
===================================================== */

.price{
    margin-top:12px;
    font-size:24px;
    font-weight:700;
    color:#222;
}

.offer{
    text-decoration:line-through;
    color:#888;
    font-size:14px;
    margin-right:7px;
}

/* =====================================================
VARIANTS
===================================================== */

.variantTitle{
    font-size:13px;
    color:#777;
    margin-top:12px;
    margin-bottom:7px;
    font-weight:600;
}

.variantContainer{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.variantBox{
    background:#fff7f0;
    border:1px solid #ffd8bd;
    border-radius:10px;
    padding:7px 10px;
    font-size:12px;
    font-weight:600;
}

.variantPrice{
    color:#ff5a00;
    margin-top:2px;
}

.variantOffer{
    color:#777;
    text-decoration:line-through;
    font-size:10px;
}

.variantStock{
    font-size:10px;
    color:#777;
    margin-top:2px;
}

/* =====================================================
STATUS
===================================================== */

.status{
    display:inline-block;
    margin-top:12px;
    padding:7px 13px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.available{
    background:#e8f5e9;
    color:#2e7d32;
}

.out{
    background:#ffebee;
    color:#c62828;
}

/* =====================================================
FEATURED
===================================================== */

.featured{
    display:inline-block;
    margin-top:9px;
    padding:6px 11px;
    border-radius:20px;
    background:#fff8e1;
    color:#ff9800;
    font-size:12px;
    font-weight:600;
}

/* =====================================================
BUTTONS
===================================================== */

.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.buttons button{
    flex:1;
    padding:13px;
    border:none;
    border-radius:14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.editBtn{
    background:#ff9800;
    color:white;
}

.deleteBtn{
    background:#f44336;
    color:white;
}

.editBtn:hover{
    background:#f57c00;
}

.deleteBtn:hover{
    background:#d32f2f;
}

/* =====================================================
FLOATING
===================================================== */

.floating{
    position:fixed;
    right:22px;
    bottom:95px;
    width:62px;
    height:62px;
    border-radius:50%;
    background:#ff5a00;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    z-index:50;
}

/* =====================================================
BOTTOM
===================================================== */

.bottom{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:white;
    padding:14px;
    box-shadow:0 -5px 15px rgba(0,0,0,.08);
    z-index:100;
}

.dashboardBtn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#ff5a00;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

/* =====================================================
EMPTY
===================================================== */

.empty{
    grid-column:1/-1;
    background:white;
    padding:50px 20px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.emptyIcon{
    font-size:70px;
}

.empty h2{
    margin-top:18px;
    color:#444;
}

.empty p{
    margin-top:8px;
    color:#777;
}

/* =====================================================
LOADING
===================================================== */

.loading{
    grid-column:1/-1;
    background:white;
    padding:55px 20px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.spinnerSmall{
    width:48px;
    height:48px;
    border:5px solid #eee;
    border-top:5px solid #ff5a00;
    border-radius:50%;
    margin:0 auto 18px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* =====================================================
ERROR
===================================================== */

.errorBox{
    grid-column:1/-1;
    background:white;
    padding:45px 20px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.errorIcon{
    font-size:55px;
}

.errorBox h2{
    margin-top:12px;
}

.errorBox p{
    color:#777;
    margin-top:7px;
}

/* =====================================================
MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modalBox{
    background:white;
    width:460px;
    max-width:95%;
    max-height:90vh;
    overflow-y:auto;
    border-radius:22px;
    padding:25px;
}

.modalBox h2{
    color:#222;
}

.modalInput{
    width:100%;
    padding:13px;
    margin-top:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:14px;
}

.modalLabel{
    display:block;
    margin-top:17px;
    font-weight:600;
    font-size:14px;
}

.previewImage{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:15px;
    margin-top:10px;
    border:1px solid #ddd;
}

.modalActions{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.cancelBtn,
.saveBtn{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    font-weight:600;
    cursor:pointer;
}

.cancelBtn{
    background:#eee;
    color:#333;
}

.saveBtn{
    background:#ff5a00;
    color:white;
}

/* =====================================================
GROCERY DEFAULT PRODUCT SELECTOR
===================================================== */

#grocerySelector{
    display:none;
    margin-bottom:18px;
}

.selectorTitle{
    font-size:14px;
    font-weight:700;
    color:#ff5a00;
    margin-bottom:8px;
}

.defaultProductSelect{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    background:white;
    font-size:14px;
}

/* =====================================================
CATEGORY SELECT
===================================================== */

#categorySelect{
    display:none;
}

/* =====================================================
VARIANT EDITOR
===================================================== */

#variantEditor{
    display:none;
    margin-top:20px;
}

.variantEditorTitle{
    color:#ff5a00;
    margin-bottom:12px;
    font-size:16px;
}

.variantRow{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr 42px;
    gap:7px;
    margin-bottom:10px;
}

.variantRow input,
.variantRow select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    min-width:0;
    font-size:12px;
}

.removeVariant{
    width:42px;
    height:42px;
    border:none;
    border-radius:10px;
    background:#ffebee;
    color:#f44336;
    font-size:18px;
    cursor:pointer;
}

.addVariant{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:2px dashed #ff5a00;
    border-radius:12px;
    background:#fff7f0;
    color:#ff5a00;
    font-weight:600;
    cursor:pointer;
}

/* =====================================================
UPLOAD LOADER
===================================================== */

.upload-loader{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:99999;
    align-items:center;
    justify-content:center;
}

.loader-box{
    background:white;
    width:320px;
    max-width:90%;
    padding:30px 25px;
    border-radius:22px;
    text-align:center;
}

.spinner{
    width:55px;
    height:55px;
    border:5px solid #eee;
    border-top:5px solid #ff5a00;
    border-radius:50%;
    margin:0 auto 20px;
    animation:spin 1s linear infinite;
}

.loader-box h3{
    color:#333;
}

.loader-box p{
    color:#777;
    font-size:13px;
    margin-top:7px;
}

/* =====================================================
MOBILE
===================================================== */

@media(max-width:768px){

    .stats{
        grid-template-columns:1fr;
    }

    #productList{
        grid-template-columns:1fr;
        padding:12px;
    }

    .productTop{
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    .productImage{
        width:120px;
        height:120px;
    }

    .buttons{
        flex-direction:column;
    }

    .header h2{
        font-size:24px;
    }

    .variantRow{
        grid-template-columns:1fr 1fr;
    }

    .variantRow input:nth-child(3),
    .variantRow input:nth-child(4),
    .variantRow select{
        grid-column:auto;
    }

}

</style>

</head>

<body>


<!-- =====================================================
HEADER
===================================================== -->

<div class="header">

    <div class="headerTop">

        <div
            class="backBtn"
            onclick="goBack()">

            ←

        </div>

        <button
            class="addBtn"
            onclick="openAddModal()">

            ＋ Add Product

        </button>

    </div>

    <h2 id="pageTitle">
        Loading...
    </h2>

    <p id="pageSubTitle">
        Loading business menu...
    </p>

</div>


<!-- =====================================================
SEARCH
===================================================== -->

<div class="search">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search Product...">

</div>


<!-- =====================================================
STATS
===================================================== -->

<div class="stats">

    <div class="stat">

        <h3 id="totalProducts">
            0
        </h3>

        <p>
            Total Products
        </p>

    </div>

    <div class="stat">

        <h3 id="availableProducts">
            0
        </h3>

        <p>
            Available
        </p>

    </div>

    <div class="stat">

        <h3 id="featuredProducts">
            0
        </h3>

        <p>
            Featured
        </p>

    </div>

</div>


<!-- =====================================================
PRODUCT LIST
===================================================== -->

<div id="productList">

    <div class="loading">

        <div class="spinnerSmall"></div>

        <h3>
            Loading Products...
        </h3>

        <p style="margin-top:7px;color:#777;">
            Please wait...
        </p>

    </div>

</div>


<!-- =====================================================
FLOATING BUTTON
===================================================== -->

<div
    class="floating"
    onclick="openAddModal()">

    +

</div>


<!-- =====================================================
BOTTOM
===================================================== -->

<div class="bottom">

    <button
        class="dashboardBtn"
        onclick="goBackToCategories()">

        ← Back To Categories

    </button>

</div>


<!-- =====================================================
ADD / EDIT MODAL
===================================================== -->

<div
    id="productModal"
    class="modal">

    <div class="modalBox">

        <h2 id="modalTitle">
            Add Product
        </h2>


        <!-- =================================================
        GROCERY DEFAULT PRODUCT SELECTOR
        ================================================= -->

        <div id="grocerySelector">

            <div class="selectorTitle">

                🛒 Select Grocery Product

            </div>

            <select
                id="defaultProductSelect"
                class="defaultProductSelect">

                <option value="">
                    Select product...
                </option>

            </select>

        </div>


        <!-- =================================================
        GROCERY CATEGORY
        ================================================= -->

        <select
            id="categorySelect"
            class="modalInput">

            <option value="">
                Select Category
            </option>

        </select>


        <!-- =================================================
        PRODUCT NAME
        ================================================= -->

        <input
            type="text"
            id="m_name"
            class="modalInput"
            placeholder="Product Name">


        <!-- =================================================
        TYPE
        ================================================= -->

        <select
            id="m_type"
            class="modalInput">

            <option value="Veg">
                Veg
            </option>

            <option value="Non Veg">
                Non Veg
            </option>

        </select>


        <!-- =================================================
        OLD CATEGORY INPUT
        ================================================= -->

        <input
            type="text"
            id="m_category"
            class="modalInput"
            placeholder="Category">


        <!-- =================================================
        NORMAL PRICE
        ================================================= -->

        <input
            type="number"
            id="m_price"
            class="modalInput"
            placeholder="Price">


        <input
            type="number"
            id="m_offer"
            class="modalInput"
            placeholder="Offer Price">


        <!-- =================================================
        IMAGE
        ================================================= -->

        <label class="modalLabel">

            Product Image

        </label>

        <img
            id="previewImage"
            class="previewImage"
            src="/images/other.jpg"
            onerror="this.src='/images/other.jpg'">


        <input
            type="file"
            id="m_image"
            accept="image/*"
            class="modalInput">


        <input
            type="hidden"
            id="m_image_name">


        <!-- =================================================
        FEATURED
        ================================================= -->

        <label
            style="
                display:flex;
                align-items:center;
                gap:10px;
                margin-top:18px;
                font-weight:600;
                font-size:14px;
            ">

            <input
                type="checkbox"
                id="m_featured">

            ⭐ Featured Product

        </label>


        <!-- =================================================
        NORMAL STATUS
        ================================================= -->

        <select
            id="m_status"
            class="modalInput">

            <option value="Available">
                🟢 Available
            </option>

            <option value="Out of Stock">
                🔴 Out of Stock
            </option>

        </select>


        <!-- =================================================
        GROCERY VARIANT EDITOR
        ================================================= -->

        <div id="variantEditor">

            <div class="variantEditorTitle">

                📦 Sizes, Prices & Stock

            </div>

            <div id="variantList"></div>

            <button
                type="button"
                class="addVariant"
                onclick="addVariantRow()">

                ＋ Add Size

            </button>

        </div>


        <!-- =================================================
        ACTIONS
        ================================================= -->

        <div class="modalActions">

            <button
                class="cancelBtn"
                onclick="closeModal()">

                Cancel

            </button>

            <button
                class="saveBtn"
                onclick="saveProduct()">

                💾 Save

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
UPLOAD LOADER
===================================================== -->

<div
    id="uploadLoader"
    class="upload-loader">

    <div class="loader-box">

        <div class="spinner"></div>

        <h3>
            Uploading Image...
        </h3>

        <p>
            Please wait while we upload your image.
        </p>

    </div>

</div>


<script>

/* =====================================================
PARTNER
===================================================== */

const partner =
    JSON.parse(
        localStorage.getItem("partner")
    );


/* =====================================================
LOGIN CHECK
===================================================== */

if(
    !partner ||
    !partner.id
){

    alert(
        "Partner session not found. Please login again."
    );

    window.location.href =
        "partner-login.html";

}


/* =====================================================
URL BUSINESS
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let businessType =
    params.get("business");

if(businessType){

    businessType =
        businessType.trim();

}


/* =====================================================
VARIABLES
===================================================== */

let menu = [];

let defaultGroceryProducts = [];

let groceryCategories = [];

let editId = null;

let isGrocery =
    businessType &&
    (
        businessType.toLowerCase() === "grocery" ||
        businessType.toLowerCase() === "groceries"
    );


/* =====================================================
HEADER
===================================================== */

if(businessType){

    document.getElementById(
        "pageTitle"
    ).innerHTML =
        escapeHtml(businessType) +
        " Menu";

    document.getElementById(
        "pageSubTitle"
    ).innerHTML =
        "Manage " +
        escapeHtml(businessType) +
        " Products";

}else{

    document.getElementById(
        "pageTitle"
    ).innerHTML =
        "Business Menu";

    document.getElementById(
        "pageSubTitle"
    ).innerHTML =
        "Business category not selected";

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
START
===================================================== */

if(!businessType){

    showError(
        "Business category is missing."
    );

}else if(isGrocery){

    loadGroceryMenu();

}else{

    loadNormalMenu();

}


/* =====================================================
LOAD NORMAL MENU
===================================================== */

async function loadNormalMenu(){

    showLoading(
        `Loading ${businessType} Menu...`
    );

    try{

        const url =
            `/partner/menu/${partner.id}/${encodeURIComponent(businessType)}`;

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "HTTP Error " +
                response.status
            );

        }

        const data =
            await response.json();

        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load menu"
            );

        }

        menu =
            data.products || [];

        renderMenu(menu);

    }
    catch(error){

        console.error(
            "NORMAL MENU ERROR:",
            error
        );

        showError(
            error.message ||
            "Unable to load menu."
        );

    }

}


/* =====================================================
LOAD GROCERY MENU
===================================================== */

async function loadGroceryMenu(){

    showLoading(
        "Loading Grocery Menu..."
    );

    try{

        const response =
            await fetch(
                `/partner/grocery-products/${partner.id}`
            );

        if(!response.ok){

            throw new Error(
                "HTTP Error " +
                response.status
            );

        }

        const data =
            await response.json();

        console.log(
            "GROCERY PRODUCTS:",
            data
        );

        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load Grocery products"
            );

        }

        menu =
            data.products || [];

        renderMenu(menu);

    }
    catch(error){

        console.error(
            "GROCERY LOAD ERROR:",
            error
        );

        showError(
            error.message ||
            "Unable to load Grocery menu."
        );

    }

}


/* =====================================================
LOAD GROCERY DEFAULT PRODUCTS
===================================================== */

async function loadDefaultGroceryProducts(){

    try{

        const response =
            await fetch(
                "/partner/grocery-default-products"
            );

        if(!response.ok){

            throw new Error(
                "Unable to load default Grocery products"
            );

        }

        const data =
            await response.json();

        console.log(
            "DEFAULT GROCERY PRODUCTS:",
            data
        );

        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load default products"
            );

        }

        defaultGroceryProducts =
            data.products || [];

        populateDefaultProductSelect();

    }
    catch(error){

        console.error(
            "DEFAULT GROCERY ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to load default Grocery products."
        );

    }

}


/* =====================================================
LOAD GROCERY CATEGORIES
===================================================== */

async function loadGroceryCategories(){

    try{

        const response =
            await fetch(
                "/partner/grocery-categories"
            );

        if(!response.ok){

            throw new Error(
                "Unable to load Grocery categories"
            );

        }

        const data =
            await response.json();

        console.log(
            "GROCERY CATEGORIES:",
            data
        );

        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load categories"
            );

        }

        groceryCategories =
            data.categories || [];

        populateCategorySelect();

    }
    catch(error){

        console.error(
            "CATEGORY ERROR:",
            error
        );

    }

}

/* =====================================================
RENDER MENU
===================================================== */

function renderMenu(list){

    const productList =
        document.getElementById(
            "productList"
        );

    productList.innerHTML = "";

    let available = 0;

    let featured = 0;

    document.getElementById(
        "totalProducts"
    ).innerHTML =
        list.length;

    list.forEach(
        product => {

            if(
                product.status ===
                "Available"
            ){

                available++;

            }

            if(
                Number(
                    product.featured
                ) === 1
            ){

                featured++;

            }

            const image =
                getProductImage(product);


            /* ==========================================
            VARIANTS
            ========================================== */

            let variantsHTML = "";

            if(
                product.variants &&
                product.variants.length
            ){

                variantsHTML = `

                    <div class="variantTitle">

                        📦 Available Sizes

                    </div>

                    <div class="variantContainer">

                        ${
                            product.variants
                            .map(
                                variant => {

                                    const price =
                                        Number(
                                            variant.price || 0
                                        );

                                    const offer =
                                        Number(
                                            variant.offer_price || 0
                                        );

                                    let priceHTML =
                                        `₹${price.toFixed(2)}`;

                                    if(
                                        offer > 0 &&
                                        offer < price
                                    ){

                                        priceHTML = `

                                            <span
                                                class="variantOffer">

                                                ₹${price.toFixed(2)}

                                            </span>

                                            ₹${offer.toFixed(2)}

                                        `;

                                    }

                                    return `

                                        <div
                                            class="variantBox">

                                            ${escapeHtml(
                                                variant.size
                                            )}

                                            <div
                                                class="variantPrice">

                                                ${priceHTML}

                                            </div>

                                            <div
                                                class="variantStock">

                                                Stock:
                                                ${Number(
                                                    variant.stock || 0
                                                )}

                                            </div>

                                        </div>

                                    `;

                                }
                            )
                            .join("")
                        }

                    </div>

                `;

            }


            /* ==========================================
            NORMAL PRICE
            ========================================== */

            let normalPriceHTML = "";

            const price =
                Number(
                    product.price || 0
                );

            const offer =
                Number(
                    product.offer_price || 0
                );

            if(
                offer > 0 &&
                offer < price
            ){

                normalPriceHTML = `

                    <div class="price">

                        <span class="offer">

                            ₹${price.toFixed(2)}

                        </span>

                        ₹${offer.toFixed(2)}

                    </div>

                `;

            }else{

                normalPriceHTML = `

                    <div class="price">

                        ₹${price.toFixed(2)}

                    </div>

                `;

            }


            /* ==========================================
            CARD
            ========================================== */

            productList.innerHTML += `

                <div class="productCard">

                    <div class="productTop">

                        <img
                            class="productImage"
                            src="${escapeHtml(image)}"
                            onerror="this.src='/images/other.jpg'"
                        >

                        <div class="productInfo">

                            <h3>

                                ${escapeHtml(
                                    product.product_name
                                )}

                            </h3>


                            <span
                                class="tag ${
                                    product.type === "Non Veg"
                                    ?
                                    "nonveg"
                                    :
                                    "veg"
                                }">

                                ${
                                    product.type === "Non Veg"
                                    ?
                                    "🔴 Non Veg"
                                    :
                                    "🟢 Veg"
                                }

                            </span>


                            <span class="tag category">

                                ${escapeHtml(
                                    product.category_name ||
                                    product.category ||
                                    "Other"
                                )}

                            </span>


                            ${
                                product.variants &&
                                product.variants.length
                                ?
                                variantsHTML
                                :
                                normalPriceHTML
                            }


                            <div
                                class="status ${
                                    product.status ===
                                    "Available"
                                    ?
                                    "available"
                                    :
                                    "out"
                                }">

                                ${
                                    product.status ===
                                    "Available"
                                    ?
                                    "🟢 Available"
                                    :
                                    "🔴 Out Of Stock"
                                }

                            </div>


                            ${
                                Number(
                                    product.featured
                                ) === 1
                                ?

                                `
                                <div class="featured">

                                    ⭐ Featured Product

                                </div>
                                `

                                :

                                ""
                            }

                        </div>

                    </div>


                    <div class="buttons">

                        <button
                            class="editBtn"
                            onclick="editProduct(${Number(product.id)})">

                            ✏ Edit

                        </button>


                        <button
                            class="deleteBtn"
                            onclick="deleteProduct(${Number(product.id)})">

                            🗑 Delete

                        </button>

                    </div>

                </div>

            `;

        }
    );


    document.getElementById(
        "availableProducts"
    ).innerHTML =
        available;

    document.getElementById(
        "featuredProducts"
    ).innerHTML =
        featured;


    if(list.length === 0){

        productList.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">

                    🛒

                </div>

                <h2>

                    No Products Found

                </h2>

                <p>

                    Add a product to your menu.

                </p>

            </div>

        `;

    }

}

                        const category =

                            name.includes(keyword) ||
                            category.includes(keyword)
                        );

                );

            renderMenu(
                filtered
            );

        }
    );

/* =====================================================
DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

    const product =
        menu.find(
            item =>
                Number(item.id) ===
                Number(id)
        );

    const name =
        product
        ?
        product.product_name
        :
        "this product";

    if(
        !confirm(
            `Delete "${name}"?`
        )
    ){

        return;

    }


    try{

        let url;

        if(isGrocery){

            url =
                `/partner/grocery-products/${id}`;

        }else{

            url =
                `/partner/product/${id}`;

        }


        const response =
            await fetch(
                url,
                {
                    method:"DELETE"
                }
            );

        const data =
            await response.json();

        console.log(
            "DELETE:",
            data
        );

        if(!data.success){

            throw new Error(
                data.message ||
                "Delete failed"
            );

        }

        if(isGrocery){

            await loadGroceryMenu();

        }else{

            await loadNormalMenu();

        }

    }
    catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to delete product."
        );

    }

}


/* =====================================================
IMAGE UPLOAD
===================================================== */

document
    .getElementById("m_image")
    .addEventListener(
        "change",
        async function(){

            const file =
                this.files[0];

            if(!file){

                return;

            }

            document.getElementById(
                "previewImage"
            ).src =
                URL.createObjectURL(file);


            const loader =
                document.getElementById(
                    "uploadLoader"
                );

            loader.style.display =
                "flex";

            this.disabled =
                true;


            try{

                const formData =
                    new FormData();

                formData.append(
                    "image",
                    file
                );

                const response =
                    await fetch(
                        "/partner/upload-product-image",
                        {
                            method:"POST",
                            body:formData
                        }
                    );

                const data =
                    await response.json();

                if(!data.success){

                    throw new Error(
                        data.message ||
                        "Image upload failed"
                    );

                }

                document.getElementById(
                    "m_image_name"
                ).value =
                    data.imageUrl;

                document.getElementById(
                    "previewImage"
                ).src =
                    data.imageUrl;

            }
            catch(error){

                console.error(
                    "IMAGE ERROR:",
                    error
                );

                alert(
                    error.message ||
                    "Unable to upload image."
                );

            }
            finally{

                loader.style.display =
                    "none";

                this.disabled =
                    false;

            }

        }
    );

async function loadGroceryVariants(productId){

    const list =
        document.getElementById(
            "variantList"
        );

    list.innerHTML = `

        <p style="
            color:#777;
            font-size:13px;
            margin-bottom:10px;
        ">

            Loading sizes...

        </p>

    `;


    try{

        const response =
            await fetch(
                `/partner/grocery-products/${productId}/variants`
            );

        const data =
            await response.json();

        console.log(
            "GROCERY VARIANTS:",
            data
        );

        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load variants"
            );

        }

        list.innerHTML = "";

        if(
            !data.variants ||
            data.variants.length === 0
        ){

            return;

        }

        data.variants.forEach(
            variant => {

                addVariantRow(
                    variant.size,
                    variant.price,
                    variant.offer_price,
                    variant.stock,
                    variant.status
                );

            }
        );

    }
    catch(error){

        console.error(
            "VARIANT ERROR:",
            error
        );

        list.innerHTML = "";

        alert(
            error.message ||
            "Unable to load variants."
        );

    }

}

/* =====================================================
SAVE GROCERY VARIANTS
===================================================== */

async function saveGroceryVariants(
    partnerProductId
){

    const rows =
        document.querySelectorAll(
            "#variantList .variantRow"
        );

    const variants = [];


    rows.forEach(
        row => {

            const size =
                row
                    .querySelector(
                        ".variant-size"
                    )
                    .value
                    .trim();

            const price =
                row
                    .querySelector(
                        ".variant-price"
                    )
                    .value;

            const offer =
                row
                    .querySelector(
                        ".variant-offer"
                    )
                    .value;

            const stock =
                row
                    .querySelector(
                        ".variant-stock"
                    )
                    .value;


            if(
                size &&
                price !== ""
            ){

                variants.push({

                    size:
                        size,

                    price:
                        Number(price),

                    offer_price:
                        offer === ""
                        ?
                        null
                        :
                        Number(offer),

                    stock:
                        Number(stock || 0),

                    status:
                        Number(stock || 0) > 0
                        ?
                        "Available"
                        :
                        "Out of Stock"

                });

            }

        }
    );


    const response =
        await fetch(
            `/partner/grocery-products/${partnerProductId}/variants`,
            {
                method:"PUT",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        variants:
                            variants
                    })
            }
        );


    const data =
        await response.json();


    if(!data.success){

        throw new Error(
            data.message ||
            "Unable to save Grocery variants"
        );

    }

}


/* =====================================================
SAVE PRODUCT
===================================================== */

async function saveProduct(){

    const productName =
        document.getElementById(
            "m_name"
        ).value.trim();


    if(!productName){

        alert(
            "Please enter product name."
        );

        return;

    }


    /* =================================================
    GROCERY SAVE
    ================================================= */

    if(isGrocery){

        await saveGroceryProduct();

        return;

    }


    /* =================================================
    NORMAL SAVE
    ================================================= */

    const category =
        document.getElementById(
            "m_category"
        ).value.trim();


    if(!category){

        alert(
            "Please enter category."
        );

        return;

    }


    const body = {

        partner_id:
            partner.id,

        business_type:
            businessType,

        product_name:
            productName,

        type:
            document.getElementById(
                "m_type"
            ).value,

        category:
            category,

        price:
            document.getElementById(
                "m_price"
            ).value || 0,

        offer_price:
            document.getElementById(
                "m_offer"
            ).value || null,

        featured:
            document.getElementById(
                "m_featured"
            ).checked
            ?
            1
            :
            0,

        status:
            document.getElementById(
                "m_status"
            ).value,

        image:
            document.getElementById(
                "m_image_name"
            ).value || null

    };


    let url =
        "/partner/add-product";

    let method =
        "POST";


    if(editId){

        url =
            `/partner/product/${editId}`;

        method =
            "PUT";

    }


    try{

        const response =
            await fetch(
                url,
                {
                    method:method,

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );

        const data =
            await response.json();

        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to save product"
            );

        }

        closeModal();

        await loadNormalMenu();

    }
    catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to save product."
        );

    }

}

                "m_image_name"
            ).value || null,

        status:
            document.getElementById(
                "m_status"
            ).value,

        featured:
            document.getElementById(
                "m_featured"
            ).checked
            ?
            1
            :
            0

    };


    try{

        let url;

        let method;


        if(editId){

            url =
                `/partner/grocery-products/${editId}`;

            method =
                "PUT";

        }else{

            url =
                "/partner/grocery-products";

            method =
                "POST";

        }


        const response =
            await fetch(
                url,
                {
                    method:method,

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)
                }
            );


        const data =
            await response.json();


        console.log(
            "GROCERY SAVE:",
            data
        );


        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to save Grocery product"
            );

        }


        const partnerProductId =
            editId ||
            data.id ||
            data.partnerProductId;


        if(!partnerProductId){

            throw new Error(
                "Grocery product was saved but partner product ID was not returned."
            );

        }


        /* ==========================================
        SAVE VARIANTS
        ========================================== */

        await saveGroceryVariants(
            partnerProductId
        );


        closeModal();

        await loadGroceryMenu();

    }
    catch(error){

        console.error(
            "GROCERY SAVE ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to save Grocery product."
        );

    }

}
