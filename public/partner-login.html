<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>DARVOZ | Partner Login</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow:hidden;
}


/* ================================
   BODY
================================ */

body{

    background:
    linear-gradient(
        180deg,
        #ff6b00 0%,
        #ff8a36 28%,
        #f4f4f4 62%,
        #e8e8e8 100%
    );

}


/* ================================
   PAGE
================================ */

.page{

    width:100vw;
    height:100vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:10px;

}


/* ================================
   MAIN CARD
================================ */

.app{

    width:100%;
    max-width:430px;

    height:calc(100vh - 38px);

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.97),
        rgba(248,248,248,.95)
    );

    border-radius:25px;

    box-shadow:
    0 12px 40px rgba(0,0,0,.18);

    overflow:hidden;

}


/* ================================
   CONTENT
================================ */

.content{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    padding:18px 24px 14px;

}


/* ================================
   BRAND
================================ */

.brand{

    text-align:center;

}

.brand-row{

    display:flex;
    justify-content:center;
    align-items:center;

}

.brand h1{

    color:#f45100;

    font-size:31px;

    font-weight:800;

    letter-spacing:2px;

    line-height:1;

}

.brand p{

    color:#555;

    font-size:14px;

    margin-top:5px;

}


/* ================================
   SHOP ILLUSTRATION
================================ */

.store-box{

    width:150px;
    height:95px;

    margin:8px auto 4px;

    position:relative;

}

.store-bg{

    width:105px;
    height:105px;

    border-radius:50%;

    background:#f8ece3;

    position:absolute;

    left:50%;
    top:45%;

    transform:translate(-50%,-50%);

}

.shop{

    width:130px;
    height:82px;

    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

}

.roof{

    width:130px;
    height:29px;

    position:absolute;

    top:0;

    border:2px solid #934815;

    border-radius:9px;

    background:
    repeating-linear-gradient(
        90deg,
        #ff6b00 0px,
        #ff6b00 19px,
        #fff5ee 19px,
        #fff5ee 38px
    );

}

.shop-wall{

    width:110px;
    height:55px;

    position:absolute;

    bottom:0;
    left:10px;

    background:#fff2e8;

    border-left:3px solid #934815;
    border-right:3px solid #934815;

}

.door{

    width:33px;
    height:49px;

    position:absolute;

    left:15px;
    bottom:0;

    background:#a65b29;

    border:3px solid #743815;

}

.window{

    width:39px;
    height:34px;

    position:absolute;

    right:12px;
    bottom:9px;

    background:#b96b31;

    border:3px solid #743815;

}

.food-circle{

    width:38px;
    height:38px;

    border-radius:50%;

    background:#ff6b00;

    color:white;

    position:absolute;

    top:-15px;
    right:0;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:15px;

}


/* ================================
   TITLE
================================ */

.login-title{

    text-align:center;

    margin-top:3px;

}

.login-title h2{

    font-size:29px;

    color:#303030;

    font-weight:700;

}

.login-title p{

    color:#666;

    font-size:12px;

    margin-top:3px;

    white-space:nowrap;

}


/* ================================
   FORM
================================ */

.form{

    width:100%;

    margin-top:13px;

}

.form-group{

    margin-bottom:11px;

}

label{

    display:block;

    font-size:14px;

    font-weight:600;

    color:#333;

    margin-bottom:6px;

}

.input-box{

    position:relative;

}

.input-box > i{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    left:15px;

    color:#888;

    font-size:17px;

}

input[type="text"],
input[type="password"]{

    width:100%;
    height:49px;

    padding:0 48px;

    border:1px solid #d5d5d5;

    border-radius:11px;

    background:#fafafa;

    font-size:14px;

    outline:none;

}

input:focus{

    border-color:#ff6b00;

    box-shadow:
    0 0 0 3px rgba(255,107,0,.10);

}


/* ================================
   PASSWORD EYE
================================ */

.toggle-password{

    left:auto !important;
    right:15px;

    cursor:pointer;

}


/* ================================
   REMEMBER + FORGOT
================================ */

.login-options{

    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-top:-2px;
    margin-bottom:13px;

}

.remember{

    display:flex;
    align-items:center;

    gap:8px;

    cursor:pointer;

    font-size:12px;

    color:#555;

}

.remember input{

    display:none;

}

.custom-check{

    width:18px;
    height:18px;

    border:1.5px solid #bbb;

    border-radius:5px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:10px;

    transition:.2s;

}

.remember input:checked + .custom-check{

    background:#ff6b00;

    border-color:#ff6b00;

}

.remember input:checked + .custom-check::after{

    content:"✓";

    font-weight:700;

}

.forgot-password{

    text-decoration:none;

    color:#e75b16;

    font-size:12px;

    font-weight:600;

}


/* ================================
   ERROR
================================ */

#error{

    display:none;

    background:#ffe3e3;

    color:#d62828;

    padding:8px 10px;

    border-radius:8px;

    font-size:11px;

    margin-bottom:8px;

}

.loading{

    display:none;

    text-align:center;

    color:#ff6b00;

    font-size:12px;

    font-weight:600;

    margin-bottom:6px;

}


/* ================================
   LOGIN BUTTON
================================ */

.login-btn{

    width:100%;

    height:51px;

    border:none;

    border-radius:11px;

    background:
    linear-gradient(
        90deg,
        #ff5200,
        #ff7900
    );

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    box-shadow:
    0 7px 16px rgba(255,107,0,.22);

}

.login-btn:active{

    transform:scale(.98);

}

.login-btn i{

    margin-right:8px;

}


/* ================================
   OR
================================ */

.or{

    display:flex;

    align-items:center;

    gap:10px;

    color:#555;

    font-size:12px;

    margin:10px 0;

}

.or::before,
.or::after{

    content:"";

    height:1px;

    background:#e3e3e3;

    flex:1;

}


/* ================================
   REGISTER
================================ */

.bottom{

    text-align:center;

    font-size:13px;

    color:#555;

}

.bottom a{

    color:#e75b16;

    font-weight:700;

    text-decoration:none;

    margin-left:4px;

}


/* ================================
   FEATURES
================================ */

.features{

    width:100%;

    margin-top:auto;

    padding-top:11px;

    border-top:1px solid #e8e8e8;

    display:flex;

    justify-content:space-between;

}

.feature{

    width:33.33%;

    text-align:center;

    position:relative;

}

.feature:not(:last-child)::after{

    content:"";

    width:1px;
    height:42px;

    background:#e5e5e5;

    position:absolute;

    right:0;
    top:5px;

}

.feature-icon{

    width:38px;
    height:38px;

    margin:auto auto 5px;

    border-radius:50%;

    background:#fff1e8;

    color:#ff6b00;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:16px;

}

.feature p{

    font-size:10px;

    color:#444;

    line-height:1.3;

}


/* ================================
   FOOTER
================================ */

.footer{

    text-align:center;

    color:#555;

    font-size:10px;

    margin-top:5px;

}


/* ================================
   SMALL HEIGHT MOBILE
================================ */

@media(max-height:680px){

    .content{
        padding-top:10px;
        padding-bottom:8px;
    }

    .brand h1{
        font-size:27px;
    }

    .brand p{
        font-size:11px;
    }

    .store-box{
        height:72px;
        transform:scale(.80);
        margin:0 auto -5px;
    }

    .login-title h2{
        font-size:25px;
    }

    .login-title p{
        font-size:10px;
    }

    .form{
        margin-top:7px;
    }

    .form-group{
        margin-bottom:7px;
    }

    label{
        font-size:12px;
        margin-bottom:3px;
    }

    input[type="text"],
    input[type="password"]{
        height:43px;
    }

    .login-options{
        margin-bottom:8px;
    }

    .login-btn{
        height:44px;
    }

    .or{
        margin:6px 0;
    }

    .features{
        padding-top:7px;
    }

    .feature-icon{
        width:32px;
        height:32px;
        font-size:13px;
    }

    .feature p{
        font-size:9px;
    }

}


/* ================================
   DESKTOP
================================ */

@media(min-width:700px){

    body{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .app{
        max-width:700px;
        height:94vh;
    }

    .content{
        padding-left:55px;
        padding-right:55px;
    }

    .brand h1{
        font-size:38px;
    }

    .login-title h2{
        font-size:35px;
    }

}

</style>

</head>


<body>


<div class="page">

    <div class="app">

        <div class="content">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-row">

                    <h1>DARVOZ</h1>

                </div>

                <p>Delivering Happiness</p>

            </div>


            <!-- SHOP IMAGE -->

            <div class="store-box">

                <div class="store-bg"></div>

                <div class="shop">

                    <div class="roof"></div>

                    <div class="shop-wall">

                        <div class="door"></div>

                        <div class="window"></div>

                    </div>

                    <div class="food-circle">

                        <i class="fa-solid fa-utensils"></i>

                    </div>

                </div>

            </div>


            <!-- TITLE -->

            <div class="login-title">

                <h2>Partner Login</h2>

                <p>
                    Welcome back! Please login to your partner account.
                </p>

            </div>


            <!-- FORM -->

            <div class="form">


                <!-- PARTNER ID -->

                <div class="form-group">

                    <label>Partner ID</label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                        type="text"
                        id="partnerId"
                        placeholder="Enter Partner ID"
                        autocomplete="username">

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>Password</label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        autocomplete="current-password">

                        <i
                        class="fa-solid fa-eye toggle-password"
                        id="togglePassword"
                        onclick="togglePassword()">
                        </i>

                    </div>

                </div>


                <!-- REMEMBER + FORGOT -->

                <div class="login-options">

                    <label class="remember">

                        <input
                        type="checkbox"
                        id="rememberMe">

                        <span class="custom-check"></span>

                        <span>Remember Me</span>

                    </label>


                    <a
                    href="partner-forgot-password.html"
                    class="forgot-password">

                        Forgot Password?

                    </a>

                </div>


                <!-- ERROR -->

                <div id="error"></div>


                <!-- LOADING -->

                <div
                class="loading"
                id="loading">

                    Signing in...

                </div>


                <!-- LOGIN -->

                <button
                class="login-btn"
                id="loginButton"
                onclick="loginPartner()">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


                <!-- OR -->

                <div class="or">

                    <span>OR</span>

                </div>


                <!-- REGISTER -->

                <div class="bottom">

                    Don't have an account?

                    <a href="partner-register.html">

                        Register Now

                    </a>

                </div>


            </div>


            <!-- FEATURES -->

            <div class="features">


                <div class="feature">

                    <div class="feature-icon">

                        <i class="fa-solid fa-wallet"></i>

                    </div>

                    <p>
                        Earn More<br>
                        Every Order
                    </p>

                </div>


                <div class="feature">

                    <div class="feature-icon">

                        <i class="fa-solid fa-chart-line"></i>

                    </div>

                    <p>
                        Track Your<br>
                        Earnings
                    </p>

                </div>


                <div class="feature">

                    <div class="feature-icon">

                        <i class="fa-solid fa-headset"></i>

                    </div>

                    <p>
                        24/7 Partner<br>
                        Support
                    </p>

                </div>


            </div>


            <!-- FOOTER -->

            <div class="footer">

                © 2026 DARVOZ. All rights reserved.

            </div>


        </div>

    </div>

</div>


<script>


const API = window.location.origin;


/* ================================
   LOAD REMEMBERED PARTNER ID
================================ */

window.addEventListener("DOMContentLoaded", function(){

    const savedPartnerId =
        localStorage.getItem("rememberPartnerId");

    if(savedPartnerId){

        document.getElementById("partnerId").value =
            savedPartnerId;

        document.getElementById("rememberMe").checked =
            true;

    }

});


/* ================================
   PASSWORD SHOW / HIDE
================================ */

function togglePassword(){

    const password =
        document.getElementById("password");

    const icon =
        document.getElementById("togglePassword");


    if(password.type === "password"){

        password.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }

    else{

        password.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}


/* ================================
   LOGIN
================================ */

async function loginPartner(){


    const partnerId =
        document.getElementById("partnerId")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value
        .trim();


    const rememberMe =
        document.getElementById("rememberMe")
        .checked;


    const error =
        document.getElementById("error");


    const loading =
        document.getElementById("loading");


    const loginButton =
        document.getElementById("loginButton");


    error.style.display = "none";


    if(partnerId === "" || password === ""){

        error.style.display = "block";

        error.innerHTML =
            "Please enter Partner ID and Password.";

        return;

    }


    loading.style.display = "block";

    loginButton.disabled = true;

    loginButton.style.opacity = ".7";


    try{


        const response = await fetch(

            `${API}/partner/login`,

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    partnerId,
                    password

                })

            }

        );


        const result =
            await response.json();


        loading.style.display = "none";

        loginButton.disabled = false;

        loginButton.style.opacity = "1";


        if(result.success){


            /* ================================
               REMEMBER PARTNER ID
            ================================ */

            if(rememberMe){

                localStorage.setItem(
                    "rememberPartnerId",
                    partnerId
                );

            }
            else{

                localStorage.removeItem(
                    "rememberPartnerId"
                );

            }


            /* ================================
               SAVE PARTNER DATA
            ================================ */

            localStorage.setItem(

                "partner",

                JSON.stringify(result.partner)

            );


            /* ================================
               GO TO DASHBOARD
            ================================ */

            window.location.href =
                "partner-dashboard.html";


        }

        else{


            error.style.display = "block";

            error.innerHTML =
                result.message ||
                "Invalid Partner ID or Password.";

        }


    }

    catch(err){


        console.error(err);


        loading.style.display = "none";

        loginButton.disabled = false;

        loginButton.style.opacity = "1";


        error.style.display = "block";

        error.innerHTML =
            "Unable to connect to server. Please try again.";

    }


}


/* ================================
   ENTER KEY LOGIN
================================ */

document.addEventListener(

    "keydown",

    function(event){

        if(event.key === "Enter"){

            loginPartner();

        }

    }

);


</script>


</body>
</html>
