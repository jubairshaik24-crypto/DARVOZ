<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DARVOZ Rider - Coming Soon</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* ===============================
           HEADER
        =============================== */

        .header {
            height: 60px;
            background: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .back-btn {
            text-decoration: none;
            color: #222;
            font-size: 20px;
        }

        .header h2 {
            margin-left: 18px;
            font-size: 18px;
            color: #222;
        }


        /* ===============================
           COMING SOON
        =============================== */

        .coming-soon-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .coming-card {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }


        /* Rider Icon */

        .rider-circle {
            width: 120px;
            height: 120px;
            background: #fff1e7;
            border-radius: 50%;
            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rider-circle i {
            font-size: 55px;
            color: #ff6b00;
        }


        /* Coming Soon Tag */

        .coming-tag {
            display: inline-block;
            background: #fff1e7;
            color: #ff6b00;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }


        /* Text */

        .coming-card h1 {
            font-size: 30px;
            color: #222;
            margin-bottom: 14px;
        }

        .coming-card p {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
            max-width: 320px;
            margin: auto;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>DARVOZ Rider</h2>

    </div>



    <!-- COMING SOON CONTENT -->

    <div class="coming-soon-container">

        <div class="coming-card">


            <div class="rider-circle">
                <i class="fa-solid fa-motorcycle"></i>
            </div>


            <div class="coming-tag">
                COMING SOON
            </div>


            <h1>DARVOZ Rider 🛵</h1>


            <p>
                Your new way to ride is coming soon!<br>
                Stay tuned for something exciting.
            </p>


        </div>

    </div>


</body>

</html>
