<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARVOZ | Shop Address</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#ececec;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:390px;
min-height:100vh;
background:#fff;
box-shadow:0 0 35px rgba(0,0,0,.12);
}

.header{
padding:20px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.back{
width:42px;
height:42px;
border-radius:50%;
background:#fff3eb;
display:flex;
justify-content:center;
align-items:center;
color:#ff6b00;
cursor:pointer;
}

.form{
padding:22px;
}

.progress{
height:8px;
background:#eee;
border-radius:20px;
margin-bottom:25px;
overflow:hidden;
}

.progress div{
width:40%;
height:100%;
background:#ff6b00;
}

.step{
color:#ff6b00;
font-weight:600;
font-size:14px;
}

.title{
font-size:28px;
font-weight:800;
margin:8px 0;
}

.sub{
color:#777;
font-size:14px;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
height:55px;
border:1px solid #ddd;
border-radius:15px;
padding:0 18px;
font-size:15px;
outline:none;
}

.location-btn{
width:100%;
height:52px;
margin-top:20px;
background:#fff3eb;
border:2px solid #ff6b00;
color:#ff6b00;
font-weight:700;
border-radius:15px;
cursor:pointer;
}

.next-btn{
width:100%;
height:56px;
margin-top:30px;
background:#ff6b00;
color:#fff;
border:none;
border-radius:18px;
font-size:18px;
font-weight:700;
cursor:pointer;
}
#map{
    width:100%;
    height:220px;
    margin-top:20px;
    border-radius:18px;
    overflow:hidden;
    display:none;   /* Hidden until location is loaded */
}
</style>

</head>

<body>

<div class="app">

<div class="header">

<div class="back" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</div>

<h2>Shop Address</h2>

</div>

<div class="form">

<div class="progress">
<div></div>
</div>

<div class="step">Step 2 of 5</div>

<div class="title">Business Address</div>

<div class="sub">
Tell us where your shop is located.
</div>

<label>Shop Address</label>
<input id="address" placeholder="Shop No, Street">

<label>City</label>
<input id="city">

<label>Area</label>
<input id="area">
<label>State</label>
<input
type="text"
id="state"
>

<label>Pincode</label>
<input id="pincode">

<button class="location-btn" onclick="getLocation()">
<i class="fa-solid fa-location-crosshairs"></i>
Use Current Location
</button>

<div id="map"></div>

<button class="next-btn" onclick="nextPage()">
    Continue
</button>


</div>

</div>

<script>

let map;
let marker;
function getLocation(){

    if(!navigator.geolocation){
        alert("Geolocation is not supported.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

function(position){

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    console.log("Accuracy:", position.coords.accuracy);
    console.log(lat, lng);

    localStorage.setItem("latitude", lat);
    localStorage.setItem("longitude", lng);

    document.getElementById("map").style.display = "block";

    map = new google.maps.Map(document.getElementById("map"),{
        center:{lat,lng},
        zoom:17,
        mapTypeControl:false,
        streetViewControl:false,
        fullscreenControl:false
    });

    marker = new google.maps.Marker({
        position:{lat,lng},
        map:map
    });

    const geocoder = new google.maps.Geocoder();

    geocoder.geocode(
        { location:{lat,lng} },

        function(results,status){

            console.log(status);
            console.log(results);

            if(status==="OK" && results[0]){

                document.getElementById("address").value =
                results[0].formatted_address;

                results[0].address_components.forEach(function(c){

                    if(c.types.includes("administrative_area_level_1")){
                        document.getElementById("state").value = c.long_name;
                    }

                    if(
                        c.types.includes("locality") ||
                        c.types.includes("administrative_area_level_2")
                    ){
                        document.getElementById("city").value = c.long_name;
                    }

                    if(c.types.includes("postal_code")){
                        document.getElementById("pincode").value = c.long_name;
                    }

                    if(
                        c.types.includes("sublocality") ||
                        c.types.includes("sublocality_level_1") ||
                        c.types.includes("neighborhood")
                    ){
                        document.getElementById("area").value = c.long_name;
                    }

                });

            }

        }

    );

},

function(error){

    alert("Please allow location access.");

},

{
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:0
}

);

}
function nextPage(){

const address=document.getElementById("address").value.trim();
const city=document.getElementById("city").value.trim();
const state=document.getElementById("state").value.trim();
const pincode=document.getElementById("pincode").value.trim();
const area = document.getElementById("area").value.trim();
if(
address===""||
city===""||
state===""||
pincode===""){
alert("Please fill all address details.");
return;
}

localStorage.setItem("address",address);
localStorage.setItem("city",city);
localStorage.setItem("state",state);
localStorage.setItem("pincode",pincode);
localStorage.setItem("area", area);

location.href="partner-documents.html";

}

</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDFSLc0npyYLrB-JMhkaCg6Q1xlPNE8TfQ&libraries=places"></script>
</body>
</html>
