<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>DARVOZ | Verify OTP</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f5f6fa;

    padding:20px;
}

.container{

    width:100%;
    max-width:430px;

    background:#fff;

    border-radius:25px;

    padding:35px 25px;

    text-align:center;

    box-shadow:
        0 15px 45px rgba(0,0,0,.12);
}

.logo{

    font-size:38px;

    font-weight:800;

    color:#ff6500;

    letter-spacing:2px;
}

.icon{

    width:75px;
    height:75px;

    margin:25px auto 18px;

    border-radius:50%;

    background:#fff3eb;

    color:#ff6500;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
}

h1{

    font-size:25px;

    color:#222;
}

.subtitle{

    margin-top:8px;

    color:#777;

    font-size:13px;

    line-height:1.6;
}

.mobile{

    color:#ff6500;

    font-weight:700;
}

.otp-box{

    display:flex;

    justify-content:center;

    gap:8px;

    margin:30px 0;
}

.otp-input{

    width:48px;
    height:55px;

    border:1.5px solid #ddd;

    border-radius:12px;

    text-align:center;

    font-size:22px;

    font-weight:700;

    outline:none;
}

.otp-input:focus{

    border-color:#ff6500;

    box-shadow:
        0 0 0 4px rgba(255,101,0,.08);
}

.verify-btn{

    width:100%;
    height:52px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ff8a00,
            #ff6200
        );

    color:#fff;

    font-size:15px;

    font-weight:700;

    cursor:pointer;
}

.resend{

    margin-top:22px;

    font-size:12px;

    color:#777;
}

.resend button{

    border:none;

    background:none;

    color:#ff6500;

    font-weight:700;

    cursor:pointer;
}

.back{

    margin-top:22px;

    font-size:12px;

    color:#777;

    cursor:pointer;
}

.back i{

    margin-right:5px;
}

@media(max-width:500px){

    body{
        padding:0;
        background:#fff;
    }

    .container{

        min-height:100vh;

        border-radius:0;

        box-shadow:none;

        display:flex;

        flex-direction:column;

        justify-content:center;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        DARVOZ
    </div>

    <div class="icon">
        <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h1>
        Verify your number
    </h1>

    <div class="subtitle">

        We've sent a 6-digit verification code to

        <br>

        <span
            class="mobile"
            id="mobileDisplay">
        </span>

    </div>

    <div class="otp-box">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

    </div>

    <button
        class="verify-btn"
        onclick="verifyOTP()">

        Verify & Continue

    </button>

    <div class="resend">

        Didn't receive the code?

        <button onclick="resendOTP()">
            Resend OTP
        </button>

    </div>

    <div
        class="back"
        onclick="goBack()">

        <i class="fa-solid fa-arrow-left"></i>

        Change mobile number

    </div>

</div>

<script>

const inputs =
    document.querySelectorAll(".otp-input");


/* ==============================
   GET MOBILE FROM LOCAL STORAGE
============================== */

const mobile =
    localStorage.getItem("otpMobile");


/* ==============================
   SHOW MOBILE NUMBER
============================== */

document.getElementById(
    "mobileDisplay"
).textContent =
    mobile
        ? "+91 " + mobile
        : "your mobile number";


/* ==============================
   OTP INPUT AUTO MOVE
============================== */

inputs.forEach(
    (input, index) => {

        input.addEventListener(
            "input",
            () => {

                input.value =
                    input.value.replace(/\D/g, "");

                if (
                    input.value &&
                    index < inputs.length - 1
                ) {
                    inputs[index + 1].focus();
                }

            }
        );


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Backspace" &&
                    !input.value &&
                    index > 0
                ) {
                    inputs[index - 1].focus();
                }

            }
        );

    }
);


/* ==============================
   VERIFY OTP
============================== */

async function verifyOTP(){

    if(!mobile){

        alert(
            "Mobile number not found. Please enter your number again."
        );

        window.location.href =
            "customer-login.html";

        return;
    }


    const otp =
        Array.from(inputs)
            .map(input => input.value)
            .join("");


    if(otp.length !== 6){

        alert(
            "Please enter the complete 6-digit OTP"
        );

        return;
    }


    const button =
        document.querySelector(".verify-btn");


    button.disabled = true;

    button.textContent =
        "Verifying...";


    try{

        const response =
            await fetch(
                "/otp/verify-otp",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            phone: mobile,
                            otp: otp
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "OTP verification failed"
            );

        }


        alert(
            "Phone number verified successfully!"
        );


        /* SAVE VERIFIED NUMBER */

        localStorage.setItem(
            "verifiedMobile",
            data.mobile
        );


        /* REMOVE OTP TEMP DATA */

        localStorage.removeItem(
            "otpMobile"
        );


        /* REDIRECT */

        window.location.href =
            "customer-register.html";


    }
    catch(error){

        console.error(
            "VERIFY OTP ERROR:",
            error
        );

        alert(
            error.message ||
            "OTP verification failed"
        );

    }
    finally{

        button.disabled = false;

        button.textContent =
            "Verify & Continue";

    }

}


/* ==============================
   RESEND OTP
============================== */

async function resendOTP(){

    if(!mobile){

        alert(
            "Mobile number not found"
        );

        return;
    }


    const resendButton =
        document.querySelector(
            ".resend button"
        );


    resendButton.disabled = true;

    resendButton.textContent =
        "Sending...";


    try{

        const response =
            await fetch(
                "/otp/send-otp",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            phone: mobile
                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Failed to resend OTP"
            );

        }


        inputs.forEach(
            input => {
                input.value = "";
            }
        );


        inputs[0].focus();


        alert(
            "New OTP sent successfully!"
        );

    }
    catch(error){

        console.error(
            "RESEND OTP ERROR:",
            error
        );

        alert(
            error.message ||
            "Failed to resend OTP"
        );

    }
    finally{

        resendButton.disabled = false;

        resendButton.textContent =
            "Resend OTP";

    }

}


/* ==============================
   GO BACK
============================== */

function goBack(){

    localStorage.removeItem(
        "otpMobile"
    );

    window.history.back();

}


/* ==============================
   AUTO FOCUS FIRST OTP
============================== */

window.addEventListener(
    "load",
    () => {

        if(inputs.length){
            inputs[0].focus();
        }

    }
);

</script>

</body>
</html>
