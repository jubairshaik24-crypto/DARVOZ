<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>DARVOZ | Verify OTP</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#f5f6fa;

    padding:20px;
}

.container{

    width:100%;
    max-width:430px;

    background:#fff;

    border-radius:25px;

    padding:35px 25px;

    text-align:center;

    box-shadow:
        0 15px 45px rgba(0,0,0,.12);
}

.logo{

    font-size:38px;

    font-weight:800;

    color:#ff6500;

    letter-spacing:2px;
}

.icon{

    width:75px;
    height:75px;

    margin:25px auto 18px;

    border-radius:50%;

    background:#fff3eb;

    color:#ff6500;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
}

h1{

    font-size:25px;

    color:#222;
}

.subtitle{

    margin-top:8px;

    color:#777;

    font-size:13px;

    line-height:1.6;
}

.mobile{

    color:#ff6500;

    font-weight:700;
}

.otp-box{

    display:flex;

    justify-content:center;

    gap:8px;

    margin:30px 0;
}

.otp-input{

    width:48px;
    height:55px;

    border:1.5px solid #ddd;

    border-radius:12px;

    text-align:center;

    font-size:22px;

    font-weight:700;

    outline:none;
}

.otp-input:focus{

    border-color:#ff6500;

    box-shadow:
        0 0 0 4px rgba(255,101,0,.08);
}

.verify-btn{

    width:100%;
    height:52px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ff8a00,
            #ff6200
        );

    color:#fff;

    font-size:15px;

    font-weight:700;

    cursor:pointer;
}

.resend{

    margin-top:22px;

    font-size:12px;

    color:#777;
}

.resend button{

    border:none;

    background:none;

    color:#ff6500;

    font-weight:700;

    cursor:pointer;
}

.back{

    margin-top:22px;

    font-size:12px;

    color:#777;

    cursor:pointer;
}

.back i{

    margin-right:5px;
}

@media(max-width:500px){

    body{
        padding:0;
        background:#fff;
    }

    .container{

        min-height:100vh;

        border-radius:0;

        box-shadow:none;

        display:flex;

        flex-direction:column;

        justify-content:center;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        DARVOZ
    </div>

    <div class="icon">
        <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h1>
        Verify your number
    </h1>

    <div class="subtitle">

        We've sent a 6-digit verification code to

        <br>

        <span
            class="mobile"
            id="mobileDisplay">
        </span>

    </div>

    <div class="otp-box">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

        <input
            type="text"
            maxlength="1"
            class="otp-input">

    </div>

    <button
        class="verify-btn"
        onclick="verifyOTP()">

        Verify & Continue

    </button>

    <div class="resend">

        Didn't receive the code?

        <button onclick="resendOTP()">
            Resend OTP
        </button>

    </div>

    <div
        class="back"
        onclick="goBack()">

        <i class="fa-solid fa-arrow-left"></i>

        Change mobile number

    </div>

</div>

<script>

    const API = window.location.origin;

// ==========================================
// GET MOBILE
// ==========================================
const mobile = localStorage.getItem("otpMobile");

if (!mobile) {
    alert("Mobile number not found. Please enter it again.");
    window.location.href = "customer-login.html";
}


// ==========================================
// NORMALIZE WHATSAPP PHONE
// Always: 8333995837 -> 918333995837
// ==========================================
function getWhatsAppPhone() {
    if (!mobile) return "";

    const cleanMobile = mobile.replace(/\D/g, "");

    if (
        cleanMobile.startsWith("91") &&
        cleanMobile.length === 12
    ) {
        return cleanMobile;
    }

    return "91" + cleanMobile;
}


// ==========================================
// DISPLAY MOBILE + OTP INPUTS
// ==========================================
document.addEventListener("DOMContentLoaded", () => {

    const mobileDisplay =
        document.getElementById("mobileDisplay");

    if (mobileDisplay) {

        let displayMobile =
            mobile.replace(/\D/g, "");

        // Remove 91 for display only
        if (
            displayMobile.startsWith("91") &&
            displayMobile.length === 12
        ) {
            displayMobile =
                displayMobile.substring(2);
        }

        mobileDisplay.textContent =
            `+91 ${displayMobile}`;
    }


    const inputs =
        document.querySelectorAll(".otp-input");


    // ======================================
    // OTP INPUT
    // ======================================
    inputs.forEach((input, index) => {

        input.addEventListener(
            "input",
            function () {

                this.value =
                    this.value.replace(/[^0-9]/g, "");

                if (
                    this.value &&
                    index < inputs.length - 1
                ) {
                    inputs[index + 1].focus();
                }

            }
        );


        // ==================================
        // BACKSPACE
        // ==================================
        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Backspace" &&
                    !this.value &&
                    index > 0
                ) {
                    inputs[index - 1].focus();
                }

            }
        );

    });


    // Focus first OTP box
    if (inputs.length > 0) {
        inputs[0].focus();
    }

});


// ==========================================
// GET OTP
// ==========================================
function getOTP() {

    const inputs =
        document.querySelectorAll(".otp-input");

    let otp = "";

    inputs.forEach(input => {
        otp += input.value;
    });

    return otp;
}


// ==========================================
// VERIFY OTP
// ==========================================
async function verifyOTP() {

    const otp = getOTP();


    // Check OTP length
    if (otp.length !== 6) {

        alert(
            "Please enter the complete 6-digit OTP."
        );

        return;
    }


    const button =
        document.querySelector(".verify-btn");

    const originalText =
        button.innerHTML;


    try {

        button.disabled = true;

        button.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Verifying...
        `;


        // ==================================
        // GET SAME PHONE FORMAT
        // ==================================
        const whatsappPhone =
            getWhatsAppPhone();

        console.log(
            "VERIFYING PHONE:",
            whatsappPhone
        );


        // ==================================
        // VERIFY OTP API
        // ==================================
        const verifyResponse =
            await fetch(
                `${API}/api/whatsapp/verify-otp`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        phone: whatsappPhone,
                        otp: otp
                    })
                }
            );


        const verifyData =
            await verifyResponse.json();


        console.log(
            "VERIFY OTP RESPONSE:",
            verifyData
        );


        // ==================================
        // OTP FAILED
        // ==================================
        if (
            !verifyResponse.ok ||
            !verifyData.success
        ) {

            alert(
                verifyData.message ||
                "Invalid OTP. Please try again."
            );

            return;
        }


        // ==================================
        // EXISTING CUSTOMER
        // ==================================
        if (
            verifyData.isNewCustomer === false
        ) {

            const customer =
                verifyData.customer;


            localStorage.setItem(
                "customerId",
                String(customer._id)
            );


            localStorage.setItem(
                "customerName",
                customer.name || ""
            );


            localStorage.setItem(
                "mobile",
                customer.mobile || mobile
            );


            localStorage.setItem(
                "customerEmail",
                customer.email || ""
            );


            localStorage.setItem(
                "customerLoggedIn",
                "true"
            );


            localStorage.setItem(
                "customerLoginTime",
                Date.now().toString()
            );


            // Remove temporary OTP mobile
            localStorage.removeItem(
                "otpMobile"
            );


            // Go home
            window.location.href =
                "index.html";

            return;
        }


        // ==================================
        // NEW CUSTOMER
        // ==================================
        localStorage.setItem(
            "registerMobile",
            verifyData.mobile || mobile
        );


        // Remove temporary OTP mobile
        localStorage.removeItem(
            "otpMobile"
        );


        // Go registration
        window.location.href =
            "customer-register.html";


    } catch (error) {

        console.error(
            "VERIFY OTP ERROR:",
            error
        );

        alert(
            "Unable to verify OTP. Please try again."
        );

    } finally {

        button.disabled = false;

        button.innerHTML =
            originalText;
    }

}


// ==========================================
// RESEND OTP
// ==========================================
async function resendOTP() {

    const resendButton =
        document.querySelector(".resend button");


    const originalText =
        resendButton
            ? resendButton.innerHTML
            : "";


    try {

        if (resendButton) {

            resendButton.disabled = true;

            resendButton.innerHTML =
                "Sending...";
        }


        // ==================================
        // USE SAME PHONE FORMAT
        // ==================================
        const whatsappPhone =
            getWhatsAppPhone();


        console.log(
            "RESENDING TO:",
            whatsappPhone
        );


        // ==================================
        // SEND OTP AGAIN
        // ==================================
        const response =
            await fetch(
                `${API}/api/whatsapp/send-otp`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        phone: whatsappPhone
                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "RESEND OTP RESPONSE:",
            data
        );


        // ==================================
        // FAILED
        // ==================================
        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Failed to resend OTP."
            );

            return;
        }


        // ==================================
        // CLEAR OLD OTP
        // ==================================
        document
            .querySelectorAll(".otp-input")
            .forEach(input => {

                input.value = "";

            });


        const firstInput =
            document.querySelector(".otp-input");


        if (firstInput) {

            firstInput.focus();

        }


        alert(
            "A new OTP has been sent to your WhatsApp."
        );


    } catch (error) {

        console.error(
            "RESEND OTP ERROR:",
            error
        );


        alert(
            "Unable to resend OTP."
        );


    } finally {

        if (resendButton) {

            resendButton.disabled = false;

            resendButton.innerHTML =
                originalText;
        }

    }

}


// ==========================================
// BACK
// ==========================================
function goBack() {

    localStorage.removeItem(
        "otpMobile"
    );

    window.location.href =
        "customer-login.html";
}
</script>

</body>
</html>
