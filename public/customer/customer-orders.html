
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARVOZ | My Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root {
  --petrol: #004D5B;
  --petrol-dark: #013640;
  --bg: #f4f6f7;
  --text: #18252a;
  --muted: #778187;
  --green: #159765;
  --red: #d64545;
  --border: #e7ebed;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Poppins, sans-serif; background: var(--bg); color: var(--text); }
header {
  position: sticky; top: 0; z-index: 5; background: white;
  display: flex; align-items: center; gap: 15px;
  padding: 17px 18px; border-bottom: 1px solid var(--border);
}
.back {
  border: 0; background: transparent; font-size: 21px;
  color: var(--petrol); cursor: pointer;
}
header h1 { font-size: 20px; font-weight: 700; }
header p { font-size: 11px; color: var(--muted); }
.container { max-width: 650px; margin: auto; padding: 18px 13px 35px; }
.heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.heading h2 { font-size: 17px; }
.heading button { border: 0; background: transparent; color: var(--petrol); padding: 8px; }
.tabs { display: flex; background: #e7ebed; border-radius: 30px; padding: 4px; margin-bottom: 18px; }
.tabs button {
  flex: 1; border: 0; padding: 11px 5px; border-radius: 25px;
  background: transparent; color: #536168; font: 600 13px Poppins; cursor: pointer;
}
.tabs button.active { background: var(--petrol); color: white; }
.order-card {
  background: white; border: 1px solid var(--border);
  border-radius: 20px; overflow: hidden; margin-bottom: 16px;
  box-shadow: 0 4px 15px #102d3509;
}
.card-top { display: flex; align-items: center; gap: 12px; padding: 15px; }
.restaurant-icon {
  width: 49px; height: 49px; flex-shrink: 0; border-radius: 13px;
  background: #e6f0f2; color: var(--petrol);
  display: grid; place-items: center; font-size: 21px;
}
.restaurant { flex: 1; min-width: 0; }
.restaurant h3 { font-size: 14px; overflow-wrap: anywhere; }
.restaurant p { font-size: 11px; color: var(--muted); margin-top: 3px; }
.status {
  font-size: 10px; font-weight: 700; padding: 6px 9px;
  border-radius: 20px; background: #e5f7ed; color: var(--green);
  white-space: nowrap;
}
.status.active { background: #e6f0f2; color: var(--petrol); }
.status.cancelled { background: #fff0ef; color: var(--red); }
.card-body { padding: 0 15px 15px; }
.order-id { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
.item-preview { font-size: 13px; font-weight: 500; padding: 10px 0; border-top: 1px solid var(--border); }
.item-preview i { color: var(--petrol); margin-right: 7px; }
.order-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 10px; }
.order-meta strong { color: var(--text); font-size: 14px; }
.actions { display: flex; gap: 9px; margin-top: 15px; }
.actions button {
  flex: 1; border-radius: 11px; padding: 11px 7px;
  font: 600 12px Poppins; cursor: pointer;
}
.track { border: 0; background: var(--petrol); color: white; }
.reorder { border: 1px solid var(--petrol); background: white; color: var(--petrol); }
.details { border: 1px solid var(--border); background: #f8fafb; color: var(--text); }
.empty, .loading { text-align: center; padding: 45px 15px; color: var(--muted); font-size: 13px; }
.empty i { font-size: 35px; color: var(--petrol); margin-bottom: 13px; }
.error { color: var(--red); text-align: center; padding: 25px 10px; font-size: 13px; }
footer { text-align: center; padding: 18px; color: var(--muted); font-size: 11px; }
</style>
<script src="/customer/beautiful-alerts.js"></script>
</head>
<body>
<header>
  <button class="back" onclick="history.length > 1 ? history.back() : location.href='index.html'" aria-label="Go back">
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <div>
    <h1>MY ORDERS</h1>
    <p>Your DARVOZ order history</p>
  </div>
</header>

<main class="container">
  <div class="heading">
    <h2>Past Orders</h2>
    <button onclick="loadOrders()" aria-label="Refresh orders"><i class="fa-solid fa-rotate-right"></i></button>
  </div>

  <!-- <div class="tabs">
    <button class="active" id="foodTab" onclick="setTab('food')">Food</button>
    <button id="groceryTab" onclick="setTab('grocery')">Groceries</button>
  </div> -->

  <section id="orders">
    <div class="loading">Loading your orders...</div>
  </section>
</main>
<footer>DARVOZ · One App. Every Need.</footer>

<script>
const API = location.origin;
const customerId = localStorage.getItem("customerId");
let allOrders = [];
// let currentTab = "food";

const activeStatuses = [
  "pending", "processing", "accepted", "preparing",
  "delivery assigned", "picked up", "out for delivery",
  "reached customer"
];

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

function money(value) {
  const n = Number(value);
  return "₹" + (Number.isFinite(n) ? n.toLocaleString("en-IN", {
    maximumFractionDigits: 2
  }) : "0");
}

function statusText(value) {
  return String(value || "Pending").trim().replace(/\b\w/g, c => c.toUpperCase());
}

function isActive(order) {
  return activeStatuses.includes(String(order.status || "pending").trim().toLowerCase());
}

// function setTab(tab) {
//   currentTab = tab;
//   document.getElementById("foodTab").classList.toggle("active", tab === "food");
//   document.getElementById("groceryTab").classList.toggle("active", tab === "grocery");
//   renderOrders();
// }

async function loadOrders() {
  const root = document.getElementById("orders");

  if (!customerId) {
    root.innerHTML = '<div class="error">Please log in to view your orders.</div>';
    return;
  }

  root.innerHTML = '<div class="loading">Loading your orders...</div>';

  try {
    const response = await fetch(
      `${API}/orders/customer/${encodeURIComponent(customerId)}`
    );
    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Could not load orders");
    }

    allOrders = Array.isArray(data.orders) ? data.orders : [];
    renderOrders();
  } catch (error) {
    console.error("DARVOZ orders:", error);
    root.innerHTML = '<div class="error">Unable to load orders. Please try again.</div>';
  }
}

function renderOrders() {
  const root = document.getElementById("orders");

  // The current customer-orders API does not expose a confirmed category field.
  // Until it does, show the customer's full order history in either tab.
  const orders = allOrders;

  if (!orders.length) {
    root.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-bag-shopping"></i>
        <p>No orders yet.</p>
        <p>Start ordering with DARVOZ!</p>
        <br><button class="reorder" onclick="location.href='index.html'">Explore DARVOZ</button>
      </div>`;
    return;
  }

  root.innerHTML = orders.map(order => {
    const id = Number(order.id);
    const active = isActive(order);
    const status = String(order.status || "pending").toLowerCase();
    const cancelled = ["cancelled", "canceled", "rejected", "failed"].includes(status);
    const name = order.restaurant_name || "DARVOZ Order";
    const date = order.created_at ? new Date(order.created_at).toLocaleString("en-IN", {
      day: "numeric", month: "short", hour: "numeric", minute: "2-digit"
    }) : "Order #" + id;

    return `
      <article class="order-card">
        <div class="card-top">
          <div class="restaurant-icon"><i class="fa-solid fa-utensils"></i></div>
          <div class="restaurant">
            <h3>${safe(name)}</h3>
            <p>Order #${safe(id)}</p>
          </div>
          <span class="status ${active ? "active" : cancelled ? "cancelled" : ""}">
            ${safe(statusText(order.status))}
          </span>
        </div>

        <div class="card-body">
          <div class="item-preview" id="preview-${id}">
            <i class="fa-solid fa-bag-shopping"></i> Order items
          </div>
          <div class="order-meta">
            <span>${safe(date)}</span>
            <span>Total<br><strong>${money(order.grand_total)}</strong></span>
          </div>
          <div class="actions">
            ${active ? `<button class="track" onclick="trackOrder(${id})"><i class="fa-solid fa-location-dot"></i> Track Order</button>` : ""}
            <button class="details" onclick="viewDetails(${id})">Order Details</button>
            <button class="reorder" onclick="reorder(${id})">Reorder</button>
          </div>
        </div>
      </article>`;
  }).join("");

  orders.forEach(loadItemPreview);
}

async function loadItemPreview(order) {
  const id = Number(order.id);
  const target = document.getElementById(`preview-${id}`);
  if (!target) return;

  try {
    const response = await fetch(`${API}/orders/items/${encodeURIComponent(id)}`);
    const data = await response.json();
    if (!response.ok || !data.success || !Array.isArray(data.items)) return;

    target.innerHTML = data.items.length
      ? data.items.map(item =>
          `<div style="padding:4px 0"><i class="fa-solid fa-circle-check"></i>${safe(item.product_name || "Item")} × ${Number(item.qty) || 1}</div>`
        ).join("")
      : '<i class="fa-solid fa-bag-shopping"></i> Order items';
  } catch (error) {
    console.warn("Could not load items for order", id, error);
  }
}

function trackOrder(id) {
  location.href = `track.html?id=${encodeURIComponent(id)}`;
}

function viewDetails(id) {
  // The details page can read this ID from the URL.
  location.href = `order-details.html?id=${encodeURIComponent(id)}`;
}

function reorder(id) {
  // Avoid pretending items have been added to cart when no reorder API is configured.
  alert("To reorder, open the order details and use the current ordering flow. Automatic reorder needs to be connected to your cart API.");
}

loadOrders();
</script>
</body>
</html>
