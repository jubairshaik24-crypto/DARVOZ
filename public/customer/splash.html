<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DARVOZ</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            width:100%;
            height:100vh;
            overflow:hidden;

            display:flex;
            align-items:center;
            justify-content:center;

            background:linear-gradient(135deg,#ff8a00,#ff6200);
            font-family:Arial,sans-serif;
        }

        .splash{
            width:100%;
            height:100vh;

            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;

            color:white;
            text-align:center;

            position:relative;
            overflow:hidden;
        }

        .logo{
            font-size:52px;
            font-weight:800;
            letter-spacing:3px;
        }

        .tagline{
            margin-top:8px;
            font-size:10px;
            font-weight:bold;
            letter-spacing:4px;
        }

        .location-status{
            margin-top:35px;
            font-size:13px;
            opacity:.9;
        }

        .loader{
            width:38px;
            height:38px;

            border:4px solid rgba(255,255,255,.3);
            border-top-color:#fff;

            border-radius:50%;

            margin-top:15px;

            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

        .bottom{
            position:absolute;
            bottom:45px;

            font-size:13px;
            letter-spacing:1px;
            opacity:.85;
        }
    </style>
</head>

<body>

<div class="splash">

    <div class="logo">DARVOZ</div>

    <div class="tagline">
        ONE APP. EVERY NEED.
    </div>

    <div class="location-status" id="locationStatus">
        Detecting your location...
    </div>

    <div class="loader"></div>

    <div class="bottom">
        Delivering Happiness 🧡
    </div>

</div>


<script>

const locationStatus =
    document.getElementById("locationStatus");


function goToLogin(){

    setTimeout(() => {


const isLoggedIn =
    localStorage.getItem("customerLoggedIn") === "true";

if (isLoggedIn) {
    window.location.href = "index.html";
} else {
    window.location.href = "customer-login.html";
}

    }, 1200);

}


function getLocation(){

    if(!navigator.geolocation){

        locationStatus.innerText =
            "Location not supported";

        goToLogin();
        return;
    }


    navigator.geolocation.getCurrentPosition(

       function(position){

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;


    // SAVE COORDINATES

   localStorage.setItem(
    "latitude",
    String(latitude)
);

localStorage.setItem(
    "longitude",
    String(longitude)
);


    // SHOW FINDING LOCATION

    locationStatus.innerText =
        "Finding your delivery location...";


    // GET LOCATION NAME

    fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`
    )
    .then(response => response.json())
    .then(data => {

        const address = data.address || {};


        // GET LOCATION NAME

        const locationName =
            address.village ||
            address.town ||
            address.city ||
            address.suburb ||
            address.county ||
            "your location";


        // SAVE LOCATION NAME
         localStorage.setItem(
    "locationName",
    locationName
);

        // SHOW RESULT

        locationStatus.innerText =
            `📍 Delivering to ${locationName}...`;


      
        // GO TO LOGIN / HOME
s
goToLogin();

    })
    .catch(error => {

        console.log("Location name error:", error);

        locationStatus.innerText =
            "📍 Location detected";

        goToLogin();

    });

},


        function(error){

            // USER DENIED OR ERROR

            locationStatus.innerText =
                "Continuing without location...";


            goToLogin();

        },


        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}


// START LOCATION DETECTION

getLocation();

</script>

</body>
</html>
