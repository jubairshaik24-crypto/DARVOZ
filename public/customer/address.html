<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Addresses</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

  <style>
/* =========================================================
   DARVOZ SAVED ADDRESS
   DEEP OCEAN PREMIUM UI
========================================================= */

:root{
    --ocean:#004D5B;
    --ocean-dark:#003742;
    --ocean-deep:#002A34;
    --ocean-light:#E8F5F7;
    --orange:#FF6500;
    --green:#18A957;
    --text:#092F38;
    --muted:#687D84;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#F4FBFC;
    font-family:Poppins,Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:relative;
    height:115px;
    display:flex;
    align-items:flex-end;
    padding:0 20px 22px;
    background:
        radial-gradient(circle at 90% 20%,rgba(255,101,0,.16),transparent 28%),
        linear-gradient(135deg,var(--ocean-deep),var(--ocean));
    color:#fff;
    box-shadow:0 8px 25px rgba(0,77,91,.20);
    overflow:hidden;
}

/* decorative ocean shape */
.header::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,255,255,.045);
    top:-100px;
    right:-35px;
}

.header::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.035);
    bottom:-80px;
    left:-35px;
}

.back{
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    margin-right:14px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.15);
    position:relative;
    z-index:2;
    transition:.25s;
}

.back:hover{
    background:rgba(255,255,255,.22);
    transform:translateX(-2px);
}

.title{
    position:relative;
    z-index:2;
    font-size:24px;
    font-weight:700;
    letter-spacing:-.4px;
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:22px 18px 45px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
    height:58px;
    display:flex;
    align-items:center;
    background:#fff;
    border:1px solid rgba(0,77,91,.06);
    border-radius:18px;
    padding:0 18px;
    margin-bottom:18px;
    box-shadow:0 6px 22px rgba(0,77,91,.08);
    transition:.25s;
}

.search-box:focus-within{
    border-color:rgba(0,77,91,.25);
    box-shadow:0 8px 26px rgba(0,77,91,.12);
}

.search-box i{
    font-size:19px;
    color:var(--ocean);
    margin-right:13px;
}

.search-box input{
    border:none;
    outline:none;
    width:100%;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
    background:transparent;
}

.search-box input::placeholder{
    color:#91A1A6;
}

/* =========================================================
   ACTION CARDS
========================================================= */

.action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:28px;
}

.action-card{
    min-height:105px;
    background:#fff;
    border-radius:20px;
    padding:17px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    border:1px solid rgba(0,77,91,.055);
    box-shadow:0 6px 22px rgba(0,77,91,.075);
    transition:.25s;
}

.action-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 28px rgba(0,77,91,.13);
}

.action-card:active{
    transform:scale(.98);
}

.action-card i{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    margin-bottom:12px;
    color:var(--ocean);
    background:var(--ocean-light);
}

/* current location */
.action-card:first-child i{
    color:#159653;
    background:#E1F8EA;
}

/* add address */
.action-card:last-child i{
    color:var(--orange);
    background:#FFF0E6;
}

.action-card h4{
    margin:0;
    font-size:15px;
    line-height:21px;
    font-weight:700;
    color:var(--text);
}

/* =========================================================
   SAVED TITLE
========================================================= */

.saved-title{
    margin:0 0 14px;
    font-size:14px;
    font-weight:800;
    color:var(--ocean);
    letter-spacing:.8px;
    text-transform:uppercase;
}

/* =========================================================
   SAVED ADDRESS CARD
========================================================= */

.saved-card{
    position:relative;
    display:flex;
    align-items:flex-start;
    background:#fff;
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    border:1px solid rgba(0,77,91,.055);
    box-shadow:0 7px 24px rgba(0,77,91,.075);
    transition:.25s;
    overflow:hidden;
}

.saved-card:hover{
    transform:translateY(-2px);
    box-shadow:0 11px 30px rgba(0,77,91,.11);
}

/* subtle ocean line */
.saved-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:var(--ocean);
}

/* =========================================================
   LEFT ICON
========================================================= */

.left-icon{
    width:62px;
    min-width:62px;
    height:62px;
    border-radius:18px;
    margin-right:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--ocean-light);
}

.left-icon i{
    font-size:21px;
    color:var(--ocean);
    margin-bottom:4px;
}

.left-icon span{
    font-size:9px;
    color:var(--ocean);
    font-weight:700;
    white-space:nowrap;
}

/* =========================================================
   ADDRESS INFO
========================================================= */

.address-info{
    flex:1;
    min-width:0;
    padding-right:30px;
}

.address-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
    flex-wrap:wrap;
}

.address-head h3{
    margin:0;
    font-size:18px;
    line-height:24px;
    font-weight:800;
    color:var(--text);
}

.selected{
    background:#DDF8EA;
    color:#149552;
    padding:4px 9px;
    border-radius:20px;
    font-size:9px;
    font-weight:800;
    letter-spacing:.3px;
}

.address-info p{
    margin:0;
    font-size:13px;
    line-height:21px;
    color:#60777E;
    word-break:break-word;
}

/* =========================================================
   DELIVER HERE
========================================================= */

.deliverBtn{
    margin-top:13px;
    border:none;
    background:var(--ocean);
    color:#fff;
    padding:9px 15px;
    border-radius:11px;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 4px 12px rgba(0,77,91,.18);
}

.deliverBtn:hover{
    background:var(--ocean-dark);
    transform:translateY(-1px);
}

.deliverBtn:active{
    transform:scale(.97);
}

/* =========================================================
   THREE DOT MENU
========================================================= */

.menu{
    position:absolute;
    top:17px;
    right:14px;
    width:34px;
    height:34px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    color:#668087;
    cursor:pointer;
    transition:.2s;
}

.menu:hover{
    background:var(--ocean-light);
    color:var(--ocean);
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty{
    background:#fff;
    border-radius:20px;
    padding:55px 20px;
    text-align:center;
    color:#829398;
    font-size:15px;
    box-shadow:0 6px 20px rgba(0,77,91,.06);
}

.empty::before{
    content:"\f3c5";
    font-family:"Font Awesome 6 Free";
    font-weight:900;
    display:block;
    font-size:40px;
    color:#BCDDE2;
    margin-bottom:13px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,32,39,.62);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:9999;
    padding:0;
}

.modal-content{
    width:100%;
    max-width:500px;
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    padding:24px 20px 28px;
    border-radius:26px 26px 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.20);
    animation:modalUp .28s ease;
}

@keyframes modalUp{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.modal h2{
    margin:0 0 20px;
    font-size:21px;
    font-weight:800;
    color:var(--text);
}

/* =========================================================
   LOCATION BUTTON
========================================================= */

.locationBtn{
    width:100%;
    padding:14px;
    background:#E4F8EC;
    color:#159653;
    border:1px solid #C8EFD8;
    border-radius:13px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-bottom:16px;
    transition:.2s;
}

.locationBtn:hover{
    background:#D7F3E2;
}

/* =========================================================
   FORM
========================================================= */

.modal input,
.modal select{
    width:100%;
    padding:14px 15px;
    margin-bottom:12px;
    border:1px solid #DDE7E9;
    border-radius:13px;
    background:#F9FCFC;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    outline:none;
    transition:.2s;
}

.modal input:focus,
.modal select:focus{
    border-color:var(--ocean);
    background:#fff;
    box-shadow:0 0 0 3px rgba(0,77,91,.08);
}

/* =========================================================
   SAVE BUTTON
========================================================= */

.saveBtn{
    width:100%;
    padding:15px;
    margin-top:5px;
    background:var(--ocean);
    color:#fff;
    border:none;
    border-radius:14px;
    font-family:inherit;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 7px 18px rgba(0,77,91,.22);
    transition:.25s;
}

.saveBtn:hover{
    background:var(--ocean-dark);
}

.saveBtn:active{
    transform:scale(.98);
}

/* =========================================================
   MENU POPUP
========================================================= */

.menu-popup{
    position:fixed;
    background:#fff;
    border-radius:17px;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
    display:none;
    overflow:hidden;
    z-index:99999;
    min-width:185px;
    border:1px solid rgba(0,77,91,.07);
}

.menu-popup button{
    width:100%;
    border:none;
    background:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
    transition:.2s;
}

.menu-popup button:hover{
    background:#F2FAFB;
}

.menu-popup button i{
    color:var(--ocean);
    width:20px;
    font-size:15px;
}

.menu-popup button:last-child i{
    color:#E53935;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header{
        height:105px;
        padding:0 16px 18px;
    }

    .back{
        width:40px;
        height:40px;
        font-size:18px;
        margin-right:12px;
    }

    .title{
        font-size:20px;
    }

    .container{
        padding:18px 14px 35px;
    }

    .search-box{
        height:54px;
        border-radius:17px;
        margin-bottom:15px;
    }

    .action-grid{
        gap:10px;
        margin-bottom:23px;
    }

    .action-card{
        min-height:105px;
        padding:14px;
        border-radius:18px;
    }

    .action-card i{
        width:43px;
        height:43px;
        font-size:19px;
        border-radius:13px;
        margin-bottom:10px;
    }

    .action-card h4{
        font-size:13px;
        line-height:18px;
    }

    .saved-title{
        font-size:13px;
        margin-bottom:12px;
    }

    .saved-card{
        padding:15px 14px;
        border-radius:19px;
        margin-bottom:12px;
    }

    .left-icon{
        width:54px;
        min-width:54px;
        height:54px;
        border-radius:15px;
        margin-right:11px;
    }

    .left-icon i{
        font-size:18px;
    }

    .left-icon span{
        font-size:8px;
    }

    .address-info{
        padding-right:26px;
    }

    .address-head{
        gap:6px;
        margin-bottom:5px;
    }

    .address-head h3{
        font-size:16px;
        line-height:21px;
    }

    .selected{
        font-size:8px;
        padding:3px 7px;
    }

    .address-info p{
        font-size:12px;
        line-height:19px;
    }

    .deliverBtn{
        padding:8px 12px;
        font-size:11px;
        border-radius:9px;
        margin-top:10px;
    }

    .menu{
        top:12px;
        right:8px;
        width:30px;
        height:30px;
    }

    .modal-content{
        padding:21px 16px 25px;
        border-radius:24px 24px 0 0;
    }

    .modal h2{
        font-size:20px;
    }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

    .action-card h4{
        font-size:12px;
    }

    .saved-card{
        padding:13px 12px;
    }

    .left-icon{
        width:50px;
        min-width:50px;
        height:50px;
        margin-right:9px;
    }

    .address-head h3{
        font-size:15px;
    }

    .address-info p{
        font-size:11.5px;
        line-height:18px;
    }
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-track{
    background:#F4FBFC;
}

::-webkit-scrollbar-thumb{
    background:#B6D5DA;
    border-radius:10px;
}
</style>

</head>

<body>

    <!-- ==========================
         HEADER
    ========================== -->

    <div class="header">

        <div class="back" onclick="history.back()">

            <i class="fa fa-arrow-left"></i>

        </div>

        <div class="title">
            Select Your Location
        </div>

    </div>


    <!-- ==========================
         MAIN
    ========================== -->

    <div class="container">

        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa fa-search"></i>

            <input
                type="text"
                id="searchAddress"
                placeholder="Search your address..."
            >

        </div>


        <!-- ACTIONS -->

        <div class="action-grid">

            <div
                class="action-card"
                onclick="currentLocation()"
            >

                <i class="fa-solid fa-location-crosshairs"></i>

                <h4>
                    Use Current Location
                </h4>

            </div>


            <div
                class="action-card"
                onclick="openModal()"
            >

                <i class="fa-solid fa-plus"></i>

                <h4>
                    Add New Address
                </h4>

            </div>

        </div>


        <!-- SAVED ADDRESSES -->

        <h3 class="saved-title">
            SAVED ADDRESSES
        </h3>


        <div id="addressList">

            <div class="empty">
                Loading Addresses...
            </div>

        </div>

    </div>


    <!-- ==========================
         ADD ADDRESS MODAL
    ========================== -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal-content">

            <h2 id="modalTitle">
                Add Address
            </h2>


            <button
                class="locationBtn"
                onclick="currentLocation()"
            >
                ◎ Use Current Location
            </button>


            <select id="title">

                <option value="Home">
                    Home
                </option>

                <option value="Work">
                    Work
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <input
                id="house"
                placeholder="House / Flat No"
            >


            <input
                id="street"
                placeholder="Street"
            >


            <input
                id="area"
                placeholder="Area"
            >


            <input
                id="city"
                placeholder="City"
            >


            <input
                id="state"
                placeholder="State"
            >


            <input
                id="pincode"
                placeholder="Pincode"
            >


            <button
                class="saveBtn"
                onclick="saveAddress()"
            >
                Save Address
            </button>

        </div>

    </div>


    <!-- ==========================
         MENU POPUP
    ========================== -->

    <div
        id="menuPopup"
        class="menu-popup"
    >

        <button onclick="editSelected()">

            <i class="fa fa-pen"></i>

            Edit

        </button>


        <button onclick="makeDefault()">

            <i class="fa fa-star"></i>

            Make Default

        </button>


        <button onclick="deleteSelected()">

            <i class="fa fa-trash"></i>

            Delete

        </button>

    </div>


    <!-- ==========================
         GOOGLE MAPS
    ========================== -->

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDFSLc0npyYLrB-JMhkaCg6Q1xlPNE8TfQ&libraries=places"
    ></script>


    <script>

        /* ==========================================
           CONFIG
        ========================================== */

        const API = window.location.origin;

        const customerId =
            localStorage.getItem("customerId");

        let editId = null;

        let latitude = "";

        let longitude = "";

        let allAddresses = [];

        let selectedAddress = {};

        let autocomplete = null;


        /* ==========================================
           START
        ========================================== */

        if (!customerId) {

            console.warn(
                "⚠️ No customerId found in localStorage"
            );

        }

        loadAddresses();


        /* ==========================================
           DISTANCE
        ========================================== */

        function getDistance(lat2, lng2) {

            const lat1 =
                localStorage.getItem("latitude");

            const lng1 =
                localStorage.getItem("longitude");


            if (
                !lat1 ||
                !lng1 ||
                lat2 === null ||
                lng2 === null ||
                lat2 === undefined ||
                lng2 === undefined ||
                lat2 === "" ||
                lng2 === ""
            ) {

                return "--";

            }


            const R = 6371;


            const dLat =
                (Number(lat2) - Number(lat1))
                * Math.PI / 180;


            const dLon =
                (Number(lng2) - Number(lng1))
                * Math.PI / 180;


            const a =
                Math.sin(dLat / 2) ** 2 +

                Math.cos(
                    Number(lat1) * Math.PI / 180
                ) *

                Math.cos(
                    Number(lat2) * Math.PI / 180
                ) *

                Math.sin(dLon / 2) ** 2;


            const c =
                2 *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );


            return (
                R * c
            ).toFixed(1);

        }


        /* ==========================================
           LOAD ADDRESSES
        ========================================== */

        async function loadAddresses() {

            const list =
                document.getElementById("addressList");


            if (!customerId) {

                list.innerHTML = `
                    <div class="empty">
                        Please login again.
                    </div>
                `;

                return;

            }


            try {

                const res =
                    await fetch(
                        `${API}/address/${customerId}`
                    );


                if (!res.ok) {

                    throw new Error(
                        "Failed to load addresses"
                    );

                }


                const addresses =
                    await res.json();


                allAddresses =
                    Array.isArray(addresses)
                        ? addresses
                        : [];


                if (allAddresses.length === 0) {

                    list.innerHTML = `
                        <div class="empty">
                            No Saved Addresses
                        </div>
                    `;

                    return;

                }


                list.innerHTML = "";


                allAddresses.forEach(a => {

                    const distance =
                        getDistance(
                            a.latitude,
                            a.longitude
                        );


                    const selectedAddressId =
    localStorage.getItem("selectedAddressId");

const selected =
    (
        selectedAddressId &&
        String(a.id) === String(selectedAddressId)
    )
    ||
    (
        !selectedAddressId &&
        Number(a.is_default) === 1
    )
        ? `
            <span class="selected">
                SELECTED
            </span>
          `
        : "";


                    list.innerHTML += `

                        <div class="saved-card">

                            <div class="left-icon">

                                <i class="fa-solid fa-location-arrow"></i>

                                <span>
                                    ${distance} km
                                </span>

                            </div>


                            <div class="address-info">

                                <div class="address-head">

                                    <h3>
                                        ${escapeHtml(a.title || "Address")}
                                    </h3>

                                    ${selected}

                                </div>


                                <p>
                                    ${escapeHtml(a.house || "")},
                                    ${escapeHtml(a.street || "")},
                                    ${escapeHtml(a.area || "")},
                                    ${escapeHtml(a.city || "")},
                                    ${escapeHtml(a.state || "")},
                                    ${escapeHtml(a.pincode || "")}
                                </p>


                                <button
                                    class="deliverBtn"
                                    onclick='deliverHere(
                                        event,
                                        ${JSON.stringify(a.id)},
                                        ${JSON.stringify(a.house || "")},
                                        ${JSON.stringify(a.street || "")},
                                        ${JSON.stringify(a.area || "")},
                                        ${JSON.stringify(a.city || "")},
                                        ${JSON.stringify(a.state || "")},
                                        ${JSON.stringify(a.pincode || "")},
                                        ${JSON.stringify(a.latitude ?? "")},
                                        ${JSON.stringify(a.longitude ?? "")}
                                    )'
                                >
                                    Deliver Here
                                </button>

                            </div>


                            <div
                                class="menu"
                                onclick='showMenu(
                                    event,

        function currentLocation() {

            if (
                !navigator.geolocation

                alert(

                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function (position) {

                    latitude =
                        position.coords.latitude;

                    longitude =
                        position.coords.longitude;


                    console.log(
                        " CURRENT GPS LOCATION"
                    );

                    console.log(
                        "Latitude:",
                        latitude
                    );

                    console.log(
                        "Longitude:",
                        longitude
                    );


                    /*
                     * IMPORTANT:
                     *
                     * User has intentionally chosen
                     * their physical/current location.
                     *
                     * Therefore remove the old
                     * manually selected location flag.
                     */

                    localStorage.removeItem(
                        "manualLocationSelected"
                    );


                    if (
                        typeof google === "undefined" ||
                        !google.maps
                    ) {

                        alert(
                            "Google Maps is not loaded."
                        );

                        return;

                    }


                    const geocoder =
                        new google.maps.Geocoder();


                    const latlng = {

                        lat: Number(latitude),

                        lng: Number(longitude)

                    };


                    geocoder.geocode(

                        {
                            location: latlng
                        },

                        function (
                            results,
                            status
                        ) {

                            if (
                                status !== "OK" ||
                                !results ||
                                !results[0]
                            ) {

                                alert(
                                    "Unable to fetch address."
                                );

                                return;

                            }


                            fillAddressFromComponents(
                                results[0]
                                    .address_components || []
                            );


                            /*
                             * Make sure the modal opens
                             * with the GPS coordinates.
                             */

                            document
                                .getElementById("modal")
                                .style.display =
                                "flex";


                            document.getElementById(
                                "modalTitle"
                            ).textContent =
                                "Add Current Location";

                        }

                    );

                },

                function (error) {

                    console.error(
                        "LOCATION ERROR:",
                        error
                    );


                    alert(
                        "Unable to get your current location. Please allow location access."
                    );

                },

                {

                    enableHighAccuracy: true,

                    timeout: 15000,

                    maximumAge: 0

                }

            );

        }

        function fillAddressFromComponents(
            components

            let house = "";

            let area = "";

            let city = "";

            let state = "";

            let pincode = "";


            components.forEach(c => {

                    c.types.includes(

                        c.long_name;

                }


                if (
                    c.types.includes(
                        "route"
                    )
                ) {

                    street =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "sublocality"
                    ) ||

                    c.types.includes(
                        "sublocality_level_1"
                    ) ||

                    c.types.includes(
                        "sublocality_level_2"
                    ) ||

                    c.types.includes(
                        "neighborhood"
                    )
                ) {

                    area =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "locality"
                    )
                ) {

                    city =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "administrative_area_level_1"
                    )
                ) {

                    state =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "postal_code"
                    )
                ) {

        async function deleteAddress(id) {

                !confirm(
                    "Delete Address?"
                )
            ) {

                return;

            }


            try {

                const response =
                    await fetch(

                        `${API}/address/${id}`,

                        {
                            method: "DELETE"
                        }

                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to delete address"
                    );

                }


                /*
                 * If the deleted address was the
                 * currently selected manual address,
                 * remove the location data so the
                 * next page does not use stale data.
                 */

                const currentSelected =
                    localStorage.getItem(
                        "selectedAddress"
                    );


                const deletedAddress =
                    allAddresses.find(
                        a => String(a.id) === String(id)
                    );


                if (
                    deletedAddress &&
                    currentSelected
                ) {

                    const deletedFullAddress =
                        [

                            deletedAddress.house,

                            deletedAddress.street,

                            deletedAddress.area,

                            deletedAddress.city,

                            deletedAddress.state

                        ]
                        .map(v =>
                            String(v || "").trim()
                        )
                        .filter(Boolean)
                        .join(", ");


                    if (
                        currentSelected.includes(
                            deletedFullAddress
                        )
                    ) {

                        localStorage.removeItem(
                            "locationName"
                        );

                        localStorage.removeItem(
                            "selectedAddress"
                        );

                        localStorage.removeItem(
                            "latitude"
                        );

                        localStorage.removeItem(
                            "longitude"
                        );

                        localStorage.removeItem(
                            "manualLocationSelected"
                        );

                    }

                }


                await loadAddresses();

            }

        /* ==========================================
           ACTIVATE SAVED ADDRESS
           
           THIS IS THE IMPORTANT FUNCTION.
           
           It makes the selected saved address
           the real active delivery location,
           regardless of the phone's physical GPS.
        ========================================== */

        function activateAddress(a) {

            const house =
                String(a.house || "").trim();

            const street =
                String(a.street || "").trim();

            const area =
                String(a.area || "").trim();

            const city =
                String(a.city || "").trim();

            const state =
                String(a.state || "").trim();

            const pincode =
                String(a.pincode || "").trim();


            /* ===============================
               LOCATION NAME
            =============================== */

            let locationName = "";


            if (
                area &&
                city
            ) {

                locationName =
                    `${area}, ${city}`;

            }

            else if (city) {

                locationName =
                    city;

            }

            else {

                locationName =
                    area;

            }


            /* ===============================
               FULL ADDRESS
            =============================== */

            const addressParts = [

                house,

                street,

                area,

                city,

                state

            ]
            .filter(Boolean);


            let fullAddress =
                addressParts.join(", ");


            if (pincode) {

                fullAddress +=
                    ` - ${pincode}`;

            }


            /* ===============================
               SAVE LOCATION NAME
            =============================== */

            localStorage.setItem(
                "locationName",
                locationName
            );


            /* ===============================
               SAVE FULL ADDRESS
            =============================== */

            localStorage.setItem(
                "selectedAddress",
                fullAddress
            );


            /*
             * THIS IS THE KEY.
             *
             * It tells index.html:
             *
             * "The customer intentionally selected
             * a saved address. Do NOT replace it
             * with the phone's physical GPS."
             */

            localStorage.setItem(
                "manualLocationSelected",
                "true"
            );


            /* ===============================
               SAVE SELECTED ADDRESS ID
            =============================== */

            if (
                a.id !== null &&
                a.id !== undefined
            ) {

                localStorage.setItem(
                    "selectedAddressId",
                    String(a.id)
                );

            }


            /* ===============================
               SAVE GPS OF SAVED ADDRESS
            =============================== */

            if (
                a.latitude !== "" &&
                a.latitude !== null &&
                a.latitude !== undefined
            ) {

                localStorage.setItem(
                    "latitude",
                    String(a.latitude)
                );

            }


            if (
                a.longitude !== "" &&
                a.longitude !== null &&
                a.longitude !== undefined
            ) {

                localStorage.setItem(
                    "longitude",
                    String(a.longitude)
                );

            }


            console.log(
                "=================================="
            );

            console.log(
                "✅ SAVED ADDRESS ACTIVATED"
            );

            console.log(
                "Location:",
                locationName
            );

            console.log(
                "Address:",
                fullAddress
            );

            console.log(
                "Latitude:",
                a.latitude
            );

            console.log(
                "Longitude:",
                a.longitude
            );

            console.log(
                "manualLocationSelected:",
                localStorage.getItem(
                    "manualLocationSelected"
                )
            );

            console.log(
                "=================================="
            );

        }

            ) {

                left =
                    window.innerWidth - 190;

            }


            if (
                top + 150 >
                window.innerHeight
            ) {

                top =
                    window.innerHeight - 160;

            }


            popup.style.left =
                `${left}px`;


            popup.style.top =
                `${top}px`;

        }


        /* ==========================================
           EDIT SELECTED
        ========================================== */

        function editSelected() {

            document
                .getElementById(
                    "menuPopup"
                )
                .style.display =
                "none";


            editAddress(

                selectedAddress.id,

                selectedAddress.title,

                selectedAddress.house,

                selectedAddress.street,

                selectedAddress.area,

                selectedAddress.city,

                selectedAddress.state,

                selectedAddress.pincode,

                selectedAddress.lat,

                selectedAddress.lng

            );

        }


        /* ==========================================
           MAKE DEFAULT
        ========================================== */

        function makeDefault() {

            document
                .getElementById(
                    "menuPopup"
                )
                .style.display =
                "none";


            setDefault(
                selectedAddress.id
            );

        }


        /* ==========================================
           DELETE SELECTED
        ========================================== */

        function deleteSelected() {

            document
                .getElementById(
                    "menuPopup"
                )
                .style.display =
                "none";


            deleteAddress(
                selectedAddress.id
            );

        }


        /* ==========================================
           CLOSE MENU
        ========================================== */

        document.addEventListener(
            "click",
            function () {

                document
                    .getElementById(
                        "menuPopup"
                    )
                    .style.display =
                    "none";

            }
        );


        /* ==========================================
           GOOGLE PLACES AUTOCOMPLETE
        ========================================== */

        window.addEventListener(
            "load",
            function () {

                const input =
                    document.getElementById(
                        "searchAddress"
                    );


                if (
                    typeof google === "undefined" ||
                    !google.maps ||
                    !google.maps.places
                ) {

                    console.warn(
                        "Google Places API unavailable."
                    );

                    return;

                }


                autocomplete =
                    new google.maps.places.Autocomplete(

                        input,

                        {

                            componentRestrictions: {
                                country: "in"
                            },

                            fields: [

                                "formatted_address",

                                "geometry",

                                "address_components"

                            ]

                        }

                    );


                autocomplete.addListener(
                    "place_changed",
                    fillAddress
                );

            }
        );


        /* ==========================================
           FILL ADDRESS FROM SEARCH
        ========================================== */
         
    function fillAddress() {

    const place = autocomplete.getPlace();

    if (!place || !place.geometry) {
        return;
    }

    /*
     * IMPORTANT:
     *
     * Google Places has already given us the
     * exact coordinates of the selected address.
     *
     * Store them BEFORE filling/opening the form.
     */

    latitude =
        place.geometry.location.lat();

    longitude =
        place.geometry.location.lng();

    console.log("◎ GOOGLE PLACE SELECTED");
    console.log("Latitude:", latitude);
    console.log("Longitude:", longitude);

    /*
     * Fill address fields.
     */

    fillAddressFromComponents(
        place.address_components || []
    );

    /*
     * IMPORTANT:
     *
     * Do NOT call openModal() here because
     * openModal() calls clearForm(), which would
     * erase latitude and longitude.
     */

    editId = null;

    document.getElementById(
        "modal"
    ).style.display = "flex";

    document.getElementById(
        "modalTitle"
    ).textContent = "Add Address";

    /*
     * Clear only the search box.
     */

    document.getElementById(
        "searchAddress"
    ).value = "";

}

        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHtml(value) {

            return String(value || "")

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>
