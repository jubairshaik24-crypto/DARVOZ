<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Addresses</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f6f6f6;
            font-family: Poppins, Arial, sans-serif;
            color: #222;
        }

        /* ==========================
           HEADER
        ========================== */

        .header {
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: #fff;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        }

        .back {
            font-size: 24px;
            cursor: pointer;
            margin-right: 18px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
        }

        /* ==========================
           CONTAINER
        ========================== */

        .container {
            padding: 18px;
            max-width: 900px;
            margin: auto;
        }

        /* ==========================
           SEARCH
        ========================== */

        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .05);
        }

        .search-box i {
            font-size: 20px;
            color: #888;
            margin-right: 12px;
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: none;
        }

        /* ==========================
           ACTION GRID
        ========================== */

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 25px;
        }

        .action-card {
            background: #fff;
            border-radius: 18px;
            padding: 20px 15px;
            text-align: left;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .05);
        }

        .action-card:hover {
            transform: translateY(-3px);
        }

        .action-card i {
            font-size: 28px;
            color: #ff6200;
            margin-bottom: 18px;
        }

        .action-card h4 {
            margin: 0;
            font-size: 17px;
            line-height: 24px;
        }

        /* ==========================
           SAVED TITLE
        ========================== */

        .saved-title {
            font-size: 15px;
            font-weight: 700;
            color: #888;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* ==========================
           SAVED CARD
        ========================== */

        .saved-card {
            display: flex;
            align-items: flex-start;
            background: #fff;
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, .06);
            transition: .3s;
        }

        .saved-card:hover {
            transform: translateY(-2px);
        }

        /* ==========================
           LEFT ICON
        ========================== */

        .left-icon {
            width: 70px;
            min-width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .left-icon i {
            font-size: 22px;
            color: #222;
            margin-bottom: 8px;
        }

        .left-icon span {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ==========================
           ADDRESS INFO
        ========================== */

        .address-info {
            flex: 1;
            min-width: 0;
        }

        .address-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .address-head h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .selected {
            background: #d9fff0;
            color: #17a567;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .address-info p {
            margin: 0;
            font-size: 18px;
            line-height: 30px;
            color: #555;
        }

        /* ==========================
           MENU
        ========================== */

        .menu {
            font-size: 22px;
            cursor: pointer;
            padding: 6px;
            margin-left: 8px;
        }

        /* ==========================
           DELIVER BUTTON
        ========================== */

        .deliverBtn {
            margin-top: 15px;
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .deliverBtn:hover {
            background: #138a3c;
        }

        /* ==========================
           EMPTY
        ========================== */

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #888;
            font-size: 18px;
        }

        /* ==========================
           MODAL
        ========================== */

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .5);

            display: none;
            justify-content: center;
            align-items: center;

            z-index: 999;
        }

        .modal-content {
            background: #fff;
            width: 95%;
            max-width: 430px;

            padding: 22px;
            border-radius: 20px;

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 22px;
        }

        .locationBtn {
            width: 100%;
            padding: 14px;

            background: #16a34a;
            color: #fff;

            border: none;
            border-radius: 12px;

            font-size: 16px;
            cursor: pointer;

            margin-bottom: 15px;
        }

        .modal input,
        .modal select {
            width: 100%;

            padding: 14px;
            margin-bottom: 14px;

            border: 1px solid #ddd;
            border-radius: 12px;

            font-size: 15px;
            outline: none;
        }

        .modal input:focus,
        .modal select:focus {
            border-color: #ff6200;
        }

        .saveBtn {
            width: 100%;

            padding: 15px;

            background: #ff6200;
            color: #fff;

            border: none;
            border-radius: 12px;

            font-size: 17px;
            cursor: pointer;
        }

        /* ==========================
           MENU POPUP
        ========================== */

        .menu-popup {
            position: fixed;

            background: #fff;
            border-radius: 16px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, .15);

            display: none;

            overflow: hidden;
            z-index: 9999;

            min-width: 180px;
        }

        .menu-popup button {
            width: 100%;

            border: none;
            background: #fff;

            padding: 15px;

            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 15px;
            cursor: pointer;
        }

        .menu-popup button:hover {
            background: #f6f6f6;
        }

        .menu-popup button i {
            color: #ff6200;
            width: 20px;
        }

        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .title {
                font-size: 20px;
            }

            .action-grid {
                grid-template-columns: 1fr 1fr;
            }

            .saved-card {
                padding: 15px;
            }

            .left-icon {
                width: 55px;
                min-width: 55px;
                margin-right: 10px;
            }

            .address-head h3 {
                font-size: 20px;
            }

            .address-info p {
                font-size: 15px;
                line-height: 24px;
            }

        }

    </style>

</head>

<body>

    <!-- ==========================
         HEADER
    ========================== -->

    <div class="header">

        <div class="back" onclick="history.back()">

            <i class="fa fa-arrow-left"></i>

        </div>

        <div class="title">
            Select Your Location
        </div>

    </div>


    <!-- ==========================
         MAIN
    ========================== -->

    <div class="container">

        <!-- SEARCH -->

        <div class="search-box">

            <i class="fa fa-search"></i>

            <input
                type="text"
                id="searchAddress"
                placeholder="Search your address..."
            >

        </div>


        <!-- ACTIONS -->

        <div class="action-grid">

            <div
                class="action-card"
                onclick="currentLocation()"
            >

                <i class="fa-solid fa-location-crosshairs"></i>

                <h4>
                    Use Current Location
                </h4>

            </div>


            <div
                class="action-card"
                onclick="openModal()"
            >

                <i class="fa-solid fa-plus"></i>

                <h4>
                    Add New Address
                </h4>

            </div>

        </div>


        <!-- SAVED ADDRESSES -->

        <h3 class="saved-title">
            SAVED ADDRESSES
        </h3>


        <div id="addressList">

            <div class="empty">
                Loading Addresses...
            </div>

        </div>

    </div>


    <!-- ==========================
         ADD ADDRESS MODAL
    ========================== -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal-content">

            <h2 id="modalTitle">
                Add Address
            </h2>


            <button
                class="locationBtn"
                onclick="currentLocation()"
            >
                📍 Use Current Location
            </button>


            <select id="title">

                <option value="Home">
                    Home
                </option>

                <option value="Work">
                    Work
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <input
                id="house"
                placeholder="House / Flat No"
            >


            <input
                id="street"
                placeholder="Street"
            >


            <input
                id="area"
                placeholder="Area"
            >


            <input
                id="city"
                placeholder="City"
            >


            <input
                id="state"
                placeholder="State"
            >


            <input
                id="pincode"
                placeholder="Pincode"
            >


            <button
                class="saveBtn"
                onclick="saveAddress()"
            >
                Save Address
            </button>

        </div>

    </div>


    <!-- ==========================
         MENU POPUP
    ========================== -->

    <div
        id="menuPopup"
        class="menu-popup"
    >

        <button onclick="editSelected()">

            <i class="fa fa-pen"></i>

            Edit

        </button>


        <button onclick="makeDefault()">

            <i class="fa fa-star"></i>

            Make Default

        </button>


        <button onclick="deleteSelected()">

            <i class="fa fa-trash"></i>

            Delete

        </button>

    </div>


    <!-- ==========================
         GOOGLE MAPS
    ========================== -->

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDFSLc0npyYLrB-JMhkaCg6Q1xlPNE8TfQ&libraries=places"
    ></script>


    <script>

        /* ==========================================
           CONFIG
        ========================================== */

        const API = window.location.origin;

        const customerId =
            localStorage.getItem("customerId");

        let editId = null;

        let latitude = "";

        let longitude = "";

        let allAddresses = [];

        let selectedAddress = {};

        let autocomplete = null;


        /* ==========================================
           START
        ========================================== */

        if (!customerId) {

            console.warn(
                "⚠️ No customerId found in localStorage"
            );

        }

        loadAddresses();


        /* ==========================================
           DISTANCE
        ========================================== */

        function getDistance(lat2, lng2) {

            const lat1 =
                localStorage.getItem("latitude");

            const lng1 =
                localStorage.getItem("longitude");


            if (
                !lat1 ||
                !lng1 ||
                lat2 === null ||
                lng2 === null ||
                lat2 === undefined ||
                lng2 === undefined ||
                lat2 === "" ||
                lng2 === ""
            ) {

                return "--";

            }


            const R = 6371;


            const dLat =
                (Number(lat2) - Number(lat1))
                * Math.PI / 180;


            const dLon =
                (Number(lng2) - Number(lng1))
                * Math.PI / 180;


            const a =
                Math.sin(dLat / 2) ** 2 +

                Math.cos(
                    Number(lat1) * Math.PI / 180
                ) *

                Math.cos(
                    Number(lat2) * Math.PI / 180
                ) *

                Math.sin(dLon / 2) ** 2;


            const c =
                2 *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );


            return (
                R * c
            ).toFixed(1);

        }


        /* ==========================================
           LOAD ADDRESSES
        ========================================== */

        async function loadAddresses() {

            const list =
                document.getElementById("addressList");


            if (!customerId) {

                list.innerHTML = `
                    <div class="empty">
                        Please login again.
                    </div>
                `;

                return;

            }


            try {

                const res =
                    await fetch(
                        `${API}/address/${customerId}`
                    );


                if (!res.ok) {

                    throw new Error(
                        "Failed to load addresses"
                    );

                }


                const addresses =
                    await res.json();


                allAddresses =
                    Array.isArray(addresses)
                        ? addresses
                        : [];


                if (allAddresses.length === 0) {

                    list.innerHTML = `
                        <div class="empty">
                            No Saved Addresses
                        </div>
                    `;

                    return;

                }


                list.innerHTML = "";


                allAddresses.forEach(a => {

                    const distance =
                        getDistance(
                            a.latitude,
                            a.longitude
                        );


                    const selected =
                        Number(a.is_default) === 1
                            ? `
                                <span class="selected">
                                    SELECTED
                                </span>
                              `
                            : "";


                    list.innerHTML += `

                        <div class="saved-card">

                            <div class="left-icon">

                                <i class="fa-solid fa-location-arrow"></i>

                                <span>
                                    ${distance} km
                                </span>

                            </div>


                            <div class="address-info">

                                <div class="address-head">

                                    <h3>
                                        ${escapeHtml(a.title || "Address")}
                                    </h3>

                                    ${selected}

                                </div>


                                <p>
                                    ${escapeHtml(a.house || "")},
                                    ${escapeHtml(a.street || "")},
                                    ${escapeHtml(a.area || "")},
                                    ${escapeHtml(a.city || "")},
                                    ${escapeHtml(a.state || "")},
                                    ${escapeHtml(a.pincode || "")}
                                </p>


                                <button
                                    class="deliverBtn"
                                    onclick='deliverHere(
                                        event,
                                        ${JSON.stringify(a.house || "")},
                                        ${JSON.stringify(a.street || "")},
                                        ${JSON.stringify(a.area || "")},
                                        ${JSON.stringify(a.city || "")},
                                        ${JSON.stringify(a.state || "")},
                                        ${JSON.stringify(a.pincode || "")},
                                        ${JSON.stringify(a.latitude ?? "")},
                                        ${JSON.stringify(a.longitude ?? "")}
                                    )'
                                >
                                    Deliver Here
                                </button>

                            </div>


                            <div
                                class="menu"
                                onclick='showMenu(
                                    event,
                                    ${JSON.stringify(a.id)},
                                    ${JSON.stringify(a.title || "")},
                                    ${JSON.stringify(a.house || "")},
                                    ${JSON.stringify(a.street || "")},
                                    ${JSON.stringify(a.area || "")},
                                    ${JSON.stringify(a.city || "")},
                                    ${JSON.stringify(a.state || "")},
                                    ${JSON.stringify(a.pincode || "")},
                                    ${JSON.stringify(a.latitude ?? "")},
                                    ${JSON.stringify(a.longitude ?? "")}
                                )'
                            >

                                <i class="fa-solid fa-ellipsis-vertical"></i>

                            </div>

                        </div>

                    `;

                });

            }

            catch (error) {

                console.error(
                    "LOAD ADDRESS ERROR:",
                    error
                );


                list.innerHTML = `
                    <div class="empty">
                        Unable to load addresses.
                    </div>
                `;

            }

        }


        /* ==========================================
           SEARCH ADDRESS
        ========================================== */

        document
            .getElementById("searchAddress")
            .addEventListener(
                "input",
                searchAddress
            );


        function searchAddress() {

            const keyword =
                document
                    .getElementById("searchAddress")
                    .value
                    .toLowerCase()
                    .trim();


            const cards =
                document.querySelectorAll(
                    ".saved-card"
                );


            cards.forEach(card => {

                const text =
                    card.innerText
                        .toLowerCase();


                if (
                    text.includes(keyword)
                ) {

                    card.style.display =
                        "flex";

                }

                else {

                    card.style.display =
                        "none";

                }

            });

        }


        /* ==========================================
           OPEN MODAL
        ========================================== */

        function openModal() {

            editId = null;

            clearForm();

            document.getElementById(
                "modalTitle"
            ).textContent = "Add Address";

            document
                .getElementById("modal")
                .style.display = "flex";

        }


        /* ==========================================
           CLEAR FORM
        ========================================== */

        function clearForm() {

            document.getElementById("house").value = "";

            document.getElementById("street").value = "";

            document.getElementById("area").value = "";

            document.getElementById("city").value = "";

            document.getElementById("state").value = "";

            document.getElementById("pincode").value = "";

            document.getElementById("title").value = "Home";

            latitude = "";

            longitude = "";

        }


        /* ==========================================
           CLOSE MODAL
        ========================================== */

        window.addEventListener(
            "click",
            function (event) {

                const modal =
                    document.getElementById("modal");


                if (
                    event.target === modal
                ) {

                    modal.style.display =
                        "none";

                }

            }
        );


        /* ==========================================
           CURRENT LOCATION
           
           IMPORTANT:
           Current GPS selection removes
           manualLocationSelected.
        ========================================== */

        function currentLocation() {

            if (
                !navigator.geolocation
            ) {

                alert(
                    "Location is not supported by this browser."
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function (position) {

                    latitude =
                        position.coords.latitude;

                    longitude =
                        position.coords.longitude;


                    console.log(
                        "📍 CURRENT GPS LOCATION"
                    );

                    console.log(
                        "Latitude:",
                        latitude
                    );

                    console.log(
                        "Longitude:",
                        longitude
                    );


                    /*
                     * IMPORTANT:
                     *
                     * User has intentionally chosen
                     * their physical/current location.
                     *
                     * Therefore remove the old
                     * manually selected location flag.
                     */

                    localStorage.removeItem(
                        "manualLocationSelected"
                    );


                    if (
                        typeof google === "undefined" ||
                        !google.maps
                    ) {

                        alert(
                            "Google Maps is not loaded."
                        );

                        return;

                    }


                    const geocoder =
                        new google.maps.Geocoder();


                    const latlng = {

                        lat: Number(latitude),

                        lng: Number(longitude)

                    };


                    geocoder.geocode(

                        {
                            location: latlng
                        },

                        function (
                            results,
                            status
                        ) {

                            if (
                                status !== "OK" ||
                                !results ||
                                !results[0]
                            ) {

                                alert(
                                    "Unable to fetch address."
                                );

                                return;

                            }


                            fillAddressFromComponents(
                                results[0]
                                    .address_components || []
                            );


                            /*
                             * Make sure the modal opens
                             * with the GPS coordinates.
                             */

                            document
                                .getElementById("modal")
                                .style.display =
                                "flex";


                            document.getElementById(
                                "modalTitle"
                            ).textContent =
                                "Add Current Location";

                        }

                    );

                },

                function (error) {

                    console.error(
                        "LOCATION ERROR:",
                        error
                    );


                    alert(
                        "Unable to get your current location. Please allow location access."
                    );

                },

                {

                    enableHighAccuracy: true,

                    timeout: 15000,

                    maximumAge: 0

                }

            );

        }


        /* ==========================================
           GOOGLE ADDRESS COMPONENTS
        ========================================== */

        function fillAddressFromComponents(
            components
        ) {

            let house = "";

            let street = "";

            let area = "";

            let city = "";

            let state = "";

            let pincode = "";


            components.forEach(c => {

                if (
                    c.types.includes(
                        "street_number"
                    )
                ) {

                    house =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "route"
                    )
                ) {

                    street =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "sublocality"
                    ) ||

                    c.types.includes(
                        "sublocality_level_1"
                    ) ||

                    c.types.includes(
                        "sublocality_level_2"
                    ) ||

                    c.types.includes(
                        "neighborhood"
                    )
                ) {

                    area =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "locality"
                    )
                ) {

                    city =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "administrative_area_level_1"
                    )
                ) {

                    state =
                        c.long_name;

                }


                if (
                    c.types.includes(
                        "postal_code"
                    )
                ) {

                    pincode =
                        c.long_name;

                }

            });


            document.getElementById(
                "house"
            ).value = house;


            document.getElementById(
                "street"
            ).value = street;


            document.getElementById(
                "area"
            ).value = area;


            document.getElementById(
                "city"
            ).value = city;


            document.getElementById(
                "state"
            ).value = state;


            document.getElementById(
                "pincode"
            ).value = pincode;

        }
       
        /* ==========================================
   GEOCODE ADDRESS
   ========================================== */

function geocodeAddress(
    house,
    street,
    area,
    city,
    state,
    pincode
) {

    return new Promise((resolve, reject) => {

        if (
            typeof google === "undefined" ||
            !google.maps
        ) {
            reject(
                new Error(
                    "Google Maps is not loaded."
                )
            );

            return;
        }

        const parts = [
            house,
            street,
            area,
            city,
            state,
            pincode,
            "India"
        ]
            .map(v =>
                String(v || "").trim()
            )
            .filter(Boolean);

        const addressText =
            parts.join(", ");

        if (!addressText) {

            reject(
                new Error(
                    "Address is empty."
                )
            );

            return;
        }

        console.log(
            "📍 GEOCODING ADDRESS:",
            addressText
        );

        const geocoder =
            new google.maps.Geocoder();

        geocoder.geocode(
            {
                address: addressText,
                region: "IN"
            },

            function (
                results,
                status
            ) {

                if (
                    status !== "OK" ||
                    !results ||
                    !results[0] ||
                    !results[0].geometry
                ) {

                    console.error(
                        "GEOCODING FAILED:",
                        status,
                        addressText
                    );

                    reject(
                        new Error(
                            "Unable to find this address on the map."
                        )
                    );

                    return;
                }

                const location =
                    results[0].geometry.location;

                const lat =
                    location.lat();

                const lng =
                    location.lng();

                console.log(
                    "✅ GEOCODED COORDINATES"
                );

                console.log(
                    "Latitude:",
                    lat
                );

                console.log(
                    "Longitude:",
                    lng
                );

                resolve({
                    latitude: lat,
                    longitude: lng
                });

            }
        );

    });

}

        /* ==========================================
   SAVE ADDRESS
   ========================================== */

async function saveAddress() {

    if (!customerId) {

        alert(
            "Customer login not found."
        );

        return;

    }

    const house =
        document.getElementById(
            "house"
        ).value.trim();

    const street =
        document.getElementById(
            "street"
        ).value.trim();

    const area =
        document.getElementById(
            "area"
        ).value.trim();

    const city =
        document.getElementById(
            "city"
        ).value.trim();

    const state =
        document.getElementById(
            "state"
        ).value.trim();

    const pincode =
        document.getElementById(
            "pincode"
        ).value.trim();


    if (
        !city ||
        !state ||
        !pincode
    ) {

        alert(
            "Please enter the complete address."
        );

        return;

    }


    /*
     * Check whether we already have
     * valid coordinates.
     */

    let finalLatitude =
        Number(latitude);

    let finalLongitude =
        Number(longitude);


    const coordinatesAreValid =
        Number.isFinite(finalLatitude) &&
        Number.isFinite(finalLongitude) &&
        !(
            finalLatitude === 0 &&
            finalLongitude === 0
        );


    /*
     * If coordinates are missing or 0,0,
     * geocode the complete address.
     */

    if (!coordinatesAreValid) {

        try {

            console.log(
                "⚠️ Coordinates missing."
            );

            console.log(
                "📍 Finding address coordinates..."
            );

            const coordinates =
                await geocodeAddress(
                    house,
                    street,
                    area,
                    city,
                    state,
                    pincode
                );

            finalLatitude =
                coordinates.latitude;

            finalLongitude =
                coordinates.longitude;

        }

        catch (error) {

            console.error(
                "ADDRESS GEOCODING ERROR:",
                error
            );

            alert(
                error.message ||
                "Unable to find the location of this address."
            );

            return;

        }

    }


    /*
     * Keep local variables updated.
     */

    latitude =
        finalLatitude;

    longitude =
        finalLongitude;


    const body = {

        customer_id:
            customerId,

        title:
            document.getElementById(
                "title"
            ).value,

        house,

        street,

        area,

        city,

        state,

        pincode,

        latitude:
            finalLatitude,

        longitude:
            finalLongitude

    };


    console.log(
        "=================================="
    );

    console.log(
        "💾 SAVING ADDRESS"
    );

    console.log(
        "Address:",
        body
    );

    console.log(
        "Latitude:",
        finalLatitude
    );

    console.log(
        "Longitude:",
        finalLongitude
    );

    console.log(
        "=================================="
    );


    let url =
        `${API}/address/add`;

    let method =
        "POST";


    if (editId) {

        url =
            `${API}/address/update/${editId}`;

        method =
            "PUT";

    }


    try {

        const response =
            await fetch(

                url,

                {

                    method,

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(body)

                }

            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to save address"
            );

        }


        document
            .getElementById(
                "modal"
            )
            .style.display =
            "none";


        latitude = "";
        longitude = "";


        await loadAddresses();


    }

    catch (error) {

        console.error(
            "SAVE ADDRESS ERROR:",
            error
        );

        alert(
            error.message ||
            "Unable to save address."
        );

    }

}

        /* ==========================================
           DELETE ADDRESS
        ========================================== */

        async function deleteAddress(id) {

            if (
                !confirm(
                    "Delete Address?"
                )
            ) {

                return;

            }


            try {

                const response =
                    await fetch(

                        `${API}/address/${id}`,

                        {
                            method: "DELETE"
                        }

                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to delete address"
                    );

                }


                /*
                 * If the deleted address was the
                 * currently selected manual address,
                 * remove the location data so the
                 * next page does not use stale data.
                 */

                const currentSelected =
                    localStorage.getItem(
                        "selectedAddress"
                    );


                const deletedAddress =
                    allAddresses.find(
                        a => String(a.id) === String(id)
                    );


                if (
                    deletedAddress &&
                    currentSelected
                ) {

                    const deletedFullAddress =
                        [

                            deletedAddress.house,

                            deletedAddress.street,

                            deletedAddress.area,

                            deletedAddress.city,

                            deletedAddress.state

                        ]
                        .map(v =>
                            String(v || "").trim()
                        )
                        .filter(Boolean)
                        .join(", ");


                    if (
                        currentSelected.includes(
                            deletedFullAddress
                        )
                    ) {

                        localStorage.removeItem(
                            "locationName"
                        );

                        localStorage.removeItem(
                            "selectedAddress"
                        );

                        localStorage.removeItem(
                            "latitude"
                        );

                        localStorage.removeItem(
                            "longitude"
                        );

                        localStorage.removeItem(
                            "manualLocationSelected"
                        );

                    }

                }


                await loadAddresses();

            }

            catch (error) {

                console.error(
                    "DELETE ADDRESS ERROR:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to delete address."
                );

            }

        }


        /* ==========================================
           SET DEFAULT
        ========================================== */

        async function setDefault(id) {

            try {

                const response =
                    await fetch(

                        `${API}/address/default/${id}`,

                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    customer_id:
                                        customerId

                                })

                        }

                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.message ||
                        "Unable to set default address"
                    );

                }


                /*
                 * Important:
                 *
                 * "Make Default" should also make
                 * this address the active delivery
                 * location.
                 */

                const address =
                    allAddresses.find(
                        a =>
                            String(a.id) ===
                            String(id)
                    );


                if (address) {

                    activateAddress(
                        address
                    );

                }


                await loadAddresses();

            }

            catch (error) {

                console.error(
                    "DEFAULT ADDRESS ERROR:",
                    error
                );


                alert(
                    error.message ||
                    "Unable to set default address."
                );

            }

        }


        /* ==========================================
           ACTIVATE SAVED ADDRESS
           
           THIS IS THE IMPORTANT FUNCTION.
           
           It makes the selected saved address
           the real active delivery location,
           regardless of the phone's physical GPS.
        ========================================== */

        function activateAddress(a) {

            const house =
                String(a.house || "").trim();

            const street =
                String(a.street || "").trim();

            const area =
                String(a.area || "").trim();

            const city =
                String(a.city || "").trim();

            const state =
                String(a.state || "").trim();

            const pincode =
                String(a.pincode || "").trim();


            /* ===============================
               LOCATION NAME
            =============================== */

            let locationName = "";


            if (
                area &&
                city
            ) {

                locationName =
                    `${area}, ${city}`;

            }

            else if (city) {

                locationName =
                    city;

            }

            else {

                locationName =
                    area;

            }


            /* ===============================
               FULL ADDRESS
            =============================== */

            const addressParts = [

                house,

                street,

                area,

                city,

                state

            ]
            .filter(Boolean);


            let fullAddress =
                addressParts.join(", ");


            if (pincode) {

                fullAddress +=
                    ` - ${pincode}`;

            }


            /* ===============================
               SAVE LOCATION NAME
            =============================== */

            localStorage.setItem(
                "locationName",
                locationName
            );


            /* ===============================
               SAVE FULL ADDRESS
            =============================== */

            localStorage.setItem(
                "selectedAddress",
                fullAddress
            );


            /*
             * THIS IS THE KEY.
             *
             * It tells index.html:
             *
             * "The customer intentionally selected
             * a saved address. Do NOT replace it
             * with the phone's physical GPS."
             */

            localStorage.setItem(
                "manualLocationSelected",
                "true"
            );


            /* ===============================
               SAVE SELECTED ADDRESS ID
            =============================== */

            if (
                a.id !== null &&
                a.id !== undefined
            ) {

                localStorage.setItem(
                    "selectedAddressId",
                    String(a.id)
                );

            }


            /* ===============================
               SAVE GPS OF SAVED ADDRESS
            =============================== */

            if (
                a.latitude !== "" &&
                a.latitude !== null &&
                a.latitude !== undefined
            ) {

                localStorage.setItem(
                    "latitude",
                    String(a.latitude)
                );

            }


            if (
                a.longitude !== "" &&
                a.longitude !== null &&
                a.longitude !== undefined
            ) {

                localStorage.setItem(
                    "longitude",
                    String(a.longitude)
                );

            }


            console.log(
                "=================================="
            );

            console.log(
                "✅ SAVED ADDRESS ACTIVATED"
            );

            console.log(
                "Location:",
                locationName
            );

            console.log(
                "Address:",
                fullAddress
            );

            console.log(
                "Latitude:",
                a.latitude
            );

            console.log(
                "Longitude:",
                a.longitude
            );

            console.log(
                "manualLocationSelected:",
                localStorage.getItem(
                    "manualLocationSelected"
                )
            );

            console.log(
                "=================================="
            );

        }


        /* ==========================================
           DELIVER HERE
           
           IMPORTANT:
           This is the ONLY deliverHere()
           function in this file.
        ========================================== */
        /* ==========================================
   DELIVER HERE
   ========================================== */

async function deliverHere(

    event,

    house,
    street,
    area,
    city,
    state,
    pincode,

    lat,
    lng

) {

    event.stopPropagation();


    /*
     * Convert coordinates to numbers.
     */

    let finalLatitude =
        Number(lat);

    let finalLongitude =
        Number(lng);


    /*
     * Check whether saved coordinates
     * are actually valid.
     *
     * 0,0 is NOT a valid customer
     * delivery location.
     */

    const coordinatesAreValid =
        Number.isFinite(finalLatitude) &&
        Number.isFinite(finalLongitude) &&
        !(
            finalLatitude === 0 &&
            finalLongitude === 0
        );


    /*
     * If old database address has 0,0,
     * automatically find its coordinates.
     */

    if (!coordinatesAreValid) {

        try {

            console.log(
                "⚠️ Saved address has invalid coordinates."
            );

            console.log(
                "📍 Finding real coordinates..."
            );

            const coordinates =
                await geocodeAddress(

                    house,
                    street,
                    area,
                    city,
                    state,
                    pincode

                );


            finalLatitude =
                coordinates.latitude;

            finalLongitude =
                coordinates.longitude;


            console.log(
                "✅ REAL ADDRESS COORDINATES FOUND"
            );

            console.log(
                "Latitude:",
                finalLatitude
            );

            console.log(
                "Longitude:",
                finalLongitude
            );


        }

        catch (error) {

            console.error(
                "DELIVERY GEOCODING ERROR:",
                error
            );

            alert(
                error.message ||
                "Unable to find the location of this address."
            );

            return;

        }

    }


    /*
     * Build address object.
     */

    const address = {

        house,

        street,

        area,

        city,

        state,

        pincode,

        latitude:
            finalLatitude,

        longitude:
            finalLongitude

    };


    /*
     * Activate address.
     */

    activateAddress(
        address
    );


    /*
     * IMPORTANT:
     *
     * Save the newly discovered coordinates
     * into localStorage.
     */

    localStorage.setItem(
        "latitude",
        String(finalLatitude)
    );

    localStorage.setItem(
        "longitude",
        String(finalLongitude)
    );


    localStorage.setItem(
        "manualLocationSelected",
        "true"
    );


    console.log(
        "=================================="
    );

    console.log(
        "✅ DELIVERY ADDRESS SELECTED"
    );

    console.log(
        "Location:",
        localStorage.getItem(
            "locationName"
        )
    );

    console.log(
        "Address:",
        localStorage.getItem(
            "selectedAddress"
        )
    );

    console.log(
        "Latitude:",
        localStorage.getItem(
            "latitude"
        )
    );

    console.log(
        "Longitude:",
        localStorage.getItem(
            "longitude"
        )
    );

    console.log(
        "Manual:",
        localStorage.getItem(
            "manualLocationSelected"
        )
    );

    console.log(
        "=================================="
    );


    /*
     * Return page.
     */

    const returnPage =
        localStorage.getItem(
            "addressReturnPage"
        );


    localStorage.removeItem(
        "addressReturnPage"
    );


    if (returnPage) {

        window.location.href =
            returnPage;

    }

    else {

        window.location.href =
            "index.html";

    }

}


        /* ==========================================
           SHOW MENU
        ========================================== */

        function showMenu(

            event,

            id,

            title,

            house,

            street,

            area,

            city,

            state,

            pincode,

            lat,

            lng

        ) {

            event.stopPropagation();


            selectedAddress = {

                id,

                title,

                house,

                street,

                area,

                city,

                state,

                pincode,

                lat,

                lng

            };


            const popup =
                document.getElementById(
                    "menuPopup"
                );


            popup.style.display =
                "block";


            let left =
                event.clientX - 160;


            let top =
                event.clientY;


            /* Keep popup inside screen */

            if (
                left < 10
            ) {

                left = 10;

            }


            if (
                left + 180 >
                window.innerWidth
            ) {

                left =
                    window.innerWidth - 190;

            }


            if (
                top + 150 >
                window.innerHeight
            ) {

                top =
                    window.innerHeight - 160;

            }


            popup.style.left =
                `${left}px`;


            popup.style.top =
                `${top}px`;

        }

        function editSelected() {

        /* ==========================================

        ========================================== */

            "click",
            function () {

                document
                    .getElementById(
                        "menuPopup"
                    )
                    .style.display =
                    "none";

            }
        );


        /* ==========================================
           GOOGLE PLACES AUTOCOMPLETE
        ========================================== */

        window.addEventListener(
            "load",
            function () {

                const input =
                    document.getElementById(
                        "searchAddress"
                    );


                if (
                    typeof google === "undefined" ||
                    !google.maps ||
                    !google.maps.places
                ) {

                    console.warn(
                        "Google Places API unavailable."
                    );

                    return;

                }


                autocomplete =
                    new google.maps.places.Autocomplete(

                        input,

                        {

                            componentRestrictions: {
                                country: "in"
                            },

                            fields: [

                                "formatted_address",

                                "geometry",

                                "address_components"

                            ]

                        }

                    );


                autocomplete.addListener(
                    "place_changed",
                    fillAddress
                );

            }
        );


        /* ==========================================
           FILL ADDRESS FROM SEARCH
        ========================================== */
         
    function fillAddress() {

    const place = autocomplete.getPlace();

    if (!place || !place.geometry) {
        return;
    }

    /*
     * IMPORTANT:
     *
     * Google Places has already given us the
     * exact coordinates of the selected address.
     *
     * Store them BEFORE filling/opening the form.
     */

    latitude =
        place.geometry.location.lat();

    longitude =
        place.geometry.location.lng();

    console.log("📍 GOOGLE PLACE SELECTED");
    console.log("Latitude:", latitude);
    console.log("Longitude:", longitude);

    /*
     * Fill address fields.
     */

    fillAddressFromComponents(
        place.address_components || []
    );

    /*
     * IMPORTANT:
     *
     * Do NOT call openModal() here because
     * openModal() calls clearForm(), which would
     * erase latitude and longitude.
     */

    editId = null;

    document.getElementById(
        "modal"
    ).style.display = "flex";

    document.getElementById(
        "modalTitle"
    ).textContent = "Add Address";

    /*
     * Clear only the search box.
     */

    document.getElementById(
        "searchAddress"
    ).value = "";

}

        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHtml(value) {

            return String(value || "")

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }
