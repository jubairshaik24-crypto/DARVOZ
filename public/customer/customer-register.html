<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>DARVOZ | Create Account</title>

    <!-- GOOGLE FONT -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #fff7f2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================
           PAGE
        ========================================= */

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100dvh;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }


        /* =========================================
           ORANGE HEADER
        ========================================= */

        .top-section {

            height: 235px;

            background:
                linear-gradient(
                    135deg,
                    #ff7900,
                    #ff5700
                );

            color: white;

            position: relative;

            overflow: hidden;

            padding: 20px 22px;
        }


        .top-section::before {

            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.09);

            right: -100px;
            top: -120px;
        }


        .top-section::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            border:
                24px solid
                rgba(255,255,255,0.07);

            left: -100px;
            bottom: -120px;
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-btn {

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.18);

            color: white;

            font-size: 18px;

            cursor: pointer;

            position: relative;

            z-index: 3;
        }


        /* =========================================
           CENTER BRAND
        ========================================= */

        .brand {

            position: absolute;

            left: 0;
            right: 0;

            top: 90px;

            text-align: center;

            z-index: 3;
        }


        .brand h1 {

            font-size: 32px;

            font-weight: 700;

            letter-spacing: 2px;
        }


        .brand p {

            margin-top: 4px;

            font-size: 13px;

            opacity: 0.92;

            letter-spacing: 0.2px;
        }


        /* =========================================
           REGISTER CARD
        ========================================= */

        .register-card {

            background: white;

            border-radius:
                30px 30px 0 0;

            margin-top: -28px;

            min-height:
                calc(100dvh - 207px);

            padding:
                28px 22px 30px;

            position: relative;

            z-index: 5;
        }


        .register-card h2 {

            font-size: 22px;

            font-weight: 600;

            color: #202020;

            margin-bottom: 4px;
        }


        .subtitle {

            color: #888;

            font-size: 11px;

            margin-bottom: 20px;
        }


        /* =========================================
           INPUT GROUP
        ========================================= */

        .input-group {

            margin-bottom: 15px;
        }


        .input-group label,
        .gender-label,
        .referral-title {

            display: block;

            font-size: 11px;

            font-weight: 600;

            color: #555;

            margin-bottom: 7px;
        }


        .required {

            color: #ff3b30;
        }


        .optional {

            color: #999;

            font-weight: 400;
        }


        /* =========================================
           INPUT BOX
        ========================================= */

        .input-box {

            height: 51px;

            border:
                1px solid #e4e4e4;

            border-radius: 13px;

            display: flex;

            align-items: center;

            padding: 0 14px;

            background: white;

            transition: 0.2s;
        }


        .input-box:focus-within {

            border-color: #ff6b00;

            box-shadow:
                0 0 0 3px
                rgba(255,107,0,0.07);
        }


        .input-box i {

            width: 29px;

            color: #ff6b00;

            font-size: 16px;
        }


        .input-box input {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-size: 13px;

            color: #333;
        }


        .input-box input::placeholder {

            color: #aaa;
        }


        /* =========================================
           VERIFIED MOBILE
        ========================================= */

        .verified-mobile {

            background:
                #fff9f5;

            border:
                1px solid #ffd9c0;

            position: relative;
        }


        .verified-mobile input {

            color: #333;

            font-weight: 500;
        }


        .verified-badge {

            display: flex;

            align-items: center;

            gap: 4px;

            color: #20a45a;

            font-size: 10px;

            font-weight: 600;

            white-space: nowrap;
        }


        .verified-badge i {

            color: #20a45a;

            width: auto;

            font-size: 12px;
        }


        /* =========================================
           GENDER
        ========================================= */

        .gender-options {

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 8px;
        }


        .gender-btn {

            height: 48px;

            border:
                1px solid #e4e4e4;

            border-radius: 13px;

            background: white;

            color: #444;

            font-size: 11px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .gender-btn i {

            margin-right: 4px;
        }


        .gender-btn.active {

            border-color:
                #ff6b00;

            background:
                #fff5ee;

            color:
                #ff6b00;
        }


        /* =========================================
           REFERRAL
        ========================================= */

        .referral-input {

            background: #fafafa;
        }


        .referral-input.readonly {

            background:
                #fff8f3;

            border-color:
                #ffd9c0;
        }


        /* =========================================
           COIN PROGRESS
        ========================================= */

        .coin-progress {

            margin-top: 20px;

            margin-bottom: 18px;

            padding:
                15px 10px 13px;

            border-radius: 16px;

            background:
                linear-gradient(
                    180deg,
                    #fffaf7,
                    #fff6f0
                );
        }


        /* =========================================
           PROGRESS LINE
        ========================================= */

        .progress-wrap {

            position: relative;

            height: 34px;

            margin:
                0 10px;
        }


        .progress-track {

            position: absolute;

            left: 0;
            right: 0;

            top: 14px;

            height: 4px;

            border-radius: 10px;

            background:
                #dedede;

            overflow: hidden;
        }


        .progress-fill {

            position: absolute;

            left: 0;

            top: 0;

            height: 100%;

            width: 0%;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ff8a00,
                    #ff5500
                );

            transition:
                width 0.45s ease;
        }


        .progress-points {

            position: absolute;

            left: 0;
            right: 0;

            top: 9px;

            display: flex;

            justify-content:
                space-between;
        }


        .progress-point {

            width: 13px;
            height: 13px;

            border-radius: 50%;

            background: white;

            border:
                2px solid #cfcfcf;

            transition: 0.3s;

            position: relative;
        }


        .progress-point.active {

            background:
                #ff6b00;

            border-color:
                #ff6b00;

            box-shadow:
                0 0 0 3px
                rgba(255,107,0,0.12);
        }


        /* =========================================
           COIN MILESTONES
        ========================================= */

        .coin-milestones {

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            text-align: center;

            margin-top: 3px;
        }


        .milestone strong {

            display: block;

            font-size: 12px;

            color:
                #ff6b00;

            font-weight: 600;
        }


        .milestone span {

            display: block;

            margin-top: 2px;

            font-size: 9px;

            color: #888;
        }


        .coin-total {

            text-align: center;

            margin-top: 10px;

            padding-top: 9px;

            border-top:
                1px solid #ffe3d2;
        }


        .coin-total strong {

            font-size: 15px;

            color: #222;

            font-weight: 600;
        }


        .coin-total span {

            display: block;

            font-size: 9px;

            color: #888;

            margin-top: 1px;
        }


        /* =========================================
           TERMS
        ========================================= */

        .terms {

            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin-bottom: 18px;
        }


        .terms input {

            width: 15px;
            height: 15px;

            margin-top: 2px;

            accent-color:
                #ff6b00;

            flex-shrink: 0;
        }


        .terms label {

            font-size: 10px;

            line-height: 1.5;

            color: #777;
        }


        .terms a {

            color:
                #ff6b00;

            text-decoration: none;

            font-weight: 600;
        }


        /* =========================================
           REGISTER BUTTON
        ========================================= */

        .register-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #ff7900,
                    #ff5700
                );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(255,107,0,0.22);

            transition: 0.2s;
        }


        .register-btn:active {

            transform:
                scale(0.98);
        }


        .register-btn:disabled {

            opacity: 0.7;

            cursor:
                not-allowed;
        }


        /* =========================================
           LOGIN
        ========================================= */

        .bottom {

            text-align: center;

            margin-top: 16px;

            font-size: 10px;

            color: #888;
        }


        .bottom a {

            color:
                #ff6b00;

            text-decoration: none;

            font-weight: 600;

            margin-left: 3px;
        }


        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 500px) {

            body {
                padding: 20px;
            }

            .page {

                min-height: 780px;

                border-radius: 25px;

                box-shadow:
                    0 10px 40px
                    rgba(0,0,0,0.12);

                overflow-y: auto;
            }
        }

    </style>

</head>


<body>


<div class="page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="top-section">


        <button
            class="back-btn"
            onclick="goBack()"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <!-- CENTER BRAND -->

        <div class="brand">

            <h1>DARVOZ</h1>

            <p>One App. Every Need.</p>

        </div>


    </div>



    <!-- =========================================
         REGISTRATION
    ========================================== -->

    <div class="register-card">


        <h2>
            Create your account 🎁
        </h2>


        <p class="subtitle">
            Complete your profile and unlock 500 DARVOZ Coins
        </p>



        <!-- =====================================
             MOBILE - ALREADY VERIFIED
        ====================================== -->

        <div class="input-group">

            <label>
                Mobile Number
                <span class="required">*</span>
            </label>


            <div class="input-box verified-mobile">

                <i class="fa-solid fa-mobile-screen-button"></i>


                <input
                    type="tel"
                    id="mobile"
                    readonly
                    placeholder="Verified mobile number"
                >


                <div class="verified-badge">

                    <i class="fa-solid fa-circle-check"></i>

                    Verified

                </div>

            </div>

        </div>



        <!-- =====================================
             NAME - 200
        ====================================== -->

        <div class="input-group">

            <label>

                Full Name

                <span class="required">*</span>

            </label>


            <div class="input-box">

                <i class="fa-regular fa-user"></i>


                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                >

            </div>

        </div>



        <!-- =====================================
             EMAIL - 200
        ====================================== -->

        <div class="input-group">

            <label>

                Email Address

                <span class="required">*</span>

            </label>


            <div class="input-box">

                <i class="fa-regular fa-envelope"></i>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                >

            </div>

        </div>



        <!-- =====================================
             GENDER - 100
        ====================================== -->

        <div class="input-group">

            <span class="gender-label">

                Gender

                <span class="required">*</span>

            </span>


            <div class="gender-options">


                <button
                    type="button"
                    class="gender-btn"
                    data-gender="Male"
                    onclick="selectGender(this)"
                >

                    <i class="fa-solid fa-person"></i>

                    Male

                </button>


                <button
                    type="button"
                    class="gender-btn"
                    data-gender="Female"
                    onclick="selectGender(this)"
                >

                    <i class="fa-solid fa-person-dress"></i>

                    Female

                </button>


                <button
                    type="button"
                    class="gender-btn"
                    data-gender="Other"
                    onclick="selectGender(this)"
                >

                    <i class="fa-solid fa-user"></i>

                    Other

                </button>


            </div>

        </div>



        <!-- =====================================
             REFERRAL
        ====================================== -->

        <div class="input-group">

            <div class="referral-title">

                Referral Code

                <span class="optional">
                    (Optional)
                </span>

            </div>


            <div
                class="input-box referral-input"
                id="referralBox"
            >

                <i class="fa-solid fa-gift"></i>


                <input
                    type="text"
                    id="referralCode"
                    placeholder="Enter referral code"
                    autocomplete="off"
                >

            </div>

        </div>



        <!-- =====================================
             COIN PROGRESS
        ====================================== -->

        <div class="coin-progress">


            <div class="progress-wrap">


                <div class="progress-track">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>


                <div class="progress-points">


                    <span
                        class="progress-point active"
                        id="point1"
                    ></span>


                    <span
                        class="progress-point"
                        id="point2"
                    ></span>


                    <span
                        class="progress-point"
                        id="point3"
                    ></span>


                </div>

            </div>



            <div class="coin-milestones">


                <div class="milestone">

                    <strong>
                        100 Coins
                    </strong>

                    <span>
                        Mobile Verified
                    </span>

                </div>


                <div class="milestone">

                    <strong>
                        200 Coins
                    </strong>

                    <span>
                        Profile Details
                    </span>

                </div>


                <div class="milestone">

                    <strong>
                        200 Coins
                    </strong>

                    <span>
                        Email & Gender
                    </span>

                </div>


            </div>



            <div class="coin-total">

                <strong id="coinTotal">
                    100 / 500 Coins
                </strong>

                <span id="coinMessage">
                    Mobile verified ✓
                </span>

            </div>


        </div>



        <!-- =====================================
             TERMS
        ====================================== -->

        <div class="terms">


            <input
                type="checkbox"
                id="terms"
            >


            <label for="terms">

                I agree to the

                <a href="terms.html">
                    Terms & Conditions
                </a>

                and

                <a href="privacy.html">
                    Privacy Policy
                </a>

            </label>


        </div>



        <!-- =====================================
             CREATE ACCOUNT
        ====================================== -->

        <button
            class="register-btn"
            id="registerBtn"
            onclick="register()"
        >

            Create Account

            <i
                class="fa-solid fa-arrow-right"
                style="margin-left:7px"
            ></i>

        </button>



        <div class="bottom">

            Already have an account?

            <a href="customer-login.html">
                Login
            </a>

        </div>


    </div>


</div>



<script>


/* =========================================
   API
========================================= */

const API =
    window.location.origin;


/* =========================================
   GLOBAL
========================================= */

let selectedGender = "";

let verifiedMobile = "";


/* =========================================
   GET VERIFIED MOBILE
========================================= */

function getVerifiedMobile() {

    return (

        localStorage.getItem("registerMobile") ||

        localStorage.getItem("otpMobile") ||

        ""

    ).trim();

}


/* =========================================
   CLEAN MOBILE
========================================= */

function cleanMobileNumber(value) {

    let mobile =
        String(value || "")
            .replace(/\D/g, "");


    if (
        mobile.startsWith("91") &&
        mobile.length === 12
    ) {

        mobile =
            mobile.substring(2);

    }


    return mobile;

}


/* =========================================
   GET REFERRAL
========================================= */

function getReferralCode() {


    const params =
        new URLSearchParams(
            window.location.search
        );


    const urlCode =

        params.get("ref") ||

        params.get("referral") ||

        params.get("referralCode");


    if (
        urlCode &&
        urlCode.trim()
    ) {

        const code =
            urlCode
                .trim()
                .toUpperCase();


        localStorage.setItem(
            "darvozReferralCode",
            code
        );


        return code;

    }


    const savedCode =

        localStorage.getItem(
            "darvozReferralCode"
        ) ||

        localStorage.getItem(
            "referralCode"
        ) ||

        localStorage.getItem(
            "pendingReferralCode"
        );


    if (
        savedCode &&
        savedCode.trim()
    ) {

        return savedCode
            .trim()
            .toUpperCase();

    }


    return "";

}


/* =========================================
   PAGE LOAD
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* MOBILE */

        verifiedMobile =
            getVerifiedMobile();


        if (!verifiedMobile) {

            alert(
                "Please verify your mobile number first."
            );


            window.location.href =
                "customer-login.html";


            return;

        }


        const mobile =
            cleanMobileNumber(
                verifiedMobile
            );


        document
            .getElementById("mobile")
            .value =
            "+91 " + mobile;


        /* REFERRAL */

        const referral =
            getReferralCode();


        if (referral) {

            const input =
                document.getElementById(
                    "referralCode"
                );


            input.value =
                referral;


            input.readOnly = true;


            document
                .getElementById(
                    "referralBox"
                )
                .classList.add(
                    "readonly"
                );

        }


        updateCoinProgress();

    }
);


/* =========================================
   GENDER
========================================= */

function selectGender(button) {


    document
        .querySelectorAll(
            ".gender-btn"
        )
        .forEach(
            function (btn) {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    selectedGender =
        button.dataset.gender;


    updateCoinProgress();

}


/* =========================================
   EMAIL VALIDATION
========================================= */

function isValidEmail(email) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(email);

}


/* =========================================
   COINS

   MOBILE
   100

   NAME + GENDER
   200

   EMAIL
   200

   TOTAL
   500
========================================= */

function getCompletedCoins() {


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    let coins = 0;


    /* MOBILE VERIFIED */

    if (verifiedMobile) {

        coins += 100;

    }


    /* PROFILE DETAILS */

    if (
        name.length >= 2 &&
        selectedGender
    ) {

        coins += 200;

    }


    /* EMAIL */

    if (
        isValidEmail(email)
    ) {

        coins += 200;

    }


    return Math.min(
        coins,
        500
    );

}


/* =========================================
   UPDATE PROGRESS
========================================= */

function updateCoinProgress() {


    const coins =
        getCompletedCoins();


    const percentage =
        (coins / 500) * 100;


    document
        .getElementById(
            "progressFill"
        )
        .style.width =
        percentage + "%";


    /* POINT 1 */

    document
        .getElementById("point1")
        .classList.toggle(
            "active",
            coins >= 100
        );


    /* POINT 2 */

    document
        .getElementById("point2")
        .classList.toggle(
            "active",
            coins >= 300
        );


    /* POINT 3 */

    document
        .getElementById("point3")
        .classList.toggle(
            "active",
            coins >= 500
        );


    /* TOTAL */

    document
        .getElementById(
            "coinTotal"
        )
        .textContent =
        coins +
        " / 500 Coins";


    const message =
        document.getElementById(
            "coinMessage"
        );


    if (coins === 100) {

        message.textContent =
            "Mobile verified ✓";

    }
    else if (coins === 300) {

        message.textContent =
            "Profile details completed 🎉";

    }
    else if (coins === 500) {

        message.textContent =
            "Profile complete! 🎉";

    }

}


/* =========================================
   BLUR EVENTS
========================================= */

document
    .getElementById("name")
    .addEventListener(
        "blur",
        updateCoinProgress
    );


document
    .getElementById("email")
    .addEventListener(
        "blur",
        updateCoinProgress
    );


/* =========================================
   REGISTER
========================================= */

async function register() {


    const button =
        document.getElementById(
            "registerBtn"
        );


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const referralCode =
        document
            .getElementById(
                "referralCode"
            )
            .value
            .trim()
            .toUpperCase();


    /* =====================================
       VALIDATION
    ===================================== */


    if (!verifiedMobile) {

        alert(
            "Mobile verification is missing. Please verify again."
        );

        return;

    }


    const mobile =
        cleanMobileNumber(
            verifiedMobile
        );


    if (
        !/^[0-9]{10}$/.test(
            mobile
        )
    ) {

        alert(
            "Please verify your mobile number again."
        );

        return;

    }


    if (!name) {

        alert(
            "Please enter your full name."
        );

        return;

    }


    if (
        name.length < 2
    ) {

        alert(
            "Please enter a valid name."
        );

        return;

    }


    if (!email) {

        alert(
            "Please enter your email address."
        );

        return;

    }


    if (
        !isValidEmail(email)
    ) {

        alert(
            "Please enter a valid email address."
        );

        return;

    }


    if (!selectedGender) {

        alert(
            "Please select your gender."
        );

        return;

    }


    if (
        !document
            .getElementById("terms")
            .checked
    ) {

        alert(
            "Please accept the Terms & Conditions and Privacy Policy."
        );

        return;

    }


    /* =====================================
       LOADING
    ===================================== */

    const originalText =
        button.innerHTML;


    button.disabled =
        true;


    button.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Creating Account...
    `;


    try {


        console.log(
            "REGISTER REQUEST:",
            {
                name,
                mobile,
                email,
                gender:
                    selectedGender,
                referralCode
            }
        );


        /* =================================
           BACKEND
        ================================= */

        const response =
            await fetch(
                `${API}/customer/register`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            name:
                                name,

                            mobile:
                                mobile,

                            email:
                                email,

                            gender:
                                selectedGender,

                            referralCode:
                                referralCode ||
                                null

                        })

                }
            );


        const data =
            await response.json();


        console.log(
            "REGISTER RESPONSE:",
            data
        );


        /* =================================
           FAILED
        ================================= */

        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Registration failed. Please try again."
            );

            return;

        }


        /* =================================
           SAVE CUSTOMER
        ================================= */

        if (data.customer) {


            if (data.customer.id) {

                localStorage.setItem(
                    "customerId",
                    String(
                        data.customer.id
                    )
                );

            }


            localStorage.setItem(
                "customerName",
                data.customer.name ||
                name
            );


            localStorage.setItem(
                "mobile",
                data.customer.mobile ||
                mobile
            );


            localStorage.setItem(
                "customerEmail",
                data.customer.email ||
                email
            );


            if (
                data.customer.gender
            ) {

                localStorage.setItem(
                    "customerGender",
                    data.customer.gender
                );

            }


            if (
                data.customer.coins !==
                undefined
            ) {

                localStorage.setItem(
                    "customerCoins",
                    String(
                        data.customer.coins
                    )
                );

            }


            if (
                data.customer.referralCode
            ) {

                localStorage.setItem(
                    "myReferralCode",
                    data.customer.referralCode
                );

            }

        }


        /* =================================
           LOGIN STATE
        ================================= */

        localStorage.setItem(
            "customerLoggedIn",
            "true"
        );


        localStorage.setItem(
            "customerLoginTime",
            Date.now().toString()
        );


        /* =================================
           REMOVE TEMP DATA
        ================================= */

        localStorage.removeItem(
            "registerMobile"
        );


        localStorage.removeItem(
            "otpMobile"
        );


        localStorage.removeItem(
            "referralCode"
        );


        localStorage.removeItem(
            "pendingReferralCode"
        );


        localStorage.removeItem(
            "darvozReferralCode"
        );


        /* =================================
           SUCCESS
        ================================= */

        alert(
            "Welcome to DARVOZ 🎉\n\n500 DARVOZ Coins added to your account!"
        );


        window.location.href =
            "index.html";


    }
    catch (error) {


        console.error(
            "CUSTOMER REGISTER ERROR:",
            error
        );


        alert(
            "Unable to connect to server. Please try again."
        );


    }
    finally {


        button.disabled =
            false;


        button.innerHTML =
            originalText;

    }

}


/* =========================================
   BACK
========================================= */

function goBack() {


    localStorage.removeItem(
        "registerMobile"
    );


    localStorage.removeItem(
        "otpMobile"
    );


    window.location.href =
        "customer-login.html";

}

</script>


</body>

</html>
