
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#064E46">
<title>Order Confirmed | DARVOZ</title>

<style>
:root {
  --petrol: #064E46;
  --green: #0B8F68;
  --light: #E9F7F1;
  --text: #20332F;
  --muted: #71817C;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: var(--text);
  background: #F5F8F6;
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 26px 22px;
  text-align: center;
  background: #FFFFFF;
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(6, 78, 70, 0.08);
}

.logo {
  margin-bottom: 12px;
  color: var(--petrol);
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 1px;
}

.logo span {
  color: var(--green);
}

.success-image {
  width: 100%;
  max-width: 290px;
  margin: 0 auto 12px;
  animation: successPop 0.7s ease-out both;
}

.success-image img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

h1 {
  color: var(--petrol);
  font-size: 25px;
  line-height: 1.3;
  margin-bottom: 10px;
}

.description {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 22px;
}

.order-card {
  padding: 15px;
  margin-bottom: 20px;
  background: #F7FAF8;
  border: 1px solid #E5EEE9;
  border-radius: 15px;
  text-align: left;
}

.detail {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  font-size: 14px;
}

.detail + .detail {
  border-top: 1px solid #E8EFEB;
}

.detail span {
  color: var(--muted);
}

.detail strong {
  max-width: 60%;
  text-align: right;
  overflow-wrap: anywhere;
}

.status {
  color: var(--green);
}

.btn {
  display: block;
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.btn:active {
  transform: scale(0.98);
}

.primary {
  color: #FFFFFF;
  background: var(--petrol);
  border: 1px solid var(--petrol);
}

.secondary {
  color: var(--petrol);
  background: #FFFFFF;
  border: 1px solid #D8E5DF;
}

.footer {
  margin-top: 20px;
  color: var(--muted);
  font-size: 12px;
}

@keyframes successPop {
  0% {
    opacity: 0;
    transform: scale(0.75);
  }
  70% {
    opacity: 1;
    transform: scale(1.05);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .success-image {
    animation: none;
  }
}


/* DARVOZ: Full mobile-screen fit */
html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

@media (max-width: 480px) {
    html,
    body {
        min-height: 100dvh;
        overflow-x: hidden;
    }

    body {
        box-sizing: border-box;
    }

    body > * {
        box-sizing: border-box;
    }

    /* Main page container */
    .container,
    .page-wrapper,
    .success-container {
        width: 100%;
        max-width: 100%;
        min-height: 100dvh;
        margin: 0;
        border-radius: 0;
        box-sizing: border-box;
    }
}

</style>
<script src="/customer/beautiful-alerts.js"></script>
</head>

<body>
<main class="container">

  <div class="logo"><span>D</span>ARVOZ</div>

  <!-- Order confirmation image -->
  <div class="success-image">
    <img
      src="images/order-success.png"
      alt="Your DARVOZ order has been confirmed"
      onerror="this.style.display='none'"
    >
  </div>

  <h1> Order Placed Successfully!</h1>

  <p class="description">
    Thank you for choosing DARVOZ! 💚
    Your order has been received successfully.
  </p>

  <section class="order-card">
    <div class="detail">
      <span>Order ID</span>
      <strong id="orderId">Loading...</strong>
    </div>

    <div class="detail">
      <span>Payment Method</span>
      <strong id="paymentMethod">Loading...</strong>
    </div>

    <div class="detail">
      <span>Order Status</span>
      <strong class="status">Order Placed</strong>
    </div>
  </section>

  <a href="Track.html" class="btn primary">
    Track My Order
  </a>

  <a href="index.html" class="btn secondary">
    Continue Shopping
  </a>

  <p class="footer">One App. Every Need.</p>

</main>

<script>
(function () {
  function readStorage(keys) {
    for (const key of keys) {
      try {
        const value = localStorage.getItem(key);
        if (value && value.trim()) return value.trim();
      } catch (error) {}
    }
    return null;
  }

  const orderId = readStorage([
    'lastOrderId',
    'customer_lastOrderId'
  ]);

  const paymentMethod = readStorage([
    'customer_lastPaymentMethod',
    'lastPaymentMethod',
    'last_payment_method',
    'paymentMethod'
  ]);

  document.getElementById('orderId').textContent =
    orderId || 'Order confirmed';

  const method = String(paymentMethod || '')
    .trim()
    .toUpperCase();

  let paymentLabel = 'Not available';

  if (['COD', 'CASH ON DELIVERY'].includes(method)) {
    paymentLabel = 'Cash on Delivery';
  } else if (
    ['ONLINE', 'RAZORPAY', 'UPI', 'CARD', 'NETBANKING']
      .includes(method)
  ) {
    paymentLabel = 'Online Payment';
  } else if (paymentMethod) {
    paymentLabel = paymentMethod;
  }

  document.getElementById('paymentMethod').textContent =
    paymentLabel;
})();
</script>


</body>
</html>
