<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Search | DARVOZ</title>

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#fff;
            color:#171717;
            padding-bottom:80px;
            -webkit-tap-highlight-color:transparent;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header{
            position:sticky;
            top:0;
            z-index:100;
            background:#fff;
            padding:12px 14px;
            border-bottom:1px solid #eee;
        }

        .top-row{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .header-title-row{
            margin-bottom:12px;
        }

        .search-page-title{
            flex:1;
            padding-right:40px;
            text-align:center;
            font-size:17px;
            font-weight:700;
        }

        .back-btn{
            width:40px;
            height:40px;
            border:0;
            border-radius:50%;
            background:#f1f2f4;
            font-size:24px;
            line-height:40px;
            cursor:pointer;
            flex:none;
        }

        /* =====================================================
           SEARCH BOX
        ===================================================== */

        .search-box{
            height:46px;
            flex:1;
            display:flex;
            align-items:center;
            background:#f1f2f4;
            border-radius:15px;
            padding:0 12px;
            min-width:0;
        }

        .search-icon{
            font-size:18px;
            color:#697386;
            margin-right:9px;
            flex:none;
        }

        #searchInput{
            flex:1;
            width:100%;
            min-width:0;
            border:0 !important;
            outline:0 !important;
            background:transparent !important;
            font-size:16px;
            color:#171717 !important;
            -webkit-appearance:none;
            appearance:none;
            box-shadow:none !important;
        }

        #searchInput::placeholder{
            color:#777;
            opacity:1;
        }

        #searchInput:focus,
        #searchInput:active{
            border:0 !important;
            outline:0 !important;
            box-shadow:none !important;
            background:transparent !important;
        }

        .clear-btn{
            width:26px;
            height:26px;
            border:0;
            border-radius:50%;
            background:#7b8491;
            color:#fff;
            font-size:16px;
            display:none;
            cursor:pointer;
            flex:none;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .container{
            max-width:700px;
            margin:auto;
            padding:18px 14px 90px;
        }

        /* =====================================================
           CATEGORY / WELCOME
        ===================================================== */

        #categoryView{
            display:block;
        }

        .welcome-area{
            margin:8px 2px 24px;
        }

        .try-search{
            font-size:13px;
            color:#777;
            margin-bottom:4px;
        }

        .search-example{
            font-size:24px;
            font-weight:800;
            margin-bottom:22px;
            min-height:29px;
            transition:opacity .25s ease;
        }

        .welcome-title{
            font-size:15px;
            font-weight:800;
            margin-bottom:6px;
        }

        .welcome-text{
            font-size:13px;
            color:#777;
            margin-bottom:20px;
        }

        .section-title{
            font-size:20px;
            font-weight:800;
            margin:0 2px 14px;
        }

        .category-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px 12px;
        }

        .category{
            display:flex;
            flex-direction:column;
            align-items:center;
            cursor:pointer;
            transition:transform .15s ease;
        }

        .category:active{
            transform:scale(.95);
        }

        .category-image{
            width:85px;
            height:85px;
            border-radius:50%;
            overflow:hidden;
            background:#fff;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .category-image img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }

        .category-name{
            margin-top:8px;
            text-align:center;
            font-size:13px;
            font-weight:600;
            line-height:1.25;
            min-height:32px;
            display:flex;
            align-items:flex-start;
            justify-content:center;
        }

        /* =====================================================
           RESULTS
        ===================================================== */

        #results{
            display:none;
            position:relative;
            width:100%;
            margin:0 auto;
            padding:0 0 28px;
            visibility:visible;
            opacity:1;
        }

        .search-heading{
            font-size:21px;
            font-weight:800;
            margin:4px 2px 16px;
        }

        .tabs{
            display:flex;
            gap:8px;
            overflow-x:auto;
            scrollbar-width:none;
            margin-bottom:20px;
        }

        .tabs::-webkit-scrollbar{
            display:none;
        }

        .tab{
            border:0;
            background:#eef0f3;
            color:#596273;
            padding:10px 17px;
            border-radius:22px;
            font-size:13px;
            font-weight:700;
            white-space:nowrap;
            cursor:pointer;
        }

        .tab.active{
            background:#ff6500;
            color:#fff;
        }

        .tab.grocery-active{
            background:#20b64b;
            color:#fff;
        }

        .section-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin:0 2px 11px;
        }

        .section-title-result{
            font-size:19px;
            font-weight:800;
        }

        .see-all{
            font-size:12px;
            font-weight:700;
            color:#ff6500;
            cursor:pointer;
        }

        /* =====================================================
           RESTAURANT CARD
        ===================================================== */

        .restaurant-card{
            background:#fff;
            border-radius:18px;
            margin-bottom:15px;
            overflow:hidden;
            box-shadow:0 2px 10px rgba(0,0,0,.055);
            border:1px solid #f1f1f1;
        }

        .restaurant-header{
            display:flex;
            align-items:center;
            padding:14px 13px 12px;
            cursor:pointer;
        }

        .restaurant-image{
            width:66px;
            height:66px;
            border-radius:50%;
            object-fit:cover;
            background:#eee;
            flex:none;
        }

        .restaurant-info{
            flex:1;
            margin-left:12px;
            min-width:0;
        }

        .restaurant-name{
            font-size:17px;
            font-weight:800;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .restaurant-category{
            color:#687386;
            font-size:12px;
            margin-top:5px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .restaurant-meta{
            color:#687386;
            font-size:11px;
            margin-top:7px;
        }

        .rating{
            display:inline-flex;
            align-items:center;
            background:#10ad59;
            color:#fff;
            border-radius:7px;
            padding:4px 7px;
            font-size:11px;
            font-weight:800;
            margin-left:6px;
        }

        .open{
            color:#129a4d;
            font-weight:700;
        }

        .closed{
            color:#df3030;
            font-weight:700;
        }

        .arrow{
            font-size:26px;
            color:#8b929c;
            margin-left:7px;
        }

        /* =====================================================
           FOOD LIST
        ===================================================== */

        .food-list{
            border-top:1px solid #eee;
        }

        .food-result-list{
            background:transparent;
        }

        .food-source{
            color:#737b86;
            font-size:12px;
            margin-top:4px;
        }

        .food-item{
            display:flex;
            align-items:center;
            gap:11px;
            padding:13px 4px;
            border-bottom:1px solid #f0f0f0;
            cursor:pointer;
        }

        .food-item:last-child{
            border-bottom:0;
        }

        .food-image{
            width:68px;
            height:68px;
            border-radius:50%;
            object-fit:cover;
            background:#eee;
            flex:none;
        }

        .food-details{
            flex:1;
            min-width:0;
        }

        .restaurant-suggestion{
            display:flex;
            align-items:center;
            gap:12px;
            padding:13px 4px;
            border-bottom:1px solid #f0f0f0;
            cursor:pointer;
        }

        .restaurant-suggestion-image{
            width:68px;
            height:68px;
            flex:none;
            border-radius:16px;
            object-fit:cover;
            background:#f2f2f2;
        }

        .restaurant-suggestion-name{
            font-size:15px;
            font-weight:700;
            line-height:1.35;
        }

        .restaurant-suggestion-meta{
            margin-top:4px;
            color:#737b86;
            font-size:12px;
            line-height:1.4;
        }

        .food-name{
            font-size:15px;
            font-weight:700;
            line-height:1.25;
            margin-bottom:7px;
        }

        .food-price{
            font-size:16px;
            font-weight:800;
        }

        .old-price{
            color:#9aa0a8;
            text-decoration:line-through;
            font-size:12px;
            font-weight:500;
            margin-left:5px;
        }

        .add-food{

            height:36px;
            border:0;
            border-radius:9px;
            background:#ff6500;
            color:#fff;
            font-size:25px;
            cursor:pointer;
            flex:none;
        }

        /* =====================================================
           GROCERY
        ===================================================== */

        .grocery-section{
            margin-top:24px;
        }

        .grocery-card{
            background:#fff;
            border-radius:17px;
            margin-bottom:11px;
            padding:11px;
            display:flex;
            align-items:center;
            gap:12px;
            box-shadow:0 2px 9px rgba(0,0,0,.05);
            border:1px solid #f1f1f1;
        }

        .grocery-image{
            width:92px;
            height:92px;
            border-radius:12px;
            object-fit:cover;
            background:#f2f2f2;
            flex:none;
        }

        .grocery-details{
            flex:1;
            min-width:0;
        }

        .grocery-name{
            font-size:15px;
            font-weight:800;
            line-height:1.25;
            margin-bottom:6px;
        }

        .grocery-size{
            font-size:13px;
            color:#687386;
            margin-bottom:6px;
        }

        .grocery-price{
            font-size:16px;
            font-weight:800;
        }

        .grocery-old{
            color:#9aa0a8;
            text-decoration:line-through;
            font-size:12px;
            margin-left:5px;
        }

        .stock{
            font-size:11px;
            color:#10a652;
            font-weight:700;
            margin-top:5px;
        }

        .add-grocery{
            width:40px;
            height:38px;
            border:0;
            border-radius:9px;
            background:#20b64b;
            color:#fff;
            font-size:25px;
            cursor:pointer;
            flex:none;
        }

        /* =====================================================
           LOADING
        ===================================================== */

        .loading{
            text-align:center;
            padding:60px 20px;
            color:#747b86;
        }

        .spinner{
            width:34px;
            height:34px;
            border:3px solid #ddd;
            border-top-color:#ff6500;
            border-radius:50%;
            animation:spin .75s linear infinite;
            margin:0 auto 14px;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

        /* =====================================================
           EMPTY
        ===================================================== */

        .empty{
            text-align:center;
            min-height:260px;
            margin-top:12px;
            padding:38px 20px;
            color:#777;
            background:#fff;
            border:1px solid #f0f0f0;
            border-radius:18px;
            box-shadow:0 3px 14px rgba(0,0,0,.045);
        }

        .empty-icon{
            font-size:45px;
            margin-bottom:12px;
            color:#ff6500;
        }

        .empty-title{
            font-size:18px;
            font-weight:800;
            color:#222;
            margin-bottom:6px;
        }

        .empty-text{
            font-size:13px;
            line-height:1.5;
        }

        .search-suggestion{
            display:block;
            margin:16px auto 0;
            padding:10px 16px;
            border:1px solid #ff6500;
            border-radius:22px;
            background:#fff7f1;
            color:#e85c00;
            font-size:14px;
            font-weight:700;
            cursor:pointer;
        }

        /* =====================================================
           TOAST
        ===================================================== */

        .toast{
            position:fixed;
            left:50%;
            bottom:25px;
            transform:translateX(-50%);
            background:#222;
            color:#fff;
            padding:12px 18px;
            border-radius:12px;
            font-size:13px;
            display:none;
            z-index:9999;
            max-width:90%;
            text-align:center;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:380px){

            .category-grid{
                gap:18px 8px;
            }

            .category-image{
                width:78px;
                height:78px;
            }

            .food-image{
                width:72px;
                height:72px;
            }

            .grocery-image{
                width:82px;
                height:82px;
            }

        }

        @media(min-width:600px){

            .category-grid{
                grid-template-columns:repeat(4,1fr);
            }

            .container{
                max-width:700px;
            }

        }

    </style>

<script src="/customer/beautiful-alerts.js"></script>

<script>

    /* =====================================================
   API
===================================================== */

const API = window.location.origin;


/* =====================================================
   ELEMENTS
===================================================== */

const searchInput =
    document.getElementById("searchInput");

const clearBtn =
    document.getElementById("clearBtn");

const categoryView =
    document.getElementById("categoryView");

const results =
    document.getElementById("results");

function positionResultsPanel(){
    // Results flow beneath the sticky search header; no fixed overlay positioning.
    results.style.top = "auto";
    results.style.left = "auto";
    results.style.right = "auto";
    results.style.bottom = "auto";
}

window.addEventListener("resize", positionResultsPanel);


/* =====================================================
   SEARCH STATE
===================================================== */

let searchData = {
    restaurants: [],
    restaurantMatches: [],
    foodProducts: [],
    groceries: [],
    query: ""
};

let searchTimer = null;
let searchRequestController = null;


/* =====================================================
   URL QUERY
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const initialKeyword =
    (
        params.get("q") || ""
    ).trim();


/* =====================================================
   INITIALIZE
===================================================== */

if(initialKeyword){

    searchInput.value =
        initialKeyword;

    updateClearButton();

    performSearch(
        initialKeyword
    );

}
else{

    categoryView.style.display =
        "block";

    results.style.display =
        "none";

}


/* =====================================================
   SEARCH INPUT
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        updateClearButton();

        const value =
            searchInput.value.trim();

        clearTimeout(
            searchTimer
        );


        /*
         * EMPTY SEARCH
         */

        if(!value){

            categoryView.style.display =
                "block";

            results.style.display =
                "none";

            history.replaceState(
                {},
                "",
                "search.html"
            );

            return;
        }


        /*
         * WAIT 300ms
         * BEFORE API REQUEST
         */

        searchTimer =
            setTimeout(
                function(){

                    performSearch(value);

                },
                300
            );

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

searchInput.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter"){
            return;
        }

        event.preventDefault();

        const value =
            searchInput.value.trim();

        if(value){

            clearTimeout(
                searchTimer
            );

            performSearch(value);

        }

    }
);


/* =====================================================
   PERFORM SEARCH
===================================================== */

async function performSearch(query){

    query =
        String(query || "").trim();


    /*
     * EMPTY
     */

    if(!query){

        categoryView.style.display =
            "block";

        results.style.display =
            "none";

        return;
    }

    // Cancel an older keystroke search so it cannot overwrite newer results.
    if(searchRequestController){
        searchRequestController.abort();
    }
    searchRequestController = new AbortController();
    const requestSignal = searchRequestController.signal;


    /*
     * SHOW RESULTS AREA
     */

    categoryView.style.display =
        "none";

    results.style.display =
        "block";

    results.style.visibility =
        "visible";

    results.style.opacity =
        "1";

    positionResultsPanel();


    /*
     * LOADING
     */

    results.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Searching for
            "${escapeHtml(query)}"...

        </div>

    `;


    /*
     * SAVE URL
     */

    history.replaceState(
        {},
        "",
        "search.html?q=" +
        encodeURIComponent(query)
    );


    try{

        console.log(
            "DARVOZ SEARCH:",
            query
        );


        /*
         * CALL BACKEND
         */

        const response =
            await fetch(
                `${API}/search?q=${
                    encodeURIComponent(query)
                }`,
                { signal: requestSignal }
            );

        if(requestSignal.aborted){
            return;
        }


        if(!response.ok){

            throw new Error(
                "Search request failed"
            );

        }


        /*
         * JSON
         */

        const data =
            await response.json();

        if(requestSignal.aborted){
            return;
        }


        console.log(
            "DARVOZ SEARCH RESPONSE:",
            data
        );


        if(!data.success){

            throw new Error(
                data.message ||
                "Search failed"
            );

        }


        /*
         * SAVE DATA
         */

        searchData = {

            query:
                data.query ||
                query,

            restaurants:
                Array.isArray(
                    data.restaurants
                )
                    ? data.restaurants
                    : [],

            restaurantMatches:
                Array.isArray(data.restaurantMatches)
                    ? data.restaurantMatches
                    : [],

            foodProducts:
                Array.isArray(data.foodProducts)
                    ? data.foodProducts
                    : [],

            groceries:
                Array.isArray(
                    data.groceries
                )
                    ? data.groceries
                    : []

        };

        console.info("DARVOZ SEARCH RESULTS RECEIVED", {
            query: searchData.query,
            dishes: searchData.foodProducts.length ||
                searchData.restaurants.reduce((count, restaurant) =>
                    count + (Array.isArray(restaurant.items) ? restaurant.items.length : 0), 0),
            restaurants: searchData.restaurantMatches.length,
            groceries: searchData.groceries.length
        });


        /*
         * RENDER
         */

        renderResults();

    }
    catch(error){

        if(error.name === "AbortError"){
            return;
        }

        console.error(
            "DARVOZ SEARCH ERROR:",
            error
        );


        results.style.display =
            "block";

        results.style.visibility =
            "visible";

        results.style.opacity =
            "1";

        positionResultsPanel();


        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <div class="empty-title">
                    Search failed
                </div>

                <div class="empty-text">
                    Please try again.
                </div>

            </div>

        `;

    }

}


/* =====================================================
   RENDER RESULTS
===================================================== */

function renderResults(){

    const restaurants =
        searchData.restaurants || [];

    const restaurantMatches =
        searchData.restaurantMatches || [];

    const groceries =
        searchData.groceries || [];

    const groupedFoodProducts = restaurants.flatMap(
        function(restaurant){
            return (Array.isArray(restaurant.items) ? restaurant.items : [])
                .map(function(item){
                    return {
                        ...item,
                        restaurant: item.restaurant || {
                            restaurant_id: restaurant.restaurant_id || restaurant.id,
                            restaurant_name: restaurant.restaurant_name || "Restaurant",
                            restaurant_image: restaurant.restaurant_image || "",
                            logo: restaurant.logo || "",
                            city: restaurant.city || "",
                            rating: restaurant.rating ?? null,
                            delivery_time: restaurant.delivery_time ?? null
                        }
                    };
                });
        }
    );

    const foodProducts = searchData.foodProducts.length
        ? searchData.foodProducts
        : groupedFoodProducts;

    // Keep the results panel in document flow and always reveal it after a response.
    results.style.display = "block";
    results.style.visibility = "visible";
    results.style.opacity = "1";
    positionResultsPanel();


    console.log(
        "RENDERING:",
        {
            restaurants,
            restaurantMatches,
            foodProductCount: foodProducts.length,
            groceries
        }
    );


    /*
     * NO RESULTS
     */

    if(
        foodProducts.length === 0 &&
        restaurantMatches.length === 0 &&
        groceries.length === 0
    ){

        const correctedQuery = /briyani|biriyani/i.test(searchData.query)
            ? searchData.query.replace(/briyani|biriyani/ig, "Biryani")
            : "";

        results.style.display =
            "block";

        results.style.visibility =
            "visible";

        results.style.opacity =
            "1";

        positionResultsPanel();


        results.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>

                <div class="empty-title">
                    No results for
                    "${escapeHtml(
                        searchData.query
                    )}"
                </div>

                <div class="empty-text">
                    Try another food or grocery item.
                </div>

                ${correctedQuery ? `
                    <button class="search-suggestion" onclick="performSearch('Biryani')">
                        Search for Biryani
                    </button>
                ` : ""}

            </div>

        `;

        return;
    }


    /*
     * MAIN HTML
     */

    let html = `

        <div class="search-heading">

            Results for
            "${escapeHtml(
                searchData.query
            )}"

        </div>

    `;


    /*
     * MATCHING FOOD PRODUCTS
     */

    if(foodProducts.length > 0){

        html += `

            <section>

                <div class="section-head">

                    <div class="section-title-result">
                        Dishes
                    </div>

                </div>

                <div class="food-result-list">
                    ${foodProducts.map(renderFoodProduct).join("")}
                </div>

            </section>

        `;

    }


    if(restaurantMatches.length > 0){

        html += `
            <section class="grocery-section">
                <div class="section-head">
                    <div class="section-title-result">Restaurants</div>
                </div>
                <div class="food-result-list">
                    ${restaurantMatches.map(renderRestaurantSuggestion).join("")}
                </div>
            </section>
        `;

    }


    /*
     * GROCERY
     */

    if(groceries.length > 0){

        html += `

            <section class="grocery-section">

                <div class="section-head">

                    <div class="section-title-result">
                        Grocery Products
                    </div>

                </div>

                ${groceries.map(
                    function(grocery){

                        return renderGrocery(
                            grocery
                        );

                    }
                ).join("")}

            </section>

        `;

    }


    /*
     * DISPLAY
     */

    results.style.display =
        "block";

    results.style.visibility =
        "visible";

    results.style.opacity =
        "1";

    results.innerHTML =
        html;


    console.log(
        "SEARCH HTML RENDERED",
        results.innerHTML.length
    );

}


function renderFoodProduct(item){

    const restaurant = item.restaurant || {};
    const price = item.offer_price != null ? item.offer_price : item.price;
    const image = item.image || restaurant.restaurant_image || restaurant.logo || "";
    const productName = item.product_name || "Food";
    const productId = Number(item.product_id);
    const restaurantId = Number(restaurant.restaurant_id);
    const oldPrice = item.offer_price != null && item.price != null &&
        Number(item.offer_price) < Number(item.price)
        ? `<span class="old-price">₹${Number(item.price).toFixed(0)}</span>`
        : "";

    return `
        <div class="food-item" role="button" tabindex="0"
            onclick="openRestaurant(${restaurantId}, ${productId})"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openRestaurant(${restaurantId}, ${productId})}">
            ${image ? `<img class="food-image" src="${safeUrl(image)}" alt="${escapeHtml(productName)}" onerror="this.style.display='none'">` : ""}
            <div class="food-details">
                <div class="food-name">${escapeHtml(productName)}</div>
                <div class="food-source">Dish${restaurant.restaurant_name ? ` · ${escapeHtml(restaurant.restaurant_name)}` : ""}</div>
                <div class="food-price">₹${Number(price || 0).toFixed(0)} ${oldPrice}</div>
            </div>
            <button class="add-food" aria-label="View ${escapeHtml(productName)}"
                onclick="event.stopPropagation();openRestaurant(${restaurantId}, ${productId})">›</button>
        </div>
    `;
}


function renderRestaurantSuggestion(restaurant){
    const id = Number(restaurant.restaurant_id);
    const name = restaurant.restaurant_name || "Restaurant";
    const image = restaurant.logo || restaurant.restaurant_image || "";
    const meta = [
        restaurant.rating != null ? `★ ${restaurant.rating}` : "Restaurant",
        restaurant.delivery_time ? `${restaurant.delivery_time} mins` : "",
        restaurant.city || ""
    ].filter(Boolean).join(" · ");

    return `
        <div class="restaurant-suggestion" role="button" tabindex="0"
            onclick="openRestaurant(${id})"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openRestaurant(${id})}">
            ${image ? `<img class="restaurant-suggestion-image" src="${safeUrl(image)}" alt="${escapeHtml(name)}" onerror="this.style.display='none'">` : `<div class="restaurant-suggestion-image"></div>`}
            <div class="food-details">
                <div class="restaurant-suggestion-name">${escapeHtml(name)}</div>
                <div class="restaurant-suggestion-meta">${escapeHtml(meta)}</div>
            </div>
        </div>
    `;
}


/* =====================================================
   RESTAURANT CARD
===================================================== */

function renderRestaurant(
    restaurant
){

    const items =
        Array.isArray(
            restaurant.items
        )
            ? restaurant.items
            : [];


    /*
     * RESTAURANT IMAGE
     */

    const restaurantImage =
        restaurant.restaurant_image ||
        restaurant.logo ||
        "";


    /*
     * RATING
     */

    const rating =
        restaurant.rating != null
            ? `
                <span class="rating">

                    ★ ${
                        escapeHtml(
                            restaurant.rating
                        )
                    }

                </span>
            `
            : "";


    /*
     * OPEN STATUS
     */

    const isOpen =
        restaurant.is_open !== undefined
            ? Number(
                restaurant.is_open
              ) === 1

            : String(
                restaurant.online_status ||
                ""
              ).toLowerCase() === "open";


    const openText =
        isOpen

            ? `
                <span class="open">
                    Open
                </span>
              `

            : `
                <span class="closed">
                    Closed
                </span>
              `;


    /*
     * META
     */

    const meta = [

        restaurant.business_type ||
        "Food",

        restaurant.delivery_time
            ? `${restaurant.delivery_time} min`
            : "",

        openText

    ]
    .filter(Boolean)
    .join(" • ");


    /*
     * FOOD ITEMS
     */

    const itemsHtml =
        items.map(
            function(item){

                const price =
                    item.offer_price != null
                        ? item.offer_price
                        : item.price;


                /*
                 * OLD PRICE
                 */

                const oldPrice =
                    item.offer_price != null &&
                    item.price != null &&
                    Number(
                        item.offer_price
                    ) <
                    Number(
                        item.price
                    )

                    ? `
                        <span class="old-price">

                            ₹${
                                Number(
                                    item.price
                                ).toFixed(0)
                            }

                        </span>
                      `

                    : "";


                /*
                 * IMAGE
                 */

                const image =
                    item.image || "";


                return `

                    <div class="food-item">

                        ${
                            image
                            ? `
                                <img
                                    class="food-image"
                                    src="${safeUrl(image)}"
                                    alt="${escapeHtml(
                                        item.product_name ||
                                        "Food"
                                    )}"
                                    onerror="
                                        this.style.display='none'
                                    "
                                >
                              `
                            : ""
                        }


                        <div class="food-details">

                            <div class="food-name">

                                ${
                                    escapeHtml(
                                        item.product_name ||
                                        "Food"
                                    )
                                }

                            </div>


                            <div class="food-price">

                                ₹${
                                    Number(
                                        price || 0
                                    ).toFixed(0)
                                }

                                ${oldPrice}

                            </div>

                        </div>


                        <button
                            class="add-food"
                            onclick="
                                openRestaurant(
                                    ${Number(
                                        restaurant.restaurant_id
                                    )},
                                    ${Number(
                                        item.product_id
                                    )}
                                )
                            "
                        >
                            +
                        </button>

                    </div>

                `;

            }
        ).join("");


    /*
     * RESTAURANT CARD
     */

    return `

        <article class="restaurant-card">

            <div
                class="restaurant-header"
                onclick="
                    openRestaurant(
                        ${Number(
                            restaurant.restaurant_id
                        )}
                    )
                "
            >

                ${
                    restaurantImage
                    ? `
                        <img
                            class="restaurant-image"
                            src="${safeUrl(
                                restaurantImage
                            )}"
                            alt="${escapeHtml(
                                restaurant.restaurant_name ||
                                "Restaurant"
                            )}"
                            onerror="
                                this.style.display='none'
                            "
                        >
                      `
                    : ""
                }


                <div class="restaurant-info">

                    <div class="restaurant-name">

                        ${
                            escapeHtml(
                                restaurant.restaurant_name ||
                                "Restaurant"
                            )
                        }

                        ${rating}

                    </div>


                    <div class="restaurant-category">

                        ${
                            escapeHtml(
                                restaurant.business_type ||
                                "Food"
                            )
                        }

                    </div>


                    <div class="restaurant-meta">

                        ${meta}

                    </div>

                </div>


                <div class="arrow">
                    ›
                </div>

            </div>


            <div class="food-list">

                ${itemsHtml}

            </div>

        </article>

    `;

}


/* =====================================================
   GROCERY CARD
===================================================== */

function renderGrocery(
    grocery
){

    const price =
        grocery.offer_price != null
            ? grocery.offer_price
            : grocery.price;


    /*
     * OLD PRICE
     */

    const oldPrice =
        grocery.offer_price != null &&
        grocery.price != null &&
        Number(
            grocery.offer_price
        ) <
        Number(
            grocery.price
        )

        ? `
            <span class="grocery-old">

                ₹${
                    Number(
                        grocery.price
                    ).toFixed(0)
                }

            </span>
          `

        : "";


    /*
     * IMAGE
     */

    const image =
        grocery.product_image ||
        "";


    /*
     * STOCK
     */

    const stockText =
        grocery.stock != null
            ? `${Number(
                grocery.stock
              )} available`

            : "In Stock";


    return `

        <article class="grocery-card">

            ${
                image
                ? `
                    <img
                        class="grocery-image"
                        src="${safeUrl(image)}"
                        alt="${escapeHtml(
                            grocery.product_name ||
                            "Product"
                        )}"
                        onerror="
                            this.style.display='none'
                        "
                    >
                  `
                : ""
            }


            <div class="grocery-details">

                <div class="grocery-name">

                    ${
                        escapeHtml(
                            grocery.product_name ||
                            "Product"
                        )
                    }

                </div>


                <div class="grocery-size">

                    ${
                        escapeHtml(
                            grocery.size ||
                            ""
                        )
                    }

                </div>


                <div class="grocery-price">

                    ₹${
                        Number(
                            price || 0
                        ).toFixed(0)
                    }

                    ${oldPrice}

                </div>


                <div class="stock">

                    ${
                        escapeHtml(
                            stockText
                        )
                    }

                </div>

            </div>


            <button
                class="add-grocery"
                onclick="
                    addGrocery(
                        ${Number(
                            grocery.product_id
                        )},
                        ${Number(
                            grocery.variant_id
                        )},
                        '${escapeJs(
                            grocery.product_name
                        )}',
                        '${escapeJs(
                            grocery.size || ""
                        )}'
                    )
                "
            >
                +
            </button>

        </article>

    `;

}

function openCategory(category){

    localStorage.setItem(
        "selectedCategory",
        category
    );

    window.location.href =
        "restaurants.html?category=" +
        encodeURIComponent(category);

}


/* =====================================================
   OPEN RESTAURANT
===================================================== */

function openRestaurant(
    restaurantId,
    productId = null
){

    if(
        !restaurantId ||
        Number.isNaN(
            Number(restaurantId)
        )
    ){

        showToast(
            "Restaurant is unavailable"
        );

        return;
    }


    let url =
        `restaurant.html?id=${
            encodeURIComponent(
                restaurantId
            )
        }`;


    /*
     * If a food item was clicked,
     * also send its product ID.
     */

    if(productId){

        url +=
            `&product=${
                encodeURIComponent(
                    productId
                )
            }`;

    }


    window.location.href =
        url;

}

/* =====================================================
   TOAST
===================================================== */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                toast.style.display =
                    "none";

            },
            2000
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJs(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =====================================================
   IMAGE URL
===================================================== */

function safeUrl(
    value
){

    const url =
        String(
            value || ""
        );


    /*
     * Already a complete URL
     */

    if(
        url.startsWith("http://") ||
        url.startsWith("https://") ||
        url.startsWith("/") ||
        url.startsWith("./")
    ){

        return url;

    }


    /*
     * Relative image path
     */

    return url
        ? "/" + url
        : "";

}
