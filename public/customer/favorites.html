<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>DARVOZ — Favorites</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* =====================================================
   DARVOZ FAVORITES — PREMIUM DEEP OCEAN UI
   UI ONLY — JAVASCRIPT UNTOUCHED
===================================================== */

:root{
    --ocean:#004D5B;
    --ocean-dark:#003542;
    --ocean-deep:#002A34;
    --ocean-light:#E8F5F7;

    --orange:#FF6500;
    --green:#20B64B;
    --red:#E53945;

    --text:#10272C;
    --muted:#718084;

    --bg:#F5FAFA;
    --white:#FFFFFF;
    --border:#E2ECEE;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    /* background:
        linear-gradient(
            180deg,
            #EAF6F7 0,
            #F5FAFA 260px,
            #FFFFFF 100%
        ); */
    color:var(--text);
    padding-bottom:105px;
}

button{
    font-family:'Poppins',sans-serif;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:220px;

    background:
        radial-gradient(
            circle at 8% 10%,
            rgba(255,255,255,.12),
            transparent 25%
        ),

        radial-gradient(
            circle at 92% 12%,
            rgba(255,255,255,.09),
            transparent 25%
        ),

        linear-gradient(
            145deg,
            var(--ocean-deep),
            var(--ocean),
            #006978
        );

    color:#fff;

    border-bottom-left-radius:36px;
    border-bottom-right-radius:36px;

    position:relative;
    overflow:hidden;

    box-shadow:
        0 15px 35px
        rgba(0,77,91,.20);
}


/* decorative ocean circles */

.header::before{
    content:"";

    position:absolute;

    width:390px;
    height:390px;

    left:-220px;
    top:-235px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.10);

    box-shadow:
        0 0 0 35px rgba(255,255,255,.025),
        0 0 0 75px rgba(255,255,255,.018);
}

.header::after{
    content:"";

    position:absolute;

    width:360px;
    height:360px;

    right:-220px;
    bottom:-250px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.10);
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    position:relative;
    z-index:5;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 16px;
}

.back-btn,
.cart-btn{
    width:44px;
    height:44px;

    border:none;
    border-radius:50%;

    background:
        rgba(255,255,255,.12);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;

    border:
        1px solid
        rgba(255,255,255,.15);

    backdrop-filter:blur(10px);

    transition:.2s;
}

.back-btn:active,
.cart-btn:active{
    transform:scale(.92);
}


/* =====================================================
   CART BADGE
===================================================== */

.cart-btn{
    position:relative;
}

.cart-badge{
    position:absolute;

    right:-3px;
    top:-4px;

    min-width:20px;
    height:20px;

    padding:0 5px;

    border-radius:20px;

    background:var(--orange);
    color:#fff;

    display:none;
    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:800;

    border:2px solid var(--ocean);
}


/* =====================================================
   HEADER CONTENT
===================================================== */

.header-content{
    position:relative;
    z-index:5;

    text-align:center;

    padding:15px 20px 0;
}

.header-content h1{
    font-size:31px;
    font-weight:800;

    letter-spacing:-.6px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:9px;
}

.header-content h1 i{
    color:#FF6B6B;
    font-size:27px;

    filter:
        drop-shadow(
            0 4px 8px
            rgba(0,0,0,.15)
        );
}

.header-content p{
    margin-top:6px;

    font-size:11px;

    color:
        rgba(255,255,255,.78);
}


/* =====================================================
   MAIN
===================================================== */

.main{
    width:min(1100px,100%);

    margin:auto;

    padding:
        23px 14px 120px;
}


/* =====================================================
   PAGE HEADING
===================================================== */

.page-heading{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:16px;
}

.page-heading h2{
    font-size:21px;
    font-weight:800;

    color:var(--text);
}

.page-heading span{
    padding:
        6px 11px;

    border-radius:20px;

    background:
        var(--ocean-light);

    color:
        var(--ocean);

    font-size:10px;

    font-weight:800;
}


/* =====================================================
   FAVORITE GRID
===================================================== */

.favorite-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;
}


/* =====================================================
   FOOD CARD
===================================================== */

.food-card{
    background:#fff;

    border:
        1px solid
        var(--border);

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 8px 24px
        rgba(0,55,65,.07);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.food-card:active{
    transform:scale(.985);
}


/* =====================================================
   FOOD IMAGE
===================================================== */

.food-image{
    height:205px;

    background:
        #EAF1F2;

    position:relative;

    overflow:hidden;
}

.food-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .3s ease;
}

.food-card:hover
.food-image img{
    transform:scale(1.04);
}


/* =====================================================
   VEG / NON VEG
===================================================== */

.food-type{
    position:absolute;

    left:10px;
    top:10px;

    width:21px;
    height:21px;

    background:#fff;

    border:
        2px solid
        var(--green);

    border-radius:5px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 3px 8px
        rgba(0,0,0,.10);
}

.food-type::after{
    content:"";

    width:8px;
    height:8px;

    border-radius:50%;

    background:
        var(--green);
}

.food-type.nonveg{
    border-color:
        var(--red);
}

.food-type.nonveg::after{
    background:
        var(--red);
}


/* =====================================================
   REMOVE FAVORITE
===================================================== */

.remove-favorite{
    position:absolute;

    right:10px;
    top:10px;

    width:36px;
    height:36px;

    border:none;

    border-radius:50%;

    background:
        rgba(255,255,255,.96);

    color:
        var(--red);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:16px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.14);

    transition:.2s;
}

.remove-favorite:active{
    transform:scale(.88);
}


/* =====================================================
   FOOD INFO
===================================================== */

.food-info{
    padding:
        12px 12px 13px;
}

.food-name{
    font-size:14px;

    font-weight:800;

    line-height:1.3;

    min-height:37px;

    color:var(--text);
}

.food-description{
    color:
        var(--muted);

    font-size:9.5px;

    line-height:1.45;

    min-height:28px;

    margin-top:3px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}


/* =====================================================
   BOTTOM
===================================================== */

.food-bottom{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    margin-top:10px;
}

.food-price{
    font-size:17px;

    font-weight:800;

    color:
        var(--ocean);
}


/* =====================================================
   ADD BUTTON
===================================================== */

.add-button{
    height:37px;

    border:
        1px solid
        var(--ocean);

    border-radius:12px;

    background:
        var(--ocean);

    color:#fff;

    padding:
        0 14px;

    font-size:10px;

    font-weight:800;

    transition:.2s;
}

.add-button:active{
    transform:scale(.94);
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-control{
    height:37px;

    border:
        1px solid
        var(--ocean);

    border-radius:12px;

    display:flex;

    align-items:center;

    overflow:hidden;

    background:
        var(--ocean);
}

.quantity-control button{
    width:30px;
    height:100%;

    border:none;

    background:
        var(--ocean);

    color:#fff;

    font-size:18px;

    font-weight:600;
}

.quantity-control span{
    min-width:29px;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

    color:var(--ocean);

    font-size:11px;

    font-weight:800;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;

    padding:
        75px 20px;

    color:
        var(--muted);
}

.empty i{
    width:90px;
    height:90px;

    margin:
        0 auto 18px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        var(--ocean-light);

    color:
        var(--ocean);

    font-size:38px;
}

.empty h3{
    font-size:18px;

    color:
        var(--text);

    font-weight:800;
}

.empty p{
    font-size:10px;

    margin-top:6px;

    line-height:1.5;
}


/* =====================================================
   CART BAR
===================================================== */

.cart-bar{
    position:fixed;

    z-index:1000;

    left:50%;
    bottom:15px;

    transform:
        translateX(-50%);

    width:
        min(680px,calc(100% - 28px));

    min-height:68px;

    padding:
        8px 9px 8px 15px;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            var(--ocean-dark),
            var(--ocean)
        );

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
        0 14px 35px
        rgba(0,55,65,.25);

    opacity:0;

    visibility:hidden;

    transition:.25s;
}

.cart-bar.show{
    opacity:1;
    visibility:visible;
}


/* =====================================================
   CART SUMMARY
===================================================== */

.cart-summary{
    display:flex;

    align-items:center;

    gap:10px;
}

.cart-icon{
    width:40px;

    text-align:center;

    font-size:21px;

    color:#fff;
}

.cart-text strong{
    display:block;

    font-size:12px;
}

.cart-text small{
    display:block;

    margin-top:1px;

    font-size:11px;

    font-weight:700;

    color:
        rgba(255,255,255,.85);
}


/* =====================================================
   VIEW CART
===================================================== */

.view-cart{
    height:45px;

    border:none;

    border-radius:13px;

    background:#fff;

    color:
        var(--ocean);

    padding:
        0 17px;

    font-size:10px;

    font-weight:800;

    display:flex;

    align-items:center;

    gap:8px;
}

.view-cart:active{
    transform:scale(.95);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:768px){

    body{
        padding-bottom:105px;
    }

    .header{
        height:195px;

        border-bottom-left-radius:29px;
        border-bottom-right-radius:29px;
    }

    .topbar{
        padding:
            11px 12px;
    }

    .back-btn,
    .cart-btn{
        width:40px;
        height:40px;
    }

    .header-content{
        padding-top:15px;
    }

    .header-content h1{
        font-size:26px;
    }

    .header-content h1 i{
        font-size:23px;
    }

    .header-content p{
        font-size:9.5px;
    }

    .main{
        padding:
            19px 10px 115px;
    }

    .page-heading{
        margin-bottom:13px;
    }

    .page-heading h2{
        font-size:18px;
    }

    .page-heading span{
        font-size:9px;
        padding:
            5px 9px;
    }

    .favorite-grid{
        gap:9px;
    }

    .food-card{
        border-radius:17px;
    }

    .food-image{
        height:145px;
    }

    .food-info{
        padding:
            8px 8px 10px;
    }

    .food-name{
        font-size:11px;
        min-height:29px;
    }

    .food-description{
        display:none;
    }

    .food-bottom{
        margin-top:5px;
    }

    .food-price{
        font-size:14px;
    }

    .add-button{
        height:32px;
        padding:
            0 10px;
        border-radius:10px;
        font-size:8.5px;
    }

    .quantity-control{
        height:32px;
        border-radius:10px;
    }

    .quantity-control button{
        width:27px;
        font-size:16px;
    }

    .quantity-control span{
        min-width:24px;
        font-size:10px;
    }

    .food-type{
        left:7px;
        top:7px;

        width:19px;
        height:19px;
    }

    .food-type::after{
        width:7px;
        height:7px;
    }

    .remove-favorite{
        width:31px;
        height:31px;

        right:7px;
        top:7px;

        font-size:14px;
    }

    .cart-bar{
        bottom:10px;

        width:
            calc(100% - 20px);

        min-height:62px;

        border-radius:17px;
    }

    .cart-icon{
        font-size:18px;
        width:33px;
    }

    .cart-text strong{
        font-size:10px;
    }

    .cart-text small{
        font-size:9px;
    }

    .view-cart{
        height:40px;

        padding:
            0 13px;

        border-radius:11px;

        font-size:9px;
    }
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:380px){

    .header-content h1{
        font-size:24px;
    }

    .favorite-grid{
        gap:7px;
    }

    .food-image{
        height:132px;
    }

    .food-name{
        font-size:10px;
    }

    .food-price{
        font-size:13px;
    }

    .add-button{
        padding:
            0 8px;
        font-size:8px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:900px){

    .favorite-grid{
        grid-template-columns:
            repeat(4,minmax(0,1fr));
    }

    .food-image{
        height:210px;
    }

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="topbar">

        <a
            href="javascript:history.back()"
            class="back-btn"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <button
            class="cart-btn"
            onclick="window.location.href='cart.html'"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            <span
                class="cart-badge"
                id="cartBadge"
            >
                0
            </span>

        </button>

    </div>


    <div class="header-content">

        <h1>

            Favorites
        </h1>

        <p>
            Your favorite food, all in one place
        </p>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="page-heading">

        <h2>
            My Favorites
        </h2>

        <span id="favoriteCount">
            0 Items
        </span>

    </div>


    <div
        class="favorite-grid"
        id="favoriteContainer"
    ></div>

</main>


<!-- ================= CART BAR ================= -->

<div
    class="cart-bar"
    id="cartBar"
>

    <div class="cart-summary">

        <div class="cart-icon">

            <i class="fa-solid fa-bag-shopping"></i>

        </div>

        <div class="cart-text">

            <strong id="cartItems">
                0 Items
            </strong>

            <small id="cartTotal">
                ₹0
            </small>

        </div>

    </div>


    <button
        class="view-cart"
        onclick="window.location.href='cart.html'"
    >

        VIEW CART

        <i class="fa-solid fa-arrow-right"></i>

    </button>

</div>


<script>

/* =========================================================
   GLOBAL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const restaurantId =
    params.get("id");

const API =
    window.location.origin;

let menuData = [];

let favorites = [];

let cart = [];



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   PRICE
========================================================= */

function getProductPrice(item){

    if(!item){
        return 0;
    }

    const fields = [
        "offer_price",
        "offerPrice",
        "selling_price",
        "sellingPrice",
        "sale_price",
        "salePrice",
        "discount_price",
        "discountPrice",
        "final_price",
        "finalPrice",
        "unit_price",
        "unitPrice",
        "price",
        "amount"
    ];

    for(const field of fields){

        const value = Number(
            String(
                item[field] ?? ""
            ).replace(/[₹,\s]/g,"")
        );

        if(
            Number.isFinite(value) &&
            value > 0
        ){
            return value;
        }
    }

    return 0;
}

/* =========================================================
   IMAGE
========================================================= */

function getProductImage(item){

    const images = [

        item.image,
        item.image_url,
        item.imageUrl,

        item.product_image,
        item.productImage,

        item.photo,
        item.photo_url,
        item.photoUrl,

        item.thumbnail,
        item.thumbnail_url,

        item.img,
        item.picture

    ];

    for(const image of images){

        if(
            image !== null &&
            image !== undefined &&
            String(image).trim()
        ){

            return String(image).trim();

        }

    }

    return "/images/other.jpg";

}


/* =========================================================
   LOAD FAVORITES
========================================================= */

function loadFavorites(){

    try{

        favorites =
            JSON.parse(
                localStorage.getItem(
                    "favorites"
                )
            ) || [];

        if(!Array.isArray(favorites)){
            favorites = [];
        }

    }
    catch(error){

        favorites = [];

    }

}


/* =========================================================
   LOAD CART
========================================================= */

function loadCart(){

    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "cart"
                )
            ) || [];

        if(!Array.isArray(cart)){
            cart = [];
        }

    }
    catch(error){

        cart = [];

    }

    updateCartUI();

}


/* =========================================================
   SAVE CART
========================================================= */

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    updateCartUI();

}


/* =========================================================
   LOAD MENU
========================================================= */

async function loadMenu(){

    try{

        /*
         * If Favorites was opened with a restaurant ID,
         * load that restaurant first.
         */
        if(restaurantId){

            const response =
                await fetch(
                    `/partner/menu/${restaurantId}`,
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );

            if(response.ok){

                const data =
                    await response.json();

                if(
                    data &&
                    Array.isArray(data.products)
                ){

                    menuData =
                        data.products;

                }
                else if(
                    Array.isArray(data)
                ){

                    menuData =
                        data;

                }

            }

        }

        /*
         * Show whatever favorite products belong
         * to the loaded menu.
         */
        displayFavorites();

    }
    catch(error){

        console.error(
            "FAVORITES MENU ERROR:",
            error
        );

        displayFavorites();

    }

}

/* =========================================================
   DISPLAY FAVORITES
========================================================= */

function displayFavorites(){

    const container =
        document.getElementById(
            "favoriteContainer"
        );


    if(!container){
        return;
    }


    const favoriteProducts =
    favorites.map(favorite => {

        /*
         * New object format
         */
        if(
            favorite &&
            typeof favorite === "object"
        ){

            return favorite;

        }

        /*
         * Old ID-only format.
         * Try to find it in the currently loaded menu.
         */
        return menuData.find(
            item =>
                String(item.id) ===
                String(favorite)
        );

    }).filter(Boolean);


    document.getElementById(
        "favoriteCount"
    ).textContent =

        `${favoriteProducts.length} Item${
            favoriteProducts.length === 1
                ? ""
                : "s"
        }`;


    if(!favoriteProducts.length){

        showEmpty(
            "No favorite items yet"
        );

        return;

    }


    container.innerHTML = "";


    favoriteProducts.forEach(item => {

        const cartItem =
            cart.find(
                x =>
                    String(
                        x.product_id
                    ) ===
                    String(item.id) &&
                    !x.cart_id
            );


        const price =
            getProductPrice(item);


        const image =
            getProductImage(item);


        const foodType =
            String(
                item.food_type ||
                item.type ||
                ""
            )
            .toLowerCase();


        const nonVeg =
            foodType.includes("non");


        let actionHTML;


        if(cartItem){

            actionHTML = `

                <div class="quantity-control">

                    <button
                        onclick="decreaseQty(${item.id})"
                    >
                        −
                    </button>

                    <span>
                        ${cartItem.quantity}
                    </span>

                    <button
                        onclick="increaseQty(${item.id})"
                    >
                        +
                    </button>

                </div>

            `;

        }
        else{

            actionHTML = `

                <button
                    class="add-button"
                    onclick="addToCart(${item.id})"
                >

                    ADD +

                </button>

            `;

        }


        container.innerHTML += `

            <article class="food-card">

                <div class="food-image">

                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(
                            item.product_name ||
                            item.name ||
                            "Food"
                        )}"
                        onerror="
                            this.onerror=null;
                            this.src='/images/other.jpg';
                        "
                    >


                    <span
                        class="food-type ${
                            nonVeg
                                ? "nonveg"
                                : ""
                        }"
                    ></span>


                    <button
                        class="remove-favorite"
                        onclick="
                            removeFavorite(
                                ${item.id}
                            )
                        "
                        title="Remove from favorites"
                    >

                        <i
                            class="fa-solid fa-heart"
                        ></i>

                    </button>

                </div>


                <div class="food-info">

                    <div class="food-name">

                        ${escapeHTML(
                            item.product_name ||
                            item.name ||
                            "Food Item"
                        )}

                    </div>


                    <div class="food-description">

                        ${escapeHTML(
                            item.description ||
                            item.short_description ||
                            "Freshly prepared and delicious."
                        )}

                    </div>


                    <div class="food-bottom">

                        <strong
                            class="food-price"
                        >

                            ₹${price}

                        </strong>

                        ${actionHTML}

                    </div>

                </div>

            </article>

        `;

    });

}


/* =========================================================
   REMOVE FAVORITE
========================================================= */

function removeFavorite(productId){

    favorites = favorites.filter(
        favorite => {

            const id =
                favorite &&
                typeof favorite === "object"
                    ? (
                        favorite.id ??
                        favorite.product_id
                    )
                    : favorite;

            return String(id) !== String(productId);
        }
    );

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

    /*
     * Refresh favorites immediately
     */
    displayFavorites();

}

/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(productId){

    /*
     * FIND PRODUCT FROM FAVORITES FIRST
     */
    const favorite =
        favorites.find(item => {

            const id =
                typeof item === "object"
                    ? (
                        item.id ??
                        item.product_id
                    )
                    : item;

            return String(id) ===
                   String(productId);

        });


    /*
     * ALSO TRY LOADED MENU
     */
    const menuProduct =
        menuData.find(
            item =>
                String(item.id) ===
                String(productId)
        );


    const product =
        favorite &&
        typeof favorite === "object"
            ? favorite
            : menuProduct;


    if(!product){

        console.error(
            "FAVORITE PRODUCT NOT FOUND:",
            productId
        );

        return;

    }


    /*
     * CHECK EXISTING CART ITEM
     */
    const existing =
        cart.find(item =>
            String(
                item.product_id
            ) ===
            String(productId)
        );


    if(existing){

        existing.quantity =
            Number(existing.quantity || 0) + 1;

    }
    else{

        cart.push({

            product_id:
                product.id ??
                product.product_id,

            quantity:1,

            product_name:
                product.product_name ||
                product.name ||
                "Food Item",

            price:
                getProductPrice(product),

            image:
                getProductImage(product),

            partner_id:
                product.partner_id ||
                product.restaurant_id ||
                null,

            restaurant_name:
                product.restaurant_name ||
                "Partner",

            item_type:
                product.item_type ||
                "food"

        });

    }


    saveCart();

    displayFavorites();

    console.log(
        "FAVORITE ADDED TO CART:",
        product
    );

}

/* =========================================================
   INCREASE
========================================================= */

function increaseQty(productId){

    const item =
        cart.find(
            x =>
                String(
                    x.product_id
                ) ===
                String(productId)
        );


    if(item){

        item.quantity++;

        saveCart();

        displayFavorites();

    }

}


/* =========================================================
   DECREASE
========================================================= */

function decreaseQty(productId){

    const index =
        cart.findIndex(
            x =>
                String(
                    x.product_id
                ) ===
                String(productId)
        );


    if(index === -1){
        return;
    }


    if(
        Number(
            cart[index].quantity
        ) > 1
    ){

        cart[index].quantity--;

    }
    else{

        cart.splice(
            index,
            1
        );

    }


    saveCart();

    displayFavorites();

}


/* =========================================================
   CART UI
========================================================= */

function updateCartUI(){

    let totalItems = 0;

    let totalPrice = 0;


    cart.forEach(item => {

        const quantity =
            Number(
                item.quantity || 0
            );

        const price =
            Number(
                item.price || 0
            );


        totalItems += quantity;

        totalPrice +=
            quantity * price;

    });


    const badge =
        document.getElementById(
            "cartBadge"
        );


    if(badge){

        badge.textContent =
            totalItems;

        badge.style.display =
            totalItems > 0
                ? "flex"
                : "none";

    }


    document.getElementById(
        "cartItems"
    ).textContent =

        `${totalItems} Item${
            totalItems === 1
                ? ""
                : "s"
        }`;


    document.getElementById(
        "cartTotal"
    ).textContent =
        `₹${totalPrice}`;


    document.getElementById(
        "cartBar"
    ).classList.toggle(
        "show",
        totalItems > 0
    );

}


/* =========================================================
   EMPTY
========================================================= */

function showEmpty(message){

    const container =
        document.getElementById(
            "favoriteContainer"
        );


    if(!container){
        return;
    }


    document.getElementById(
        "favoriteCount"
    ).textContent =
        "0 Items";


    container.innerHTML = `

        <div
            class="empty"
            style="
                grid-column:1/-1;
            "
        >

            <i
                class="fa-regular fa-heart"
            ></i>

            <h3>
                ${escapeHTML(message)}
            </h3>

            <p>
                Add items to your favorites
                and they will appear here.
            </p>

        </div>

    `;

}

   START
========================================================= */

async function initialize(){

    loadFavorites();

    loadCart();

    await loadMenu();

}


document.addEventListener(
    "DOMContentLoaded",
    initialize
);

</script>
