<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DARVOZ Grocery Categories</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --ocean:#004D5B;
    --ocean-dark:#003542;
    --ocean-deep:#002A34;
    --ocean-light:#E8F5F7;

    --orange:#FF6500;

    --white:#ffffff;
    --text:#18252a;
    --muted:#718087;

    --border:#e4ecef;

}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Poppins',sans-serif;

    background:#f5f8f9;

    color:var(--text);

    min-height:100vh;

}

button,
input{
    font-family:'Poppins',sans-serif;
}

button{
    cursor:pointer;
}

img{
    display:block;
    max-width:100%;
}


/* =====================================================
   PAGE
===================================================== */

.page{

    min-height:100vh;

    padding-bottom:100px;

}


/* =====================================================
   HEADER
===================================================== */

.grocery-header{

    position:relative;

    overflow:hidden;

    color:#fff;

    padding:
        20px
        max(18px,5vw)
        45px;

    border-radius:
        0
        0
        30px
        30px;

    background:

        radial-gradient(
            circle at 90% 0%,
            rgba(255,255,255,.13),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            var(--ocean-deep),
            var(--ocean),
            var(--ocean-dark)
        );

    box-shadow:
        0 8px 30px rgba(0,53,66,.18);

}


/* Decorative circles */

.grocery-header::before{

    content:"";

    position:absolute;

    width:190px;
    height:190px;

    border-radius:50%;

    right:-75px;
    top:-105px;

    border:
        1px solid
        rgba(255,255,255,.10);

}

.grocery-header::after{

    content:"";

    position:absolute;

    width:100px;
    height:100px;

    border-radius:50%;

    left:-50px;
    bottom:-60px;

    background:
        rgba(255,101,0,.10);

}


/* =====================================================
   HEADER TOP
===================================================== */

.header-top{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    gap:14px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

    width:46px;
    height:46px;

    flex-shrink:0;

    border:none;

    border-radius:15px;

    background:
        rgba(255,255,255,.12);

    color:#fff;

    font-size:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;

}

.back-button:hover{

    background:
        rgba(255,255,255,.20);

}

.back-button:active{

    transform:scale(.93);

}


/* =====================================================
   TITLE
===================================================== */

.header-title{

    flex:1;

}

.header-title h1{

    font-size:27px;

    font-weight:800;

    line-height:1.1;

    letter-spacing:-.5px;

}

.header-title p{

    margin-top:5px;

    font-size:10px;

    color:
        rgba(255,255,255,.75);

    font-weight:500;

}


/* =====================================================
   CART BUTTON
===================================================== */

.cart-button{

    width:46px;
    height:46px;

    flex-shrink:0;

    border:none;

    border-radius:15px;

    background:
        rgba(255,255,255,.12);

    color:#fff;

    font-size:18px;

    position:relative;

    transition:.2s;

}

.cart-button:hover{

    background:
        rgba(255,255,255,.20);

}

.cart-button:active{

    transform:scale(.93);

}


/* =====================================================
   CART BADGE
===================================================== */

.cart-badge{

    position:absolute;

    right:-5px;
    top:-5px;

    min-width:20px;
    height:20px;

    padding:0 5px;

    border-radius:20px;

    background:var(--orange);

    color:#fff;

    font-size:9px;

    font-weight:800;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        2px solid
        var(--ocean);

}


/* =====================================================
   SEARCH
===================================================== */

.search-section{

    width:min(1100px,100%);

    margin:-27px auto 0;

    padding:
        0
        max(18px,4vw);

    position:relative;

    z-index:5;

}

.search-box{

    height:58px;

    background:#fff;

    border-radius:18px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:0 18px;

    border:
        1px solid
        var(--border);

    box-shadow:
        0 10px 30px
        rgba(0,53,66,.12);

}

.search-box i{

    color:var(--ocean);

    font-size:18px;

}

.search-box input{

    flex:1;

    min-width:0;

    border:none;

    outline:none;

    font-size:13px;

    color:var(--text);

    background:transparent;

}

.search-box input::placeholder{

    color:#9aa5aa;

}


/* =====================================================
   MAIN
===================================================== */

.main{

    width:
        min(1250px,100%);

    margin:auto;

    padding:
        30px
        max(18px,4vw)
        30px;

}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:18px;

}

.section-header h2{

    font-size:23px;

    font-weight:800;

    color:var(--ocean-deep);

    letter-spacing:-.3px;

}

.category-count{

    color:var(--ocean);

    background:var(--ocean-light);

    padding:
        6px
        11px;

    border-radius:20px;

    font-size:10px;

    font-weight:700;

}


/* =====================================================
   CATEGORY GRID
===================================================== */

.category-grid{

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:16px;

}


/* =====================================================
   CATEGORY CARD
===================================================== */

.category-card{

    border:
        1px solid
        var(--border);

    background:#fff;

    border-radius:20px;

    padding:15px;

    min-height:215px;

    box-shadow:
        0 5px 20px
        rgba(0,53,66,.045);

    transition:

        transform .2s ease,

        box-shadow .2s ease,

        border-color .2s ease;

    text-align:center;

    appearance:none;

    -webkit-tap-highlight-color:transparent;

}

.category-card:hover{

    transform:
        translateY(-4px);

    border-color:
        rgba(0,77,91,.30);

    box-shadow:
        0 14px 30px
        rgba(0,53,66,.11);

}

.category-card:active{

    transform:
        scale(.97);

}


/* =====================================================
   CATEGORY IMAGE
===================================================== */

.category-image{

    width:145px;
    height:145px;

    margin:
        0
        auto
        10px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #ffffff 0%,
            #E8F5F7 100%
        );

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:
        5px solid
        #f4f8f9;

}

.category-image img{

    width:100%;
    height:100%;

    object-fit:contain;

    padding:5px;

}

.category-placeholder{

    font-size:42px;

    color:var(--ocean);

}


/* =====================================================
   CATEGORY NAME
===================================================== */

.category-name{

    font-size:14px;

    font-weight:800;

    line-height:1.25;

    color:var(--ocean-deep);

}


/* =====================================================
   SHOP NOW
===================================================== */

.category-items{

    margin-top:6px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:
        5px
        11px;

    border-radius:20px;

    background:var(--ocean-light);

    color:var(--ocean);

    font-size:9px;

    font-weight:800;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    grid-column:1/-1;

    min-height:300px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:var(--muted);

}

.loading i{

    font-size:30px;

    color:var(--ocean);

    margin-bottom:12px;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    grid-column:1/-1;

    text-align:center;

    padding:70px 20px;

    color:var(--muted);

}

.empty i{

    font-size:42px;

    color:var(--ocean);

    margin-bottom:12px;

}


/* =====================================================
   ERROR
===================================================== */

.error{

    grid-column:1/-1;

    text-align:center;

    padding:60px 20px;

    color:#dc2626;

}

.error i{

    font-size:35px;

    margin-bottom:12px;

}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

    position:fixed;

    left:50%;

    bottom:0;

    transform:
        translateX(-50%);

    width:min(700px,100%);

    height:74px;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    border-radius:
        24px
        24px
        0
        0;

    box-shadow:
        0 -8px 30px
        rgba(0,53,66,.13);

    display:flex;

    align-items:center;

    justify-content:space-around;

    padding:0 5px;

    z-index:1000;

    border-top:
        1px solid
        #e6edef;

}

.nav-item{

    width:20%;

    height:100%;

    border:none;

    background:none;

    color:#7d898e;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    font-size:9px;

    font-weight:600;

    position:relative;

    transition:.2s;

}

.nav-item i{

    font-size:19px;

    transition:.2s;

}

.nav-item.active{

    color:var(--ocean);

    font-weight:800;

}

.nav-item.active i{

    color:var(--ocean);

}


/* =====================================================
   CENTER GROCERY BUTTON
===================================================== */

.nav-item:nth-child(3){

    transform:
        translateY(-10px);

}

.nav-item:nth-child(3)::before{

    content:"";

    position:absolute;

    top:3px;

    width:52px;
    height:52px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            var(--ocean),
            var(--ocean-dark)
        );

    box-shadow:

        0 6px 16px
        rgba(0,77,91,.30),

        0 0 0 4px #fff;

    z-index:-1;

}

.nav-item:nth-child(3) i{

    width:52px;
    height:52px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#fff !important;

    font-size:21px;

    margin-bottom:-34px;

}

.nav-item:nth-child(3) span{

    margin-top:36px;

    color:var(--ocean);

    font-weight:800;

}


/* =====================================================
   SPLASH
===================================================== */

.grocery-splash{

    position:fixed;

    inset:0;

    z-index:99999;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.08),
            transparent 25%
        ),

        linear-gradient(
            145deg,
            var(--ocean-deep),
            var(--ocean),
            var(--ocean-dark)
        );

    opacity:1;

    visibility:visible;

    transition:
        opacity .35s ease,
        visibility .35s ease;

}

.grocery-splash.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}

.grocery-splash-content{

    text-align:center;

    color:#fff;

    animation:
        grocerySplashEnter .45s ease;

}

.grocery-splash-name{

    font-size:
        clamp(42px,10vw,78px);

    font-weight:900;

    letter-spacing:4px;

    line-height:1;

}

.grocery-splash-subtitle{

    margin-top:10px;

    font-size:
        clamp(14px,3vw,22px);

    font-weight:700;

    letter-spacing:8px;

    color:
        rgba(255,255,255,.90);

}

.grocery-splash-icon{

    margin-top:22px;

    font-size:38px;

    color:var(--orange);

}

@keyframes grocerySplashEnter{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.97);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1000px){

    .category-grid{

        grid-template-columns:
            repeat(3,minmax(0,1fr));

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:768px){

    .page{

        padding-bottom:90px;

    }

    .grocery-header{

        padding:
            14px
            14px
            38px;

        border-radius:
            0
            0
            25px
            25px;

    }

    .back-button,
    .cart-button{

        width:42px;

        height:42px;

        border-radius:13px;

    }

    .header-title h1{

        font-size:21px;

    }

    .header-title p{

        font-size:9px;

    }

    .search-section{

        margin-top:-19px;

        padding:
            0
            14px;

    }

    .search-box{

        height:53px;

        border-radius:16px;

        padding:
            0
            15px;

    }

    .search-box input{

        font-size:12px;

    }

    .main{

        padding:
            25px
            12px
            100px;

    }

    .section-header{

        margin-bottom:14px;

    }

    .section-header h2{

        font-size:18px;

    }

    .category-count{

        font-size:9px;

        padding:
            5px
            8px;

    }

    .category-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:10px;

    }

    .category-card{

        min-height:185px;

        padding:9px;

        border-radius:17px;

    }

    .category-image{

        width:120px;

        height:120px;

        margin-bottom:8px;

    }

    .category-name{

        font-size:12px;

    }

    .category-items{

        font-size:8px;

        padding:
            4px
            8px;

    }

    .bottom-nav{

        height:68px;

        border-radius:
            20px
            20px
            0
            0;

    }

    .nav-item{

        font-size:8px;

    }

    .nav-item i{

        font-size:18px;

    }

    .nav-item:nth-child(3)::before{

        width:47px;

        height:47px;

    }

    .nav-item:nth-child(3) i{

        width:47px;

        height:47px;

        font-size:20px;

    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

    .category-grid{

        gap:8px;

    }

    .category-card{

        min-height:170px;

        padding:8px;

    }

    .category-image{

        width:105px;

        height:105px;

    }

    .category-name{

        font-size:11px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     GROCERY SPLASH
===================================================== -->

<div
    id="grocerySplash"
    class="grocery-splash"
>

    <div class="grocery-splash-content">

        <div class="grocery-splash-name">
            DARVOZ
        </div>

        <div class="grocery-splash-subtitle">
            GROCERY
        </div>

        <i
            class="fa-solid fa-basket-shopping grocery-splash-icon"
        ></i>

    </div>

</div>


<div class="page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="grocery-header">

    <div class="header-top">


        <button
            class="back-button"
            onclick="goBack()"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="header-title">

            <h1>
                Groceries
            </h1>

            <p>
                Shop daily essentials
            </p>

        </div>


        <button
            class="cart-button"
            onclick="openCart()"
        >

            <i class="fa-solid fa-cart-shopping"></i>

            <span
                id="cartBadge"
                class="cart-badge"
            >
                0
            </span>

        </button>


    </div>

</header>


<!-- =====================================================
     SEARCH
===================================================== -->

<section class="search-section">

    <div class="search-box">

        <i
            class="fa-solid fa-magnifying-glass"
        ></i>

        <input
            type="text"
            id="categorySearch"
            placeholder="Search grocery categories..."
            autocomplete="off"
        >

    </div>

</section>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <div class="section-header">

        <h2>
            All Categories
        </h2>

        <span
            id="categoryCount"
            class="category-count"
        >
            Loading...
        </span>

    </div>


    <div
        id="categoryGrid"
        class="category-grid"
    >

        <div class="loading">

            <i
                class="fa-solid fa-spinner fa-spin"
            ></i>

            <span>
                Loading categories...
            </span>

        </div>

    </div>


</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">


    <button
        class="nav-item"
        onclick="goHome()"
    >

        <i class="fa-solid fa-house"></i>

        <span>
            Home
        </span>

    </button>


    <button
        class="nav-item"
        onclick="goCategories()"
    >

        <i class="fa-solid fa-grip"></i>

        <span>
            Categories
        </span>

    </button>


    <button
        class="nav-item active"
    >

        <i class="fa-solid fa-basket-shopping"></i>

        <span>
            Grocery
        </span>

    </button>


    <button
        class="nav-item"
        onclick="openCart()"
    >

        <i class="fa-solid fa-cart-shopping"></i>

        <span>
            Cart
        </span>

    </button>


    <button
        class="nav-item"
        onclick="openProfile()"
    >

        <i class="fa-solid fa-user"></i>

        <span>
            Profile
        </span>

    </button>


</nav>


</div>


<script>

/* =====================================================
   API
===================================================== */

const API = window.location.origin;


/* =====================================================
   VARIABLES
===================================================== */

let groceryCategories = [];

let filteredCategories = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   GROCERY SPLASH
===================================================== */

function hideGrocerySplash(){

    const splash =
        document.getElementById(
            "grocerySplash"
        );

    if(!splash){

        return;

    }

    splash.classList.add("hide");

}


/* =====================================================
   LOAD GROCERY CATEGORIES
===================================================== */

async function loadGroceryCategories(){

    const grid =
        document.getElementById(
            "categoryGrid"
        );

    try{

        console.log(
            "================================="
        );

        console.log(
            "LOADING GROCERY CATEGORIES"
        );

        console.log(
            "================================="
        );


        /*
         * IMPORTANT:
         *
         * grocery_categories is a GLOBAL
         * category table.
         *
         * It does NOT contain partner_id.
         *
         * Therefore we don't use a
         * restaurant/partner ID here.
         *
         * The backend GET route currently
         * accepts /:partnerId but does not
         * use the value.
         */


        const response =
            await fetch(
                "/partner/grocery-categories/0",
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                `HTTP Error ${response.status}`
            );

        }


        const data =
            await response.json();


        console.log(
            "GROCERY CATEGORY RESPONSE:",
            data
        );


        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load grocery categories."
            );

        }


        groceryCategories =
            Array.isArray(
                data.categories
            )
            ?
            data.categories
            :
            [];


        filteredCategories =
            [
                ...groceryCategories
            ];


        document.getElementById(
            "categoryCount"
        ).textContent =
            `${groceryCategories.length} categories`;


        renderCategories();


    }

    catch(error){

        console.error(
            "GROCERY CATEGORY ERROR:",
            error
        );


        grid.innerHTML = `

            <div class="error">

                <i
                    class="fa-solid fa-triangle-exclamation"
                ></i>

                <p>

                    ${escapeHtml(
                        error.message ||
                        "Unable to load categories."
                    )}

                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories(){

    const grid =
        document.getElementById(
            "categoryGrid"
        );


    if(!filteredCategories.length){

        grid.innerHTML = `

            <div class="empty">

                <i
                    class="fa-solid fa-basket-shopping"
                ></i>

                <p>
                    No grocery categories found.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML = "";


    filteredCategories.forEach(
        category => {


            const categoryId =
                category.id;


            const categoryName =
                category.category_name ||
                category.name ||
                "Other";


            const imageUrl =
                category.category_image ||
                category.image_url ||
                category.image ||
                category.default_image ||
                "";


            const card =
                document.createElement(
                    "button"
                );


            card.className =
                "category-card";


            card.type =
                "button";


            card.onclick =
                () =>
                    openCategory(
                        categoryId,
                        categoryName
                    );


            let imageHtml;


            if(imageUrl){

                imageHtml = `

                    <img
                        src="${escapeHtml(imageUrl)}"
                        alt="${escapeHtml(categoryName)}"
                        loading="lazy"

                        onerror="
                            this.style.display='none';
                            this.parentElement.innerHTML=
                            '<span class=&quot;category-placeholder&quot;>🛒</span>';
                        "
                    >

                `;

            }

            else{

                imageHtml = `

                    <span
                        class="category-placeholder"
                    >
                        🛒
                    </span>

                `;

            }


            card.innerHTML = `

                <div class="category-image">

                    ${imageHtml}

                </div>


                <div class="category-name">

                    ${escapeHtml(
                        categoryName
                    )}

                </div>


                <div class="category-items">

                    Shop Now

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById(
        "categorySearch"
    )
    .addEventListener(
        "input",
        function(){

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            filteredCategories =
                groceryCategories.filter(
                    category => {


                        const name =
                            category.category_name ||
                            category.name ||
                            "";


                        return name
                            .toLowerCase()
                            .includes(search);

                    }
                );


            document.getElementById(
                "categoryCount"
            ).textContent =
                `${filteredCategories.length} categories`;


            renderCategories();

        }
    );
