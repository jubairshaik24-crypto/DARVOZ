
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#006B63">
<title>Order Delivered - DARVOZ</title>

<style>
:root {
    --petrol: #006B63;
    --dark: #004D48;
    --mint: #E7F8F3;
    --text: #123F3A;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #FFFFFF;
    color: var(--text);
    min-height: 100vh;
}

.page {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    padding: 35px 22px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

/* SUCCESS CHECKMARK */

.success-icon {
    width: 92px;
    height: 92px;
    flex-shrink: 0;
    background: linear-gradient(145deg, #08B99B, #00564F);
    border: 7px solid #E1F8F2;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 25px rgba(0,107,99,.16);
    margin-bottom: 23px;
    animation: popIn .65s ease-out both;
}

.success-icon svg {
    width: 46px;
    height: 46px;
    fill: none;
    stroke: #FFFFFF;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* HEADING */

h1 {
    font-size: clamp(27px, 7vw, 36px);
    line-height: 1.12;
    font-weight: 850;
    letter-spacing: -1px;
    color: var(--dark);
    margin-bottom: 12px;
    animation: fadeUp .6s .1s both;
}

h1 span {
    color: #08A98F;
}

.thank-you {
    color: #667D78;
    font-size: 17px;
    line-height: 1.5;
    margin-bottom: 15px;
    animation: fadeUp .6s .2s both;
}

.heart {
    color: var(--petrol);
    display: inline-block;
    animation: heartbeat 1.4s ease-in-out infinite;
}

/* BAG IMAGE */

.bag-stage {
    width: 100%;
    max-width: 340px;
    height: 360px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.bag-glow {
    position: absolute;
    width: 260px;
    height: 260px;
    background: radial-gradient(
        circle,
        rgba(15,190,157,.13),
        rgba(15,190,157,0) 70%
    );
    border-radius: 50%;
}

.bag-image {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    max-width: 330px;
    height: 340px;
    object-fit: contain;
    animation: bagBounce 2.4s ease-in-out infinite;
}

/* SIMPLE FLOATING DECORATION */

.decor {
    position: absolute;
    color: #0BAE96;
    font-size: 25px;
    pointer-events: none;
    animation: float 3s ease-in-out infinite;
}

.decor.one {
    top: 65px;
    left: 12px;
}

.decor.two {
    top: 85px;
    right: 12px;
    animation-delay: .7s;
}

.decor.three {
    bottom: 55px;
    left: 25px;
    animation-delay: 1.2s;
}

.decor.four {
    bottom: 50px;
    right: 25px;
    animation-delay: .4s;
}

/* HAPPY MESSAGE */

.enjoy {
    margin-top: 3px;
    animation: fadeUp .6s .3s both;
}

.enjoy h2 {
    font-size: 27px;
    font-weight: 850;
    letter-spacing: -.5px;
    color: var(--dark);
    margin-bottom: 9px;
}

.enjoy p {
    font-size: 16px;
    color: #6D827D;
    line-height: 1.5;
}

/* HOME BUTTON */

.home-btn {
    width: 100%;
    max-width: 390px;
    min-height: 64px;
    margin-top: 29px;
    padding: 15px 22px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(110deg, #009B87, #00534D);
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 750;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 17px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,107,99,.22);
    transition: transform .2s, box-shadow .2s;
    animation: fadeUp .6s .4s both;
}

.home-btn svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
}

.home-btn:active {
    transform: scale(.97);
    box-shadow: 0 5px 12px rgba(0,107,99,.18);
}

/* ANIMATIONS */

@keyframes bagBounce {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(-8deg);
        opacity: .65;
    }
    50% {
        transform: translateY(-13px) rotate(10deg);
        opacity: 1;
    }
}

@keyframes popIn {
    from { transform: scale(.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

/* SMALL MOBILE SCREENS */

@media (max-width: 380px) {
    .page {
        padding: 24px 18px;
    }

    .success-icon {
        width: 76px;
        height: 76px;
        margin-bottom: 18px;
    }

    .success-icon svg {
        width: 38px;
        height: 38px;
    }

    .thank-you {
        font-size: 15px;
    }

    .bag-stage {
        height: 285px;
    }

    .bag-image {
        height: 275px;
    }

    .enjoy h2 {
        font-size: 23px;
    }

    .enjoy p {
        font-size: 14px;
    }

    .home-btn {
        min-height: 56px;
        font-size: 16px;
        margin-top: 22px;
    }
}

/* REDUCED MOTION ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>

<script src="/customer/beautiful-alerts.js"></script>
</head>

<body>

<main class="page">

    <div class="success-icon" aria-label="Order delivered successfully">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m5 12 4.5 4.5L19 7"></path>
        </svg>
    </div>

    <h1>
        Your Order is<br>
        <span>Delivered!</span>
    </h1>

    <p class="thank-you">
        Thank you for ordering Darvoz!
        <span class="heart">♥</span>
    </p>

    <section class="bag-stage" aria-label="DARVOZ thank you mascot">
        <div class="bag-glow"></div>

        <span class="decor one" aria-hidden="true">♥</span>
        <span class="decor two" aria-hidden="true">♥</span>
        <span class="decor three" aria-hidden="true">✦</span>
        <span class="decor four" aria-hidden="true">✦</span>

        <img
            class="bag-image"
            src="/customer/images/darvoz-happy-bag.png"
            alt="DARVOZ bag mascot holding a Thank You sign"
        >
    </section>

    <section class="enjoy">
        <h2>Enjoy And Be Happy</h2>
        <p>Your satisfaction is our priority.</p>
    </section>

    <button class="home-btn" type="button" onclick="goHome()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 10 9-7 9 7"></path>
            <path d="M5 9v12h14V9"></path>
            <path d="M9 21v-7h6v7"></path>
        </svg>
        <span>Back to Home</span>
    </button>

</main>

<script>
function goHome() {
    window.location.href = "index.html";
}

// Log an image-loading issue without interrupting the customer.
document.querySelector(".bag-image").addEventListener("error", function () {
    console.error(
        "DARVOZ image not found. Check customer/darvoz-happy-bag.png"
    );
});
</script>

</body>
</html>
