<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARVOZ | Shop Address</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#ececec;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:390px;
min-height:100vh;
background:#fff;
box-shadow:0 0 35px rgba(0,0,0,.12);
}

.header{
padding:20px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.back{
width:42px;
height:42px;
border-radius:50%;
background:#fff3eb;
display:flex;
justify-content:center;
align-items:center;
color:#ff6b00;
cursor:pointer;
}

.form{
padding:22px;
}

.progress{
height:8px;
background:#eee;
border-radius:20px;
margin-bottom:25px;
overflow:hidden;
}

.progress div{
width:40%;
height:100%;
background:#ff6b00;
}

.step{
color:#ff6b00;
font-weight:600;
font-size:14px;
}

.title{
font-size:28px;
font-weight:800;
margin:8px 0;
}

.sub{
color:#777;
font-size:14px;
margin-bottom:25px;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
height:55px;
border:1px solid #ddd;
border-radius:15px;
padding:0 18px;
font-size:15px;
outline:none;
}

.location-btn{
width:100%;
height:52px;
margin-top:20px;
background:#fff3eb;
border:2px solid #ff6b00;
color:#ff6b00;
font-weight:700;
border-radius:15px;
cursor:pointer;
}

.next-btn{
width:100%;
height:56px;
margin-top:30px;
background:#ff6b00;
color:#fff;
border:none;
border-radius:18px;
font-size:18px;
font-weight:700;
cursor:pointer;
}
.map-picker{
    position:fixed;
    inset:0;
    z-index:10001;
    display:none;
    background:#fff;
    overflow:hidden;
}

.map-picker-header{
    position:absolute;
    z-index:3;
    top:calc(12px + env(safe-area-inset-top));
    left:16px;
    right:16px;
    display:flex;
    gap:10px;
}

.map-back{
    flex:0 0 48px;
    width:48px;
    height:48px;
    margin:0;
    padding:0;
    border:0;
    border-radius:50%;
    color:#17252b;
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.16);
    font-size:20px;
}

.map-search-box{
    height:52px;
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 15px;
    border:1px solid #e4e7e8;
    border-radius:16px;
    background:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.14);
}

.map-search-box input{
    width:100%;
    height:auto;
    border:0;
    outline:0;
    background:transparent;
    font:600 14px Poppins,Arial,sans-serif;
}

.pac-container{z-index:10003!important;}

#locationMap{
    position:absolute;
    inset:0;
    background:#eef0f2;
}

.map-picker-actions{
    position:absolute;
    z-index:2;
    left:0;
    right:0;
    bottom:0;
    padding:0 16px calc(16px + env(safe-area-inset-bottom));
    pointer-events:none;
}

.map-selection-card{
    padding:16px;
    border-radius:24px;
    background:#fff;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    pointer-events:auto;
}

.map-selection-kicker{
    margin:-16px -16px 15px;
    padding:15px 18px 12px;
    border-bottom:1px solid #edf0f1;
    border-radius:24px 24px 0 0;
    color:#56636a;
    font-size:13px;
    font-weight:700;
}

.map-selection-title{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin:0 0 7px;
    color:#18252a;
    font-size:18px;
    line-height:1.3;
    font-weight:800;
}

.map-selection-title i{margin-top:3px;color:#ff6b00;}

.map-selection-address{
    margin:0 0 16px 27px;
    color:#5c666b;
    font-size:13px;
    line-height:1.5;
}

.map-picker-actions button{cursor:pointer;font:inherit;font-weight:800;}

.map-recenter-btn{
    position:absolute;
    left:50%;
    bottom:calc(100% + 14px);
    transform:translateX(-50%);
    min-width:190px;
    min-height:50px;
    margin:0;
    padding:0 16px;
    border:0;
    border-radius:14px;
    color:#3c4549;
    background:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.18);
    white-space:nowrap;
}

.map-confirm-btn{
    width:100%;
    min-height:52px;
    margin:0;
    border:0;
    border-radius:14px;
    color:#fff;
    background:#ff6b00;
    font-size:16px;
}

body.map-open{overflow:hidden;}
</style>

<script src="/partner/beautiful-alerts.js"></script>
</head>

<body>

<div class="app">

<div class="header">

<div class="back" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</div>

<h2>Shop Address</h2>

</div>

<div class="form">

<div class="progress">
<div></div>
</div>

<div class="step">Step 2 of 5</div>

<div class="title">Business Address</div>

<div class="sub">
Tell us where your shop is located.
</div>

<label>Shop Address</label>
<input id="address" placeholder="Shop No, Street">

<label>City</label>
<input id="city">

<label>Area</label>
<input id="area">
<label>State</label>
<input
type="text"
id="state"
>

<label>Pincode</label>
<input id="pincode">

<button class="location-btn" onclick="getLocation()">
<i class="fa-solid fa-location-crosshairs"></i>
Use Current Location
</button>

<button class="next-btn" onclick="nextPage()">
    Continue
</button>


</div>

</div>

<div class="map-picker" id="mapPicker" aria-hidden="true">
    <div class="map-picker-header">
        <button type="button" class="map-back" onclick="closeLocationMap()" aria-label="Back">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <label class="map-search-box">
            <input id="mapAddressSearch" type="search" placeholder="Search an area or address">
            <i class="fa-solid fa-magnifying-glass"></i>
        </label>
    </div>
    <div id="locationMap" aria-label="Map to select business location"></div>
    <div class="map-picker-actions">
        <button type="button" class="map-recenter-btn" onclick="recenterLocationMap()">
            <i class="fa-solid fa-location-crosshairs"></i> Current location
        </button>
        <div class="map-selection-card">
            <div class="map-selection-kicker">Business location</div>
            <h2 class="map-selection-title">
                <i class="fa-solid fa-location-dot"></i>
                <span id="mapAreaName">Finding this location…</span>
            </h2>
            <p class="map-selection-address" id="mapFullAddress">Drag the pin to adjust the business location.</p>
            <button type="button" class="map-confirm-btn" onclick="confirmMapLocation()">Confirm Location</button>
        </div>
    </div>
</div>

<script>

let latitude = null;
let longitude = null;
let locationMap = null;
let locationMarker = null;
let mapGeocoder = null;
let mapAutocomplete = null;
let mapSelectedPlace = null;
let mapAddressRequest = 0;

function getLocation(){
    if(!navigator.geolocation){
        alert("Geolocation is not supported. Search for your business address instead.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => showLocationMap(position.coords.latitude, position.coords.longitude),
        error => {
            console.error("BUSINESS LOCATION ERROR:", error);
            alert("Please allow location access to open the map at your current location.");
        },
        { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
}

function showLocationMap(lat, lng){
    if(typeof google === "undefined" || !google.maps){
        alert("Google Maps is not loaded. Please try again.");
        return;
    }

    const center = { lat:Number(lat), lng:Number(lng) };
    const picker = document.getElementById("mapPicker");
    picker.style.display = "block";
    picker.setAttribute("aria-hidden", "false");
    document.body.classList.add("map-open");

    requestAnimationFrame(() => {
        if(!locationMap){
            locationMap = new google.maps.Map(document.getElementById("locationMap"), {
                center,
                zoom:17,
                mapTypeControl:false,
                streetViewControl:false,
                fullscreenControl:false,
                gestureHandling:"greedy"
            });
            locationMarker = new google.maps.Marker({
                position:center,
                map:locationMap,
                draggable:true,
                title:"Drag to adjust business location"
            });
            mapGeocoder = new google.maps.Geocoder();
            locationMarker.addListener("dragend", event => {
                updateMapSelection(event.latLng.lat(), event.latLng.lng());
            });
            locationMap.addListener("click", event => {
                updateMapSelection(event.latLng.lat(), event.latLng.lng());
            });

            const searchInput = document.getElementById("mapAddressSearch");
            mapAutocomplete = new google.maps.places.Autocomplete(searchInput, {
                componentRestrictions:{ country:"in" },
                fields:["formatted_address", "geometry", "address_components"]
            });
            mapAutocomplete.bindTo("bounds", locationMap);
            mapAutocomplete.addListener("place_changed", () => {
                const place = mapAutocomplete.getPlace();
                if(!place || !place.geometry || !place.geometry.location){
                    alert("Choose an address from the search suggestions.");
                    return;
                }
                const point = place.geometry.location;
                locationMap.panTo(point);
                locationMap.setZoom(17);
                updateMapSelection(point.lat(), point.lng(), place);
            });
        }

        locationMap.setCenter(center);
        locationMap.setZoom(17);
        locationMarker.setPosition(center);
        google.maps.event.trigger(locationMap, "resize");
        updateMapSelection(center.lat, center.lng);
    });
}

function updateMapSelection(lat, lng, placeResult){
    latitude = Number(lat);
    longitude = Number(lng);
    mapSelectedPlace = placeResult || null;
    locationMarker.setPosition({ lat:latitude, lng:longitude });

    if(placeResult && placeResult.address_components){
        renderMapAddress(placeResult);
        return;
    }

    const requestId = ++mapAddressRequest;
    document.getElementById("mapAreaName").textContent = "Finding this location…";
    document.getElementById("mapFullAddress").textContent = "";
    mapGeocoder.geocode({ location:{ lat:latitude, lng:longitude } }, (results, status) => {
        if(requestId !== mapAddressRequest) return;
        if(status !== "OK" || !results || !results[0]){
            document.getElementById("mapAreaName").textContent = "Selected map location";
            document.getElementById("mapFullAddress").textContent = "Address details unavailable. You can still confirm this pin.";
            mapSelectedPlace = null;
            return;
        }
        mapSelectedPlace = results[0];
        renderMapAddress(results[0]);
    });
}

function renderMapAddress(result){
    const components = result.address_components || [];
    const findPart = types => {
        const component = components.find(item => types.some(type => item.types.includes(type)));
        return component ? component.long_name : "";
    };
    const area = findPart(["sublocality", "sublocality_level_1", "neighborhood"]);
    const city = findPart(["locality", "administrative_area_level_2"]);
    document.getElementById("mapAreaName").textContent = [area, city].filter(Boolean).join(", ") || city || area || "Selected map location";
    document.getElementById("mapFullAddress").textContent = result.formatted_address || "Address details unavailable. You can still confirm this pin.";
}

function recenterLocationMap(){
    if(!navigator.geolocation){
        alert("Location is not supported by this browser.");
        return;
    }
    navigator.geolocation.getCurrentPosition(
        position => {
            const point = { lat:position.coords.latitude, lng:position.coords.longitude };
            locationMap.panTo(point);
            locationMap.setZoom(17);
            updateMapSelection(point.lat, point.lng);
        },
        error => {
            console.error("LOCATION RECENTER ERROR:", error);
            alert("Unable to refresh your current location. Please allow location access.");
        },
        { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
}

function closeLocationMap(){
    const picker = document.getElementById("mapPicker");
    picker.style.display = "none";
    picker.setAttribute("aria-hidden", "true");
    document.body.classList.remove("map-open");
}

function confirmMapLocation(){
    if(!Number.isFinite(latitude) || !Number.isFinite(longitude)){
        document.getElementById("mapFullAddress").textContent = "Please choose a valid point on the map.";
        return;
    }
    if(!mapSelectedPlace || !mapSelectedPlace.address_components){
        document.getElementById("mapFullAddress").textContent = "Please wait for the address to load, or search for a place.";
        return;
    }

    const result = mapSelectedPlace;
    const components = result.address_components || [];
    const findPart = types => {
        const component = components.find(item => types.some(type => item.types.includes(type)));
        return component ? component.long_name : "";
    };
    const house = findPart(["street_number"]);
    const street = findPart(["route"]);
    document.getElementById("address").value = [house, street].filter(Boolean).join(" ") || result.formatted_address || "";
    document.getElementById("area").value = findPart(["sublocality", "sublocality_level_1", "neighborhood"]);
    document.getElementById("city").value = findPart(["locality", "administrative_area_level_2"]);
    document.getElementById("state").value = findPart(["administrative_area_level_1"]);
    document.getElementById("pincode").value = findPart(["postal_code"]);
    localStorage.setItem("latitude", String(latitude));
    localStorage.setItem("longitude", String(longitude));
    closeLocationMap();
}

function nextPage(){

const address=document.getElementById("address").value.trim();
const city=document.getElementById("city").value.trim();
const state=document.getElementById("state").value.trim();
const pincode=document.getElementById("pincode").value.trim();
const area = document.getElementById("area").value.trim();
if(
address===""||
city===""||
state===""||
pincode===""){
alert("Please fill all address details.");
return;
}

localStorage.setItem("address",address);
localStorage.setItem("city",city);
localStorage.setItem("state",state);
localStorage.setItem("pincode",pincode);
localStorage.setItem("area", area);

location.href="partner-documents.html";

}

</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDFSLc0npyYLrB-JMhkaCg6Q1xlPNE8TfQ&libraries=places"></script>
</body>
</html>
