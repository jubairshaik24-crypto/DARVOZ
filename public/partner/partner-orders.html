<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6b00">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>DARVOZ | Partner Orders</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f6f6f7;
    color:#171717;
    min-height:100vh;
    padding-bottom:30px;
}


/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;

    background:#fff;
    color:#171717;

    min-height:72px;

    padding:12px 25px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #eee;

    box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.header-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.back-btn{
    width:42px;
    height:42px;

    border:none;
    border-radius:12px;

    background:#fff1e8;
    color:#ff6b00;

    font-size:20px;
    cursor:pointer;
}

.header-title h2{
    font-size:21px;
    font-weight:700;
}

.header-title p{
    color:#999;
    font-size:11px;
    margin-top:2px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-actions button{
    border:1px solid #eee;
    background:#fff;

    padding:10px 14px;

    border-radius:10px;

    cursor:pointer;

    font-weight:600;
    font-size:12px;
}

#soundBtn{
    color:#ff6b00;
}

.header-actions button:hover{
    border-color:#ff6b00;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}


/* =====================================================
   STATUS TABS
===================================================== */

.order-tabs{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:10px;

    background:#fff;

    padding:10px;

    border-radius:16px;

    border:1px solid #eee;

    box-shadow:0 3px 15px rgba(0,0,0,.04);

    margin-bottom:20px;

    position:sticky;

    top:72px;

    z-index:50;
}

.order-tab{

    border:none;

    background:#fafafa;

    border:1px solid #eee;

    border-radius:12px;

    padding:12px 10px;

    cursor:pointer;

    text-align:left;

    transition:.2s;
}

.order-tab:hover{
    border-color:#ff6b00;
}

.order-tab.active{

    background:#fff1e8;

    border-color:#ff6b00;

}

.order-tab-title{

    display:block;

    color:#555;

    font-size:11px;

    font-weight:600;

    margin-bottom:5px;
}

.order-tab.active .order-tab-title{
    color:#ff6b00;
}

.order-tab-count{

    font-size:21px;

    font-weight:800;

    color:#171717;
}

.order-tab.active .order-tab-count{
    color:#ff6b00;
}


/* =====================================================
   SECTION
===================================================== */

.order-section{

    margin-bottom:22px;
}

.order-section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;

    padding:0 4px;
}

.section-heading{

    display:flex;

    align-items:center;

    gap:10px;
}

.section-icon{

    width:40px;
    height:40px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#fff1e8;

    color:#ff6b00;
}

.section-heading h3{

    font-size:18px;

    font-weight:700;
}

.section-heading p{

    font-size:11px;

    color:#999;

    margin-top:2px;
}

.section-count{

    min-width:28px;
    height:28px;

    padding:0 9px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#fff1e8;

    color:#ff6b00;

    font-size:12px;

    font-weight:800;
}


/* =====================================================
   ORDER CARD
===================================================== */

.card{

    position:relative;

    background:#fff;

    padding:18px;

    border-radius:16px;

    border:1px solid #eee;

    box-shadow:0 4px 16px rgba(0,0,0,.05);

    margin-bottom:12px;

    transition:.2s;
}

.card:hover{

    transform:translateY(-1px);

    box-shadow:0 7px 22px rgba(0,0,0,.08);
}


/* =====================================================
   ORDER TOP
===================================================== */

.order-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:15px;
}

.order-number{

    display:flex;

    align-items:center;

    gap:8px;
}

.order-number h3{

    font-size:17px;

    font-weight:800;
}

.order-badge{

    padding:5px 9px;

    border-radius:20px;

    font-size:9px;

    font-weight:800;

    background:#fff1e8;

    color:#ff6b00;
}


/* =====================================================
   ORDER INFORMATION
===================================================== */

.order-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    margin-bottom:14px;
}

.order-info{

    background:#f8f8f8;

    padding:11px;

    border-radius:10px;

    min-width:0;
}

.order-info label{

    display:block;

    color:#999;

    font-size:9px;

    margin-bottom:3px;
}

.order-info span{

    display:block;

    color:#333;

    font-size:12px;

    font-weight:600;

    word-break:break-word;
}


/* =====================================================
   TOTAL
===================================================== */

.order-total{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:12px 0;

    border-top:1px solid #eee;

    border-bottom:1px solid #eee;

    margin-bottom:14px;
}

.order-total label{

    color:#777;

    font-size:12px;
}

.order-total strong{

    font-size:20px;

    font-weight:800;
}


/* =====================================================
   PAYMENT
===================================================== */

.payment{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:6px 9px;

    border-radius:8px;

    background:#eaf9ef;

    color:#198754;

    font-size:10px;

    font-weight:700;
}


/* =====================================================
   ACTIONS
===================================================== */

.actions{

    display:flex;

    gap:10px;

    margin-top:5px;
}

.actions button{

    flex:1;

    min-height:45px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:13px;

    font-weight:700;

    transition:.2s;
}

.accept{

    background:#ff6b00;

    color:#fff;
}

.accept:hover{
    background:#e85f00;
}

.reject{

    background:#fff;

    color:#dc3545;

    border:1px solid #dc3545 !important;
}

.reject:hover{

    background:#fff1f1;
}


/* =====================================================
   STATUS BUTTON
===================================================== */

.status{

    display:inline-flex;

    padding:6px 10px;

    border-radius:20px;

    background:#fff1e8;

    color:#ff6b00;

    font-size:10px;

    font-weight:800;
}


/* =====================================================
   ACCEPTED
===================================================== */

.accepted-card{

    border-left:4px solid #2563eb;
}

.accepted-card .order-badge{

    background:#eaf2ff;

    color:#2563eb;
}


/* =====================================================
   PREPARING
===================================================== */

.preparing-card{

    border-left:4px solid #7048e8;
}

.preparing-card .order-badge{

    background:#f0ebff;

    color:#7048e8;
}


/* =====================================================
   DELIVERY REACHED
===================================================== */

.reached-card{

    border-left:4px solid #ff6b00;

    background:#fffdfa;
}

.reached-card .order-badge{

    background:#fff1e8;

    color:#ff6b00;
}

.pickup-alert{

    flex:1;

    background:#fff3e8;

    border:1px solid #ffb27a;

    padding:13px;

    border-radius:10px;

    color:#333;
}

.pickup-alert strong{

    color:#ff6b00;

    font-size:13px;
}

.pickup-alert span{

    display:block;

    margin-top:3px;

    font-size:10px;

    color:#777;
}

.confirm-pickup{

    background:#ff6b00;

    color:#fff;

    padding:12px 18px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:12px;

    font-weight:700;
}

.pickup-confirmed{

    background:#e8f8ee;

    color:#198754;

    padding:11px 15px;

    border-radius:9px;

    font-size:12px;

    font-weight:700;
}


/* =====================================================
   COMPLETED
===================================================== */

.completed-card{

    border-left:4px solid #198754;

    opacity:.85;
}

.completed-card .order-badge{

    background:#e8f8ee;

    color:#198754;
}


/* =====================================================
   REJECTED
===================================================== */

.rejected-card{

    position:relative;

    overflow:hidden;

    filter:grayscale(.35);

    opacity:.8;
}

.rejected-card::after{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(255,255,255,.62);

    backdrop-filter:blur(3px);

    z-index:5;
}

.rejected-overlay{

    position:absolute;

    inset:0;

    z-index:10;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;
}

.rejected-badge{

    background:#dc3545;

    color:#fff;

    padding:12px 25px;

    border-radius:12px;

    font-size:17px;

    font-weight:800;

    box-shadow:0 5px 20px rgba(0,0,0,.2);

    transform:rotate(-4deg);
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    background:#fff;

    border:1px solid #eee;

    border-radius:16px;

    padding:45px 20px;

    text-align:center;

    color:#999;

    font-size:13px;
}

.empty i{

    display:block;

    font-size:30px;

    color:#ddd;

    margin-bottom:10px;
}

/* =====================================================
   ORDER ITEMS
===================================================== */
/* =====================================================
   ORDER ITEMS - CLEAR & BOLD
===================================================== */

.view-items-btn {
    width: 100%;
    min-height: 46px;
    border: 1px solid #ff6b00;
    background: #fff;
    color: #ff6b00;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 12px;
    transition: .2s;
}

.view-items-btn:hover {
    background: #fff1e8;
}

.order-items-box {
    background: #fafafa;
    border: 1px solid #e5e5e5;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 14px;
}

.order-items-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 10px;
    color: #171717;
}

.order-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 12px;
    padding: 13px 4px;
    border-bottom: 1px solid #e5e5e5;
}

.order-item:last-child {
    border-bottom: none;
}

.order-item-name {
    min-width: 0;
    color: #171717;
    font-size: 14px;
    font-weight: 800;
    line-height: 1.4;
    word-break: break-word;
}

.order-item-qty {
    white-space: nowrap;
    color: #555;
    font-size: 14px;
    font-weight: 800;
}

.order-item-price {
    white-space: nowrap;
    color: #171717;
    font-size: 14px;
    font-weight: 800;
}

.items-loading {
    text-align: center;
    color: #777;
    font-size: 13px;
    font-weight: 600;
    padding: 12px;
}

.items-error {
    text-align: center;
    color: #dc3545;
    font-size: 13px;
    font-weight: 700;
    padding: 12px;
}
/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    body{
        padding-bottom:20px;
    }

    header{

        min-height:62px;

        padding:10px 12px;
    }

    .header-title h2{
        font-size:17px;
    }

    .header-title p{
        font-size:9px;
    }

    .header-actions{
        gap:5px;
    }

    .header-actions button{

        padding:9px;

        font-size:0;
    }

    .header-actions button:first-child::before{

        content:"🔊";

        font-size:15px;
    }

    .header-actions button:last-child::before{

        content:"←";

        font-size:18px;
    }

    .container{

        padding:12px;
    }

    /* horizontal tabs */

    .order-tabs{

        display:flex;

        overflow-x:auto;

        gap:8px;

        padding:8px;

        top:62px;

        scrollbar-width:none;
    }

    .order-tabs::-webkit-scrollbar{
        display:none;
    }

    .order-tab{

        flex:0 0 125px;

        padding:10px;

    }

    .order-tab-title{
        font-size:10px;
    }

    .order-tab-count{
        font-size:18px;
    }

    .order-section-header{
        margin-bottom:9px;
    }

    .section-heading h3{
        font-size:15px;
    }

    .section-heading p{
        font-size:9px;
    }

    .section-icon{

        width:35px;
        height:35px;

        font-size:14px;
    }

    .section-count{

        min-width:25px;
        height:25px;

        font-size:10px;
    }

    .card{

        padding:14px;

        border-radius:14px;
    }

    .order-number h3{
        font-size:14px;
    }

    .order-badge{
        font-size:8px;
        padding:4px 7px;
    }

    .order-grid{

        grid-template-columns:1fr 1fr;

        gap:7px;
    }

    .order-info{
        padding:9px;
    }

    .order-info label{
        font-size:8px;
    }

    .order-info span{
        font-size:10px;
    }

    .order-total strong{
        font-size:17px;
    }

    .actions{

        flex-direction:column;
    }

    .actions button{

        min-height:43px;

        font-size:12px;
    }

    .pickup-alert{

        width:100%;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .order-tab{
        flex-basis:110px;
    }

    .order-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-left">

        <button
            class="back-btn"
            onclick="window.location.href='partner-dashboard.html'"
        >
            ←
        </button>

        <div class="header-title">

            <h2>Partner Orders</h2>

            <p>Manage incoming orders</p>

        </div>

    </div>


    <div class="header-actions">

        <button
            id="soundBtn"
            onclick="enableOrderSound()"
        >
            🔊 Enable Sound
        </button>

    </div>

</header>

<div class="container">


    <!-- =================================================
         ORDER TABS
    ================================================== -->

    <div class="order-tabs">

        <button class="order-tab active">

            <span class="order-tab-title">
                New Orders
            </span>

            <span
                class="order-tab-count"
                id="newOrdersCount"
            >
                0
            </span>

        </button>


        <button class="order-tab">

            <span class="order-tab-title">
                Accepted
            </span>

            <span
                class="order-tab-count"
                id="acceptedOrdersCount"
            >
                0
            </span>

        </button>


        <button class="order-tab">

            <span class="order-tab-title">
                Preparing
            </span>

            <span
                class="order-tab-count"
                id="preparingOrdersCount"
            >
                0
            </span>

        </button>


        <button class="order-tab">

            <span class="order-tab-title">
                Delivery Reached
            </span>

            <span
                class="order-tab-count"
                id="reachedOrdersCount"
            >
                0
            </span>

        </button>


        <button class="order-tab">

            <span class="order-tab-title">
                Completed
            </span>

            <span
                class="order-tab-count"
                id="completedOrdersCount"
            >
                0
            </span>

        </button>

    </div>


    <!-- =================================================
         ORDERS
    ================================================== -->

    <div id="orders">

        <div class="empty">

            Loading Orders...

        </div>

    </div>


</div>

<script src="/socket.io/socket.io.js"></script>


<script>


const API = window.location.origin;
const partner = JSON.parse(localStorage.getItem("partner"));

if (!partner) {
    window.location.href = "partner-login.html";
}

const partnerId = partner.id;


let activeOrderTab = "new";
let currentOrders = [];
let currentOrderGroups = {
    new: [],
    accepted: [],
    preparing: [],
    reached: [],
    completed: [],
    rejected: []
};
// =====================================================
// SOCKET.IO
// =====================================================

const socket = io(API);

socket.on("connect", () => {

    console.log(
        "✅ Partner Socket Connected:",
        socket.id
    );

    socket.emit(
        "joinPartner",
        partnerId
    );

    console.log(
        "Joined:",
        `partner_${partnerId}`
    );

});
 // =====================================================
// DARVOZ PARTNER NOTIFICATION + SOUND
// =====================================================

const newOrderSound = new Audio("/partner/sounds/notification.mp3");
newOrderSound.preload = "auto";
newOrderSound.volume = 1.0;


// =====================================================
// ENABLE DARVOZ ORDER SOUND
// =====================================================

let soundEnabled = false;

async function enableOrderSound() {

    try {

        newOrderSound.currentTime = 0;

        await newOrderSound.play();

        newOrderSound.pause();

        newOrderSound.currentTime = 0;

        soundEnabled = true;

        const soundBtn =
            document.getElementById("soundBtn");

        if (soundBtn) {

            soundBtn.innerText =
                "🔊 Sound ON";

            soundBtn.style.background =
                "#28a745";

            soundBtn.style.color =
                "white";
        }

        console.log(
            "✅ DARVOZ ORDER SOUND ENABLED"
        );

    } catch (error) {

        console.error(
            "❌ Unable to enable order sound:",
            error
        );

    }
}

async function showNewOrderAlert(order) {

    // 🔊 Play ringing sound
if (soundEnabled) {
    try {
        for (let i = 0; i < 3; i++) {
            newOrderSound.currentTime = 0;

            await newOrderSound.play();

            await new Promise(resolve => {
                newOrderSound.onended = resolve;
            });
        }

        console.log("🔊 DARVOZ ORDER RING PLAYED 3 TIMES");

    } catch (error) {
        console.warn("⚠️ Sound playback failed:", error);
    }
} else {
    console.warn("⚠️ ORDER SOUND IS OFF");
}

    // 🔔 Browser / mobile notification
    if ("Notification" in window) {

        if (Notification.permission === "default") {
            try {
                await Notification.requestPermission();
            } catch (error) {
                console.warn(
                    "Notification permission error:",
                    error
                );
            }
        }

        if (Notification.permission === "granted") {

            const notification =
                new Notification(
                    "🍽️ DARVOZ Partner",
                    {
                        body:
                            `New Order #${order.id}\n` +
                            `Customer: ${order.customer_name || "-"}\n` +
                            `Total: ₹${order.grand_total || 0}`,

                        icon:
                            "/partner/icons/partner-notification.png",

                        badge:
                            "/partner/icons/partner-notification.png",

                        tag:
                            `darvoz-order-${order.id}`,

                        requireInteraction: true
                    }
                );

            notification.onclick = function () {

                window.focus();

                notification.close();

                const orderElement =
                    document.getElementById("orders");

                if (orderElement) {
                    orderElement.scrollIntoView({
                        behavior: "smooth"
                    });
                }

            };

            console.log(
                "🔔 NEW ORDER NOTIFICATION SHOWN"
            );
        }
    }
}
// =====================================================
// NEW ORDER NOTIFICATION
// =====================================================

socket.on("newOrder", async (data) => {

    console.log("🔥🔥🔥 NEW ORDER RECEIVED 🔥🔥🔥");
    console.log("Order:", data);

    if (!data || !data.id) {
        console.warn(
            "⚠️ Invalid newOrder data:",
            data
        );
        return;
    }

    // 🔔 Notification + 🔊 Ring
    await showNewOrderAlert(data);

    // 🔄 Refresh orders without page reload
    console.log(
        "🔄 Refreshing partner orders..."
    );

    loadOrders();

});


socket.on(
    "riderReachedRestaurant",
    (data) => {

        console.log(
            "🚴 RIDER REACHED RESTAURANT:",
            data
        );

        if (!data || !data.orderId) {

            return;

        }

        loadOrders();

    }
);

socket.on(
    "orderStatusUpdated",
    (data) => {

        console.log(
            "📦 PARTNER ORDER STATUS:",
            data
        );

        if (!data || !data.orderId) {

            return;

        }

        if (
            data.status ===
            "Picked Up"
        ) {

            loadOrders();

        }

    }
);

async function loadOrders(){

    console.log("================================");
    console.log("DARVOZ PARTNER ORDERS");
    console.log("API:", API);
    console.log("Partner ID:", partnerId);
    console.log("URL:", `${API}/partner-orders/${partnerId}`);
    console.log("================================");


    try{

        const response = await fetch(
            `${API}/partner-orders/${partnerId}`
        );


        const text = await response.text();


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}: ${text}`
            );

        }


        const orders = JSON.parse(text);

        currentOrders = orders;


        console.log("ORDERS:",orders);


        if(!Array.isArray(orders)){

            throw new Error(
                "Invalid orders response"
            );

        }


        const groups = {

            new:[],
            accepted:[],
            preparing:[],
            reached:[],
            completed:[],
            rejected:[]

        };


        orders.forEach(order => {

            const status =
                String(
                    order.status || ""
                )
                .trim()
                .toLowerCase();


            const partnerResponse =
                String(
                    order.partner_response || ""
                )
                .trim()
                .toLowerCase();


            const deliveryStatus =
                String(
                    order.delivery_status || ""
                )
                .trim()
                .toLowerCase()
                .replace(/[\s\_-]+/g,"");


            const rejected =
                status === "rejected" ||
                partnerResponse === "rejected";


            const reached =
                deliveryStatus ===
                "reachedrestaurant";


            const completed =
                deliveryStatus === "delivered" ||
                deliveryStatus === "completed" ||
                status === "delivered" ||
                status === "completed";


            const preparing =
                status === "preparing" ||
                status === "ready" ||
                status === "food preparing";


            const accepted =
                status === "accepted" ||
                status === "confirmed" ||
                status === "accepted by partner";


            if(rejected){

                groups.rejected.push(order);

            }
            else if(completed){

                groups.completed.push(order);

            }
            else if(reached){

                groups.reached.push(order);

            }
            else if(preparing){

                groups.preparing.push(order);

            }
            else if(accepted){

                groups.accepted.push(order);

            }
            else{

                groups.new.push(order);

            }

        });


        currentOrderGroups = groups;

updateOrderCounts(groups);

renderActiveOrderTab();

    }


    catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        document.getElementById("orders").innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-circle-exclamation"></i>

                Unable to load orders

                <br><br>

                <small>
                    ${error.message}
                </small>

            </div>

        `;

    }

}

function updateOrderCounts(groups){

    const counts = {

        newOrdersCount:
            groups.new.length,

        acceptedOrdersCount:
            groups.accepted.length,

        preparingOrdersCount:
            groups.preparing.length,

        reachedOrdersCount:
            groups.reached.length,

        completedOrdersCount:
            groups.completed.length

    };


    Object.entries(counts).forEach(
        ([id,value]) => {

            const element =
                document.getElementById(id);

            if(element){

                element.textContent =
                    value;

            }

        }
    );

}

function getOrderTabName(tab) {

    const names = {
        new: "New Orders",
        accepted: "Accepted Orders",
        preparing: "Preparing Orders",
        reached: "Delivery Reached",
        completed: "Completed Orders",
        rejected: "Rejected Orders"
    };

    return names[tab] || "Orders";
}

function renderActiveOrderTab(){

    const container =
        document.getElementById("orders");

    if(!container){
        return;
    }

    const orders =
        currentOrderGroups[activeOrderTab] || [];

    if(!orders.length){

        container.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-box-open"></i>

                No ${getOrderTabName(activeOrderTab)}
                Available

            </div>

        `;

        return;
    }

    let icon = "🔔";
    let title = "New Orders";
    let subtitle =
        "Orders waiting for your confirmation";

    if(activeOrderTab === "accepted"){

        icon = "✓";
        title = "Accepted Orders";
        subtitle =
            "Orders you have accepted";

    }

    else if(activeOrderTab === "preparing"){

        icon = "🍳";
        title = "Preparing Orders";
        subtitle =
            "Orders currently being prepared";

    }

    else if(activeOrderTab === "reached"){

        icon = "🚴";
        title = "Delivery Reached";
        subtitle =
            "Delivery partner has arrived at the restaurant";

    }

    else if(activeOrderTab === "completed"){

        icon = "✓";
        title = "Completed Orders";
        subtitle =
            "Successfully completed orders";

    }

    container.innerHTML =
        renderOrderSection(
            activeOrderTab,
            icon,
            title,
            subtitle,
            orders
        );

}

function renderOrderSection(
    type,
    icon,
    title,
    subtitle,
    orders
){

    if(!orders.length){

        return "";

    }


    let cards = "";


    orders.forEach(order => {

        cards += renderOrderCard(
            order,
            type
        );

    });


    return `

        <section class="order-section">

            <div class="order-section-header">

                <div class="section-heading">

                    <div class="section-icon">
                        ${icon}
                    </div>

                    <div>

                        <h3>
                            ${title}
                        </h3>

                        <p>
                            ${subtitle}
                        </p>

                    </div>

                </div>


                <div class="section-count">

                    ${orders.length}

                </div>

            </div>


            ${cards}

        </section>

    `;

}

function renderOrderCard(order,type){

    const orderId =
        order.id;


    const customer =
        order.customer_name || "-";


    const mobile =
        order.mobile || "-";


    const restaurant =
        order.restaurant_name || "-";


    const address =
        order.address || "-";


    const total =
        Number(
            order.grand_total || 0
        );


    const status =
        order.status || "Pending";


    const payment =
        String(
            order.payment || ""
        )
        .trim()
        .toUpperCase();


    const paymentText =
        payment === "COD" ||
        payment === "CASH" ||
        payment === "CASH ON DELIVERY"
            ? "COD Payment"
            : "UPI Payment";


    const paymentIcon =
        payment === "COD" ||
        payment === "CASH" ||
        payment === "CASH ON DELIVERY"
            ? "💵"
            : "💳";


    let badge =
        "NEW";


    if(type === "accepted"){
        badge = "ACCEPTED";
    }

    if(type === "preparing"){
        badge = "PREPARING";
    }

    if(type === "reached"){
        badge = "DELIVERY REACHED";
    }

    if(type === "completed"){
        badge = "COMPLETED";
    }

    if(type === "rejected"){
        badge = "REJECTED";
    }


    const cardClass =

        type === "accepted"
            ? "accepted-card"

        : type === "preparing"
            ? "preparing-card"

        : type === "reached"
            ? "reached-card"

        : type === "completed"
            ? "completed-card"

        : type === "rejected"
            ? "rejected-card"

        : "";


    const deliveryStatus =
        String(
            order.delivery_status || ""
        )
        .trim()
        .toLowerCase()
        .replace(/[\s\_-]+/g,"");


    const riderReached =
        deliveryStatus ===
        "reachedrestaurant";


    const pickedUp =
        deliveryStatus ===
        "pickedup";


    let actions = "";


    /* NEW ORDER */

    if(type === "new"){

        actions = `

            <div class="actions">

                <button
                    class="reject"
                    onclick="rejectOrder(${orderId})"
                >
                    ❌ Reject Order
                </button>


                <button
                    class="accept"
                    onclick="acceptOrder(${orderId})"
                >
                    ✓ Accept Order
                </button>

            </div>

        `;

    }


    /* DELIVERY REACHED */

    else if(type === "reached"){

        actions = `

            <div class="actions">

                <div class="pickup-alert">

                    🚴
                    <strong>
                        Delivery Partner Arrived
                    </strong>

                    <span>
                        Rider is waiting at the restaurant.
                    </span>

                </div>


                <button
                    class="confirm-pickup"
                    onclick="confirmPickup(event,${orderId})"
                >
                    📦 Confirm Pickup
                </button>

            </div>

        `;

    }


    /* OTHER ORDERS */

    else if(type !== "rejected"){

        actions = `

            <div class="actions">

                <div class="status">

                    ${status}

                </div>

                ${
                    pickedUp
                    ? `
                        <div class="pickup-confirmed">

                            ✓ Pickup Confirmed

                        </div>
                    `
                    : ""
                }

            </div>

        `;

    }


    /* REJECTED OVERLAY */

    const rejectedOverlay =

        type === "rejected"

        ? `

            <div class="rejected-overlay">

                <div class="rejected-badge">

                    ❌ ORDER REJECTED

                </div>

            </div>

        `

        : "";

const itemsButton = `

`;

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

// =====================================================
// VIEW / HIDE ORDER ITEMS
// =====================================================

async function toggleOrderItems(event, orderId) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    const container =
        document.getElementById(
            `orderItems_${orderId}`
        );

    const button =
        document.querySelector(
            `[data-items-order-id="${orderId}"]`
        );

    if (!container || !button) {
        return;
    }

    // =========================================
    // HIDE
    // =========================================

    if (container.style.display === "block") {

        container.style.display = "none";

        button.innerHTML =
            "👀 View Items";

        return;
    }

    // =========================================
    // SHOW LOADING
    // =========================================

    container.style.display = "block";

    container.innerHTML = `

        <div class="items-loading">
            🔄 Loading items...
        </div>

    `;

    button.innerHTML =
        "⏳ Loading...";

    try {

        const response = await fetch(

            `${API}/partner-orders/order/${orderId}`,

            {
                cache: "no-store"
            }

        );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to load order items."
            );

        }

        const items =
            Array.isArray(data.items)
                ? data.items
                : [];

        // =========================================
        // NO ITEMS
        // =========================================

        if (items.length === 0) {

            container.innerHTML = `

                <div class="items-loading">
                    No items found for this order.
                </div>

            `;

            button.innerHTML =
                "▲ Hide Items";

            return;
        }

        // =========================================
        // CALCULATE ITEMS TOTAL
        // =========================================

        let itemsTotal = 0;

        let itemsHTML = "";

        items.forEach(item => {

            const price =
                Number(item.price || 0);

            const qty =
                Number(item.qty || 0);

            const lineTotal =
                price * qty;

            itemsTotal += lineTotal;

            itemsHTML += `

                <div class="order-item">

                    <div class="order-item-name">
                        ${escapeHTML(
                            item.product_name || "Item"
                        )}
                    </div>

                    <div class="order-item-qty">
                        × ${qty}
                    </div>

                    <div class="order-item-price">
                        ₹${lineTotal.toFixed(2)}
                    </div>

                </div>

            `;

        });

        // =========================================
        // RENDER
        // =========================================

        container.innerHTML = `

            <div class="order-items-title">

                🛒

                <span>
                    Ordered Items (${items.length})
                </span>

            </div>

            ${itemsHTML}

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    margin-top:10px;
                    padding-top:10px;
                    border-top:1px solid #ddd;
                    font-size:12px;
                "
            >

                <strong>
                    Items Total
                </strong>

                <strong>
                    ₹${itemsTotal.toFixed(2)}
                </strong>

            </div>

        `;

        button.innerHTML =
            "▲ Hide Items";

    }
    catch (error) {

        console.error(
            "ORDER ITEMS ERROR:",
            error
        );

        container.innerHTML = `

            <div class="items-error">

                ❌
                ${escapeHTML(
                    error.message ||
                    "Unable to load items."
                )}

            </div>

        `;

        button.innerHTML =
            "🔄 Try Again";

    }

}

// =====================================================
// ORDER TAB FILTER
// =====================================================

document.querySelectorAll(".order-tab").forEach(tab => {

    tab.addEventListener("click", function(){

        const tabs = [
            "new",
            "accepted",
            "preparing",
            "reached",
            "completed"
        ];

        const index =
            Array.from(
                document.querySelectorAll(".order-tab")
            ).indexOf(this);

        activeOrderTab =
            tabs[index] || "new";

        document.querySelectorAll(".order-tab")
            .forEach(item => {
                item.classList.remove("active");
            });

        this.classList.add("active");

        renderActiveOrderTab();

    });

});

async function updateStatus(id, status) {

    console.log(
        "Updating order:",
        id,
        "Status:",
        status
    );

    try {

        const response = await fetch(
            `${API}/partner-orders/status/${id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );

        const data = await response.json();

        console.log(
            "STATUS UPDATE RESPONSE:",
            data
        );

        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Unable to update order status."
            );

            return;

        }

        await loadOrders();

    }

    catch(error) {

        console.error(
            "STATUS UPDATE ERROR:",
            error
        );

        alert(
            "Server error while updating order."
        );

    }

}

loadOrders();
// =====================================================
// ACCEPT ORDER
// =====================================================

async function acceptOrder(orderId) {
  const confirmAccept = confirm("Accept this order?");
  if (!confirmAccept) return;

  try {
    const response = await fetch(
      `${API}/partner-orders/partner-accept/${orderId}`,
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          partnerId: Number(partnerId)
        })
      }
    );

    const data = await response.json();

    console.log("ACCEPT RESPONSE:", data);

    if (!response.ok || !data.success) {
      alert(data.message || "Unable to accept order.");
      return;
    }

    alert("✅ Order Accepted");
    await loadOrders();

  } catch (error) {
    console.error("ACCEPT ERROR:", error);
    alert("Server error while accepting order.");
  }
}

// =====================================================
// REJECT ORDER
// =====================================================

async function rejectOrder(orderId) {

    const confirmReject = confirm(
        "Are you sure you want to reject this order?\n\n" +
        "After rejection, you cannot accept this order again."
    );

    if (!confirmReject) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/partner-orders/reject/${orderId}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    partnerId: partnerId
                })
            }
        );

        const data = await response.json();

        console.log(
            "REJECT RESPONSE:",
            data
        );

        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Unable to reject order."
            );

            return;
        }

        alert(
            "❌ Order rejected.\n\n" +
            "Admin has been notified."
        );

        await loadOrders();

    }
    catch(error) {

        console.error(
            "REJECT ERROR:",
            error
        );

        alert(
            "Server error while rejecting order."
        );

    }

}
