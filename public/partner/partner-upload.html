<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>DARVOZ | Complete Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#fff8f2;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:30px;

}

.container{

width:100%;
max-width:700px;

background:white;

padding:40px;

border-radius:25px;

box-shadow:0 15px 45px rgba(0,0,0,.12);

}

h1{

font-size:34px;

margin-bottom:10px;

}

p{

color:#666;

margin-bottom:30px;

}

.input-group{

margin-bottom:22px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

}

input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:12px;

font-size:16px;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:14px;

background:#ff6b00;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

margin-top:15px;

}

button:hover{

background:#e45e00;

}

.preview{

width:120px;
height:120px;

border-radius:15px;

border:2px dashed #ccc;

display:flex;

justify-content:center;

align-items:center;

margin-top:12px;

overflow:hidden;

}

.preview img{

width:100%;
height:100%;

object-fit:cover;

}

</style>

</head>

<body>

<div class="container">

<h1>

Upload Business Details

</h1>

<p>

Almost done. Upload your shop images.

</p>

<div class="input-group">

<label>

Shop Logo

</label>

<input

type="file"

id="logo"

accept="image/*"

onchange="previewLogo(event)">

<div class="preview">

<img id="logoPreview">

</div>

</div>

<div class="input-group">

<label>

Shop Banner

</label>

<input

type="file"

id="banner"

accept="image/*"

onchange="previewBanner(event)">

<div class="preview">

<img id="bannerPreview">

</div>

</div>

<div class="input-group">

<label>

Opening Time

</label>

<input

type="time"

id="opening">

</div>

<div class="input-group">

<label>

Closing Time

</label>

<input

type="time"

id="closing">

</div>

<button onclick="registerPartner()">

Complete Registration

</button>

</div>

<script>

function previewLogo(e){

document.getElementById("logoPreview").src=

URL.createObjectURL(e.target.files[0]);

}

function previewBanner(e){

document.getElementById("bannerPreview").src=

URL.createObjectURL(e.target.files[0]);

}

async function registerPartner(){

const formData=new FormData();

formData.append(

"businessType",

localStorage.getItem("businessType")

);

formData.append(

"restaurant_name",

localStorage.getItem("restaurant_name")

);

formData.append(

"owner_name",

localStorage.getItem("owner_name")

);

formData.append(

"mobile",

localStorage.getItem("mobile")

);

formData.append(

"email",

localStorage.getItem("email")

);

formData.append(

"password",

localStorage.getItem("password")

);

formData.append(

"house",

localStorage.getItem("house")

);

formData.append(

"street",

localStorage.getItem("street")

);

formData.append(

"area",

localStorage.getItem("area")

);

formData.append(

"city",

localStorage.getItem("city")

);

formData.append(

"state",

localStorage.getItem("state")

);

formData.append(

"pincode",

localStorage.getItem("pincode")

);

formData.append(

"latitude",

localStorage.getItem("latitude")

);

formData.append(

"longitude",

localStorage.getItem("longitude")

);

formData.append(

"opening",

document.getElementById("opening").value

);

formData.append(

"closing",

document.getElementById("closing").value

);

const logo=

document.getElementById("logo").files[0];

const banner=

document.getElementById("banner").files[0];

if(logo){

formData.append(

"logo",

logo

);

}

if(banner){

formData.append(

"banner",

banner

);

}

const response = await fetch(
`${API}/restaurant/register`,
{
method:"POST",
body:formData
}
);

const text = await response.text();

console.log("Server Response:", text);

try{
    const result = JSON.parse(text);

    if(result.success){

        alert("Registration Successful\n\nPartner ID : " + result.partnerId);

        localStorage.clear();

        window.location = "partner-login.html";

    }else{

        alert(result.message);

    }

}catch(e){

    alert("Server Error. Check Node.js terminal.");

    console.log(text);

}



}

</script>

</body>

</html>
