<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6b00">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Edit Product | DARVOZ</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f5f5;
}

.container{

width:500px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);

}

h2{

text-align:center;
color:#ff6b00;
margin-bottom:25px;

}

label{

display:block;
margin-top:15px;
font-weight:600;

}

input, textarea, select{

width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;

}

textarea{

height:100px;
resize:none;

}

button{

width:100%;
padding:14px;
margin-top:25px;
background:#ff6b00;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#e55a00;

}

</style>

</head>

<body>

<div class="container">

<h2>✏ Edit Product</h2>

<label>Category</label>


<select id="category">

    <option value="Biryani">Biryani</option>
    <option value="Starters">Starters</option>
    <option value="Breads">Breads</option>
    <option value="Rice">Rice</option>
    <option value="Desserts">Desserts</option>
    <option value="Beverages">Beverages</option>
    <option value="Other">Other</option>

</select>

<label>Product Name</label>

<input
type="text"
id="product_name">



<label>Price</label>

<input
type="number"
id="price">

<label>Product Photo</label>

<button
    type="button"
    id="choosePhotoButton"
    onclick="openPhotoChooser()"
    style="
        background:#ff6b00;
        color:white;
        border:none;
        width:100%;
        padding:14px;
        border-radius:10px;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
    "
>
    📷 Upload Product Photo
</button>

<!-- Camera -->
<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    style="display:none"
>

<!-- Gallery -->
<input
    type="file"
    id="galleryInput"
    accept="image/*"
    style="display:none"
>

<small
    id="imageStatus"
    style="
        display:block;
        margin-top:8px;
        color:#777;
    "
></small>

<img
    id="imagePreview"
    alt="Product preview"
    style="
        display:none;
        width:140px;
        height:140px;
        object-fit:contain;
        margin-top:12px;
        border:1px solid #ddd;
        border-radius:10px;
        padding:6px;
    "
>

<button id="updateButton" onclick="updateProduct()">

Update Product

</button>

</div>
<script>

const API = "/partner";

const id =
    new URLSearchParams(
        window.location.search
    ).get("id");

let savedImageUrl = "";
let productType = "Veg";
let selectedProductFile = null;
async function loadProduct(){

    const response = await fetch(
        `${API}/product/${id}`
    );

    const product = await response.json();

    document.getElementById("category").value =
        product.category || "";

    document.getElementById("product_name").value =
        product.product_name || "";

    

    document.getElementById("price").value =
        product.price || "";

    productType =
        product.type || "Veg";

    savedImageUrl =
        product.image || "";

    if(savedImageUrl){

        const preview =
            document.getElementById("imagePreview");

        preview.src = savedImageUrl;
        preview.style.display = "block";
    }
}

loadProduct();
function openPhotoChooser() {

    const choice =
        document.createElement("div");

    choice.style.position = "fixed";
    choice.style.left = "0";
    choice.style.right = "0";
    choice.style.bottom = "0";
    choice.style.background = "#fff";
    choice.style.padding = "20px";
    choice.style.zIndex = "99999";
    choice.style.boxShadow =
        "0 -5px 25px rgba(0,0,0,.2)";
    choice.style.borderRadius =
        "20px 20px 0 0";

    choice.innerHTML = `

        <h3 style="
            margin-bottom:15px;
            text-align:center;
        ">
            Upload Product Photo
        </h3>

        <button
            type="button"
            id="takePhotoBtn"
            style="
                width:100%;
                padding:14px;
                margin:5px 0;
                border:0;
                border-radius:10px;
                background:#ff6b00;
                color:white;
                font-size:16px;
                font-weight:600;
            "
        >
            📷 Take Photo
        </button>

        <button
            type="button"
            id="galleryBtn"
            style="
                width:100%;
                padding:14px;
                margin:5px 0;
                border:1px solid #ddd;
                border-radius:10px;
                background:white;
                color:#333;
                font-size:16px;
                font-weight:600;
            "
        >
            🖼️ Choose from Gallery
        </button>

        <button
            type="button"
            id="cancelPhotoBtn"
            style="
                width:100%;
                padding:14px;
                margin-top:8px;
                border:0;
                border-radius:10px;
                background:#eee;
                color:#333;
                font-size:16px;
            "
        >
            Cancel
        </button>

    `;

    document.body.appendChild(choice);


    // CAMERA
    document
        .getElementById("takePhotoBtn")
        .onclick = function () {

            choice.remove();

            document
                .getElementById("cameraInput")
                .click();
        };


    // GALLERY
    document
        .getElementById("galleryBtn")
        .onclick = function () {

            choice.remove();

            document
                .getElementById("galleryInput")
                .click();
        };


    // CANCEL
    document
        .getElementById("cancelPhotoBtn")
        .onclick = function () {

            choice.remove();
        };
}

document
    .getElementById("cameraInput")
    .addEventListener(
        "change",
        function(){

            handleSelectedImage(
                this.files[0]
            );

        }
    );


document
    .getElementById("galleryInput")
    .addEventListener(
        "change",
        function(){

            handleSelectedImage(
                this.files[0]
            );

        }
    );
function handleSelectedImage(file) {

    if (!file) {
        return;
    }

    if (!file.type.startsWith("image/")) {

        alert("Please select an image.");
        return;
    }

    if (file.size > 5 * 1024 * 1024) {

        alert("Image must be smaller than 5 MB.");
        return;
    }

    // IMPORTANT:
    // Save the actual camera/gallery file
    selectedProductFile = file;

    const preview =
        document.getElementById("imagePreview");

    const url =
        URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

    document.getElementById(
        "imageStatus"
    ).textContent =
        "✅ Photo selected. Tap Update Product to upload.";
}
async function uploadProductPhoto() {

    // No new image selected
    // Keep existing image
    if (!selectedProductFile) {

        return savedImageUrl;
    }

    document.getElementById(
        "imageStatus"
    ).textContent =
        "⏳ Enhancing product photo...";

    const formData =
        new FormData();

    // IMPORTANT:
    // Backend expects productUpload.single("image")
    formData.append(
        "image",
        selectedProductFile
    );

    const response =
        await fetch(
            `${API}/upload-product-image`,
            {
                method: "POST",
                body: formData
            }
        );

    const result =
        await response.json();

    if (
        !response.ok ||
        !result.success
    ) {

        throw new Error(
            result.message ||
            "Image upload failed"
        );
    }

    // Save Cloudinary URL
    savedImageUrl =
        result.imageUrl;

    const preview =
        document.getElementById(
            "imagePreview"
        );

    preview.src =
        savedImageUrl;

    preview.style.display =
        "block";

    document.getElementById(
        "imageStatus"
    ).textContent =
        "✅ AI-enhanced product photo ready.";

    return savedImageUrl;
}

async function updateProduct(){

    const button =
        document.getElementById(
            "updateButton"
        );

    try{

        button.disabled = true;

        button.textContent =
            "Saving...";

        /*
         * Upload camera/gallery image first.
         * The backend removes the background automatically.
         */
        const image =
            await uploadProductPhoto();

        const data = {

            category:
                document.getElementById(
                    "category"
                ).value,

            product_name:
                document.getElementById(
                    "product_name"
                ).value,

            /*
             * Your partner.js food update route requires type.
             */
            type:
                productType,

            

            price:
                document.getElementById(
                    "price"
                ).value,

            image:
                image,

            offer_price: null,

            featured: 0
        };

        /*
         * Correct route from your partner.js:
         * router.put("/product/:id", ...)
         */
        const response = await fetch(
            `${API}/product/${id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(data)
            }
        );

        const result =
            await response.json();

        if(!result.success){
            throw new Error(
                result.message ||
                "Product update failed"
            );
        }

        alert(
            "Product updated successfully"
        );

        window.location.href =
            "my-products.html";

    } catch(error){

        console.error(error);

        alert(
            error.message ||
            "Unable to update product"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "Update Product";
    }
}


if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker.register(
                "/service-worker.js"
            );

        }
    );
}

</script>
</body>
</html>
