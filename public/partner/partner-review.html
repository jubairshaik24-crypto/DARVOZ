<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARVOZ | Review</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#ececec;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:390px;
min-height:100vh;
background:#fff;
box-shadow:0 0 35px rgba(0,0,0,.12);
}

.header{
padding:20px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.back{
width:42px;
height:42px;
border-radius:50%;
background:#fff3eb;
display:flex;
justify-content:center;
align-items:center;
color:#ff6b00;
cursor:pointer;
}

.form{
padding:22px;
}

.progress{
height:8px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
}

.progress div{
width:100%;
height:100%;
background:#ff6b00;
}

.step{
color:#ff6b00;
font-weight:600;
font-size:14px;
}

.title{
font-size:28px;
font-weight:800;
margin:10px 0;
}

.card{

background:#fafafa;

border-radius:18px;

padding:18px;

margin-bottom:18px;

border:1px solid #eee;

}

.card h3{

margin-bottom:10px;

color:#ff6b00;

}

.card p{

margin:6px 0;

font-size:15px;

color:#444;

}

.submit-btn{

width:100%;

height:56px;

border:none;

border-radius:18px;

background:#ff6b00;

color:#fff;

font-size:18px;

font-weight:700;

cursor:pointer;

margin-top:20px;

}

</style>

</head>
<body>

<div class="app">

<div class="header">

<div class="back" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</div>

<h2>Review & Submit</h2>

</div>

<div class="form">

<div class="progress">
<div></div>
</div>

<div class="step">
Step 5 of 5
</div>

<div class="title">
Review Your Details
</div>

<!-- Business -->

<div class="card">

<h3>🏪 Business Details</h3>

<p><b>Business:</b> <span id="business"></span></p>

<p><b>Owner:</b> <span id="owner"></span></p>

<p><b>Mobile:</b> <span id="mobile"></span></p>

<p><b>Email:</b> <span id="email"></span></p>

<p><b>Categories:</b> <span id="category"></span></p>

</div>

<!-- Address -->

<div class="card">

<h3>📍 Address</h3>

<p id="address"></p>

<p id="city"></p>

<p id="state"></p>

<p id="pincode"></p>

</div>

<!-- Documents -->

<div class="card">

<h3>📄 Documents</h3>

<p><b>Store Photo:</b> <span id="storePhoto"></span></p>

<p><b>Logo:</b> <span id="logo"></span></p>

<p><b>FSSAI:</b> <span id="fssai"></span></p>

<p><b>GST:</b> <span id="gst"></span></p>

</div>

<!-- Bank -->

<div class="card">

<h3>🏦 Bank Details</h3>

<p><b>Account Holder:</b> <span id="accountName"></span></p>

<p><b>Bank:</b> <span id="bankName"></span></p>

<p><b>Account No:</b> <span id="accountNumber"></span></p>

<p><b>IFSC:</b> <span id="ifsc"></span></p>

<p><b>UPI:</b> <span id="upi"></span></p>

</div>

<button class="submit-btn" onclick="submitApplication()">

Submit Application

</button>

</div>

</div>

<script>

// Business

document.getElementById("business").innerHTML=
localStorage.getItem("businessName")||"-";

document.getElementById("owner").innerHTML=
localStorage.getItem("ownerName")||"-";

document.getElementById("mobile").innerHTML=
localStorage.getItem("mobile")||"-";

document.getElementById("email").innerHTML=
localStorage.getItem("email")||"-";

document.getElementById("category").innerHTML=
localStorage.getItem("business_type")||"-";

// Address

document.getElementById("address").innerHTML=
localStorage.getItem("address")||"-";

document.getElementById("city").innerHTML=
localStorage.getItem("city")||"-";

document.getElementById("state").innerHTML=
localStorage.getItem("state")||"-";

document.getElementById("pincode").innerHTML=
localStorage.getItem("pincode")||"-";

// Documents

document.getElementById("storePhoto").innerHTML =
localStorage.getItem("storePhoto") ? "✅ Uploaded" : "Not Uploaded";

document.getElementById("logo").innerHTML =
localStorage.getItem("logo") ? "✅ Uploaded" : "Not Uploaded";

document.getElementById("fssai").innerHTML =
localStorage.getItem("fssai") ? "✅ Uploaded" : "Not Uploaded";

document.getElementById("gst").innerHTML =
localStorage.getItem("gst") ? "✅ Uploaded" : "Not Uploaded";

// Bank

document.getElementById("accountName").innerHTML=
localStorage.getItem("accountName")||"-";

document.getElementById("bankName").innerHTML=
localStorage.getItem("bankName")||"-";

document.getElementById("accountNumber").innerHTML=
localStorage.getItem("accountNumber")||"-";

document.getElementById("ifsc").innerHTML=
localStorage.getItem("ifsc")||"-";

document.getElementById("upi").innerHTML=
localStorage.getItem("upi")||"-";

async function submitApplication() {

    const data = {

        businessType: localStorage.getItem("business_type"),
        restaurant_name: localStorage.getItem("businessName"),
        owner_name: localStorage.getItem("ownerName"),
        mobile: localStorage.getItem("mobile"),
        email: localStorage.getItem("email"),
        password: localStorage.getItem("password"),
        address: localStorage.getItem("address"),
        city: localStorage.getItem("city"),
        state: localStorage.getItem("state"),
        pincode: localStorage.getItem("pincode"),
        latitude: localStorage.getItem("latitude"),
        longitude: localStorage.getItem("longitude"),
        storePhoto: localStorage.getItem("storePhoto"),
        logo: localStorage.getItem("logo"),
        fssai: localStorage.getItem("fssai"),
        gst: localStorage.getItem("gst"),
        account_holder: localStorage.getItem("accountName"),
        bank_name: localStorage.getItem("bankName"),
        account_number: localStorage.getItem("accountNumber"),
        ifsc: localStorage.getItem("ifsc"),
        upi: localStorage.getItem("upi")

    };

    console.log(data);

    try {

        const response = await fetch(`${window.location.origin}/partner/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        console.log(result);

        if (result.success) {

            localStorage.setItem("partnerId", result.partnerId);
            window.location.href = "partner-success.html";

        } else {

            alert(result.message);

        }

    } catch (err) {

        console.error(err);
        alert("Server Error");

    }

}
</script>

</body>

</html>
