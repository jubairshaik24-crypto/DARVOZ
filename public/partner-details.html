<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARVOZ | Partner Details</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#fff8f2;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:30px;
}

.container{

width:100%;
max-width:700px;

background:white;

padding:45px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.10);

}

.progress{

display:flex;
justify-content:space-between;
margin-bottom:40px;

}

.step{

width:45px;
height:45px;

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

font-weight:bold;

background:#eee;

}

.active{

background:#ff6b00;
color:white;

}

h1{

font-size:36px;

margin-bottom:10px;

}

.subtitle{

color:#666;

margin-bottom:30px;

font-size:17px;

}

.business{

display:inline-block;

background:#fff3eb;

color:#ff6b00;

padding:10px 18px;

border-radius:30px;

font-weight:700;

margin-bottom:25px;

}

.input-group{

margin-bottom:18px;

}

label{

display:block;

font-weight:600;

margin-bottom:8px;

}

input{

width:100%;

padding:15px;

border:1px solid #ddd;

border-radius:12px;

font-size:16px;

outline:none;

}

input:focus{

border-color:#ff6b00;

}

.buttons{

margin-top:30px;

display:flex;

justify-content:space-between;

}

.back{

background:#ddd;

color:#333;

}

.next{

background:#ff6b00;

color:white;

}

button{

padding:15px 35px;

border:none;

border-radius:12px;

font-size:17px;

font-weight:700;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div class="progress">

<div class="step active">1</div>
<div class="step active">2</div>
<div class="step">3</div>
<div class="step">4</div>
<div class="step">5</div>

</div>

<h1>Business Details</h1>

<p class="subtitle">

Enter your business information.

</p>

<div class="business" id="businessType">

Restaurant

</div>

<div class="input-group">

<label>Business Name</label>

<input
type="text"
id="restaurant_name"
placeholder="Enter Business Name">

</div>

<div class="input-group">

<label>Owner Name</label>

<input
type="text"
id="owner_name"
placeholder="Enter Owner Name">

</div>

<div class="input-group">

<label>Mobile Number</label>

<input
type="tel"
id="mobile"
placeholder="10 Digit Mobile Number">

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter Email">

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create Password">

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

</div>

<div class="buttons">

<button
class="back"
onclick="history.back()">

Back

</button>

<button
class="next"
onclick="nextStep()">

Continue

</button>

</div>

</div>

<script>

document.getElementById("businessType").innerHTML =
localStorage.getItem("businessType");

function nextStep(){

const restaurant_name =
document.getElementById("restaurant_name").value.trim();

const owner_name =
document.getElementById("owner_name").value.trim();

const mobile =
document.getElementById("mobile").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

if(
restaurant_name==""||
owner_name==""||
mobile==""||
email==""||
password==""
){

alert("Please fill all fields.");

return;

}

if(password!==confirmPassword){

alert("Passwords do not match.");

return;

}

localStorage.setItem("restaurant_name",restaurant_name);
localStorage.setItem("owner_name",owner_name);
localStorage.setItem("mobile",mobile);
localStorage.setItem("email",email);
localStorage.setItem("password",password);

location.href="partner-location.html";

}

</script>

</body>

</html>
